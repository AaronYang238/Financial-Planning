<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">期权到期损益图（Hockey Stick）</text>
  <text x="360" y="48" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">行权价 = 100，权利金 = 5 元</text>
  <!-- 左：买看涨 Call Long -->
  <text x="180" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">买看涨 Long Call</text>
  <line x1="40" y1="220" x2="320" y2="220" stroke="#374151" stroke-width="1.5"/>
  <line x1="180" y1="100" x2="180" y2="340" stroke="#374151" stroke-width="1.5"/>
  <text x="320" y="235" font-size="9" fill="#6b7280">标的价</text>
  <text x="170" y="98" font-size="9" fill="#6b7280">损益</text>
  <!-- 损益线 -->
  <line x1="40" y1="250" x2="180" y2="250" stroke="#16a34a" stroke-width="3"/>
  <line x1="180" y1="250" x2="320" y2="130" stroke="#16a34a" stroke-width="3"/>
  <!-- 标注 -->
  <text x="180" y="240" font-size="10" fill="#dc2626">行权价 100</text>
  <text x="100" y="270" font-size="10" fill="#991b1b">最大亏 = 权利金 -5</text>
  <text x="240" y="120" font-size="10" fill="#14532d">收益 = 上涨幅度 - 5</text>
  <text x="240" y="135" font-size="10" font-weight="bold" fill="#14532d">理论无限</text>
  <text x="180" y="370" text-anchor="middle" font-size="10" font-style="italic" fill="#444">下不限亏（最多 -5），上无限赚</text>
  <!-- 中：买看跌 Put Long -->
  <text x="540" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">买看跌 Long Put</text>
  <line x1="400" y1="220" x2="680" y2="220" stroke="#374151" stroke-width="1.5"/>
  <line x1="540" y1="100" x2="540" y2="340" stroke="#374151" stroke-width="1.5"/>
  <text x="680" y="235" font-size="9" fill="#6b7280">标的价</text>
  <text x="530" y="98" font-size="9" fill="#6b7280">损益</text>
  <!-- 损益线 -->
  <line x1="400" y1="130" x2="540" y2="250" stroke="#2563eb" stroke-width="3"/>
  <line x1="540" y1="250" x2="680" y2="250" stroke="#2563eb" stroke-width="3"/>
  <!-- 标注 -->
  <text x="540" y="240" font-size="10" fill="#dc2626">行权价 100</text>
  <text x="460" y="120" font-size="10" fill="#1e3a8a">下跌赚（无限）</text>
  <text x="595" y="270" font-size="10" fill="#991b1b">最大亏 = -5</text>
  <text x="540" y="370" text-anchor="middle" font-size="10" font-style="italic" fill="#444">下不限赚（标的归零最赚），上不限亏 -5</text>
</svg>
