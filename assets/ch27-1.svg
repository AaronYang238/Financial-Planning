<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">非对称风险：散户用衍生品的"幸存者偏差"</text>
  <!-- 左：媒体报道的"幸存者" -->
  <rect x="40" y="60" width="320" height="280" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="200" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#14532d">媒体报道的少数（5%）</text>
  <line x1="55" y1="100" x2="345" y2="100" stroke="#16a34a" stroke-width="1"/>
  <text x="200" y="135" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">🎉 "5 万变 500 万"</text>
  <text x="200" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">"散户神话 / 财富自由"</text>
  <text x="60" y="190" font-family="sans-serif" font-size="11" fill="#14532d">• 突然爆富的散户上新闻</text>
  <text x="60" y="210" font-family="sans-serif" font-size="11" fill="#14532d">• 自媒体大力转发</text>
  <text x="60" y="230" font-family="sans-serif" font-size="11" fill="#14532d">• 形成"散户也能赢"的错觉</text>
  <text x="60" y="260" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">→ 你看到的世界</text>
  <text x="200" y="305" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#14532d">这群人下一年还能赢吗？</text>
  <text x="200" y="325" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#991b1b">大多数会"赢一次后亏光"</text>
  <!-- 右：被埋没的多数 -->
  <rect x="380" y="60" width="320" height="280" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="540" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#991b1b">沉默的大多数（95%）</text>
  <line x1="395" y1="100" x2="685" y2="100" stroke="#dc2626" stroke-width="1"/>
  <text x="540" y="135" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#991b1b">😔 亏光本金，离开市场</text>
  <text x="540" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991b1b">"半年亏 20 万 / 一年归零"</text>
  <text x="400" y="190" font-family="sans-serif" font-size="11" fill="#991b1b">• 这些人不会上新闻</text>
  <text x="400" y="210" font-family="sans-serif" font-size="11" fill="#991b1b">• 也不会发朋友圈</text>
  <text x="400" y="230" font-family="sans-serif" font-size="11" fill="#991b1b">• 静静地"卸载 APP 不玩了"</text>
  <text x="400" y="260" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">→ 你看不到的真实</text>
  <text x="540" y="305" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#991b1b">中金所数据：</text>
  <text x="540" y="325" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">期货账户 70%+ 亏损</text>
</svg>
