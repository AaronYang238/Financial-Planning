<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">可转债："攻守兼备"的两面性</text>
  <text x="360" y="48" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">股价低 → 表现为"债"；股价高 → 表现为"股"</text>
  <!-- 坐标轴 -->
  <line x1="80" y1="350" x2="680" y2="350" stroke="#374151" stroke-width="2"/>
  <line x1="80" y1="80" x2="80" y2="350" stroke="#374151" stroke-width="2"/>
  <!-- 标签 -->
  <text x="380" y="385" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">正股股价 →</text>
  <text x="40" y="215" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937" transform="rotate(-90 40 215)">可转债价格 →</text>
  <!-- Y 轴刻度 -->
  <text x="70" y="354" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">80</text>
  <text x="70" y="294" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">100</text>
  <line x1="78" y1="289" x2="80" y2="289" stroke="#6b7280" stroke-width="1"/>
  <text x="70" y="234" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">130</text>
  <line x1="78" y1="229" x2="80" y2="229" stroke="#6b7280" stroke-width="1"/>
  <text x="70" y="174" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">180</text>
  <line x1="78" y1="169" x2="80" y2="169" stroke="#6b7280" stroke-width="1"/>
  <!-- 转股价值斜线（45 度，理论） -->
  <line x1="80" y1="350" x2="650" y2="80" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="600" y="100" font-family="sans-serif" font-size="10" fill="#6b7280">转股价值（理论）</text>
  <!-- 债底水平线 -->
  <line x1="80" y1="295" x2="350" y2="295" stroke="#16a34a" stroke-width="2"/>
  <text x="100" y="285" font-family="sans-serif" font-size="10" fill="#14532d">债底支撑（≈100 元）</text>
  <!-- 实际可转债曲线（弯曲）：低位有支撑、高位接近正股 -->
  <path d="M 80 295 Q 200 290 300 270 Q 400 220 500 145 Q 580 110 650 90"
        stroke="#dc2626" stroke-width="3" fill="none"/>
  <text x="350" y="105" font-family="sans-serif" font-size="11" font-weight="bold" fill="#dc2626">可转债价格曲线</text>
  <!-- 三个区域 -->
  <rect x="80" y="270" width="180" height="80" fill="#dcfce7" opacity="0.4"/>
  <text x="170" y="335" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">债性区</text>
  <text x="170" y="350" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#14532d">价格贴近 100</text>
  <rect x="260" y="180" width="200" height="170" fill="#fef3c7" opacity="0.4"/>
  <text x="360" y="335" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78350f">平衡区</text>
  <text x="360" y="350" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#78350f">价格 100-130</text>
  <rect x="460" y="80" width="220" height="270" fill="#fee2e2" opacity="0.4"/>
  <text x="570" y="335" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">股性区</text>
  <text x="570" y="350" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#991b1b">价格 130+，强赎风险</text>
  <text x="380" y="405" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">下跌有债底保护（100 元附近），上涨随正股飙升（130 元后强赎风险）</text>
</svg>
