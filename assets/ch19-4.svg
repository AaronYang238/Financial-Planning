<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">杜邦三因子：三种"高 ROE 公司"</text>
  <!-- 利润率高 -->
  <rect x="40" y="60" width="200" height="280" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="140" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#78350f">高利润率型</text>
  <text x="140" y="108" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f">代表：茅台、海天</text>
  <line x1="60" y1="122" x2="220" y2="122" stroke="#d97706" stroke-width="1"/>
  <text x="140" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f">净利率 50%</text>
  <text x="140" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f">× 周转率 0.6</text>
  <text x="140" y="188" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f">× 杠杆 1.0</text>
  <line x1="60" y1="205" x2="220" y2="205" stroke="#d97706" stroke-width="1"/>
  <text x="140" y="230" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#78350f">= ROE 30%</text>
  <text x="140" y="275" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">特征：定价权</text>
  <text x="140" y="295" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">品牌护城河深</text>
  <text x="140" y="320" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#78350f">巴菲特最爱</text>
  <!-- 周转率高 -->
  <rect x="260" y="60" width="200" height="280" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#14532d">高周转型</text>
  <text x="360" y="108" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">代表：沃尔玛、Costco</text>
  <line x1="280" y1="122" x2="440" y2="122" stroke="#16a34a" stroke-width="1"/>
  <text x="360" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">净利率 3%</text>
  <text x="360" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">× 周转率 4.0</text>
  <text x="360" y="188" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">× 杠杆 2.0</text>
  <line x1="280" y1="205" x2="440" y2="205" stroke="#16a34a" stroke-width="1"/>
  <text x="360" y="230" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">= ROE 24%</text>
  <text x="360" y="275" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">特征：规模效率</text>
  <text x="360" y="295" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">薄利多销</text>
  <text x="360" y="320" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#14532d">芒格也认可</text>
  <!-- 高杠杆 -->
  <rect x="480" y="60" width="200" height="280" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="580" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#991b1b">高杠杆型</text>
  <text x="580" y="108" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991b1b">代表：银行</text>
  <line x1="500" y1="122" x2="660" y2="122" stroke="#dc2626" stroke-width="1"/>
  <text x="580" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991b1b">净利率 30%</text>
  <text x="580" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991b1b">× 周转率 0.05</text>
  <text x="580" y="188" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991b1b">× 杠杆 12</text>
  <line x1="500" y1="205" x2="660" y2="205" stroke="#dc2626" stroke-width="1"/>
  <text x="580" y="230" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#991b1b">= ROE 18%</text>
  <text x="580" y="275" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">特征：高杠杆</text>
  <text x="580" y="295" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">风险大</text>
  <text x="580" y="320" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#991b1b">遇危机最危险</text>
</svg>
