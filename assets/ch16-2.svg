<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">短债 vs 中长债：四个维度对比</text>
  <!-- 表头 -->
  <text x="200" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">维度</text>
  <text x="420" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e40af">短债基金</text>
  <text x="420" y="95" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">久期 ≤ 1 年</text>
  <text x="600" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#991b1b">中长债基金</text>
  <text x="600" y="95" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">久期 2-5 年</text>
  <line x1="60" y1="105" x2="680" y2="105" stroke="#374151" stroke-width="1"/>
  <!-- 年化收益 -->
  <text x="200" y="135" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">长期年化</text>
  <rect x="350" y="120" width="80" height="24" fill="#bfdbfe"/>
  <text x="420" y="138" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e40af">2-3%</text>
  <rect x="530" y="120" width="140" height="24" fill="#fca5a5"/>
  <text x="600" y="138" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7f1d1d">4-5%</text>
  <!-- 最大回撤 -->
  <text x="200" y="178" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">最大回撤</text>
  <rect x="390" y="163" width="60" height="24" fill="#86efac"/>
  <text x="420" y="181" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">-1%</text>
  <rect x="540" y="163" width="120" height="24" fill="#fb923c"/>
  <text x="600" y="181" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7c2d12">-3%</text>
  <!-- 利率敏感 -->
  <text x="200" y="221" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">利率敏感度</text>
  <text x="420" y="221" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">低</text>
  <text x="600" y="221" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">高</text>
  <!-- 适合周期 -->
  <text x="200" y="264" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">适合持有</text>
  <text x="420" y="264" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">3-12 个月</text>
  <text x="600" y="264" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">2-5 年</text>
  <!-- 利率周期 -->
  <text x="200" y="305" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">什么周期最赚</text>
  <text x="420" y="305" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e40af">加息周期防御</text>
  <text x="600" y="305" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#991b1b">降息周期猛涨</text>
  <text x="360" y="345" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">短债"安全"是相对的——它牺牲了降息周期的资本利得</text>
</svg>
