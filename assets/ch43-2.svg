<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">为什么"利好"出了股价却跌——市场炒的是预期差</text>
  <!-- axes -->
  <line x1="70" y1="300" x2="680" y2="300" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="70" y1="60" x2="70" y2="300" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="60" y="70" text-anchor="end" font-family="sans-serif" font-size="11" fill="#6b7280">股价</text>
  <text x="675" y="318" text-anchor="end" font-family="sans-serif" font-size="11" fill="#6b7280">时间</text>
  <!-- 利好兑现日 -->
  <line x1="430" y1="60" x2="430" y2="300" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="430" y="335" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#374151">利好正式公布</text>

  <!-- 已被预期 (price runs up before, drops after) -->
  <polyline points="90,260 200,230 320,150 430,110 500,160 600,180" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <text x="300" y="135" font-family="sans-serif" font-size="11" font-weight="bold" fill="#dc2626">提前涨（消息已被price in）</text>
  <text x="540" y="150" font-family="sans-serif" font-size="11" font-weight="bold" fill="#dc2626">利好出尽 → 回落</text>

  <!-- 超预期 (jumps up after) -->
  <polyline points="90,275 200,270 320,265 430,260 500,200 600,140" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <text x="500" y="125" font-family="sans-serif" font-size="11" font-weight="bold" fill="#16a34a">超预期 → 继续涨</text>

  <text x="360" y="362" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444">关键不是"消息好不好"，而是"比市场原本预期的好/坏多少"（= 预期差）</text>
</svg>
