<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">前景理论的价值函数：损失的痛苦 ≈ 2 倍同等收益的快乐</text>
  <!-- 坐标轴 -->
  <line x1="80" y1="200" x2="680" y2="200" stroke="#374151" stroke-width="2"/>
  <line x1="380" y1="60" x2="380" y2="340" stroke="#374151" stroke-width="2"/>
  <text x="685" y="205" font-family="sans-serif" font-size="10" fill="#6b7280">收益</text>
  <text x="75" y="205" font-family="sans-serif" font-size="10" fill="#6b7280" text-anchor="end">损失</text>
  <text x="395" y="55" font-family="sans-serif" font-size="10" fill="#6b7280">快乐</text>
  <text x="395" y="345" font-family="sans-serif" font-size="10" fill="#6b7280">痛苦</text>
  <!-- 收益区曲线（凹，递减边际效用） -->
  <path d="M 380 200 Q 480 145 580 120 Q 620 110 660 100" stroke="#16a34a" stroke-width="3" fill="none"/>
  <text x="540" y="95" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">收益区：边际效用递减</text>
  <text x="540" y="112" font-family="sans-serif" font-size="9" fill="#14532d">+1000 比 +500 的快乐 &lt; 2 倍</text>
  <!-- 损失区曲线（凸，且陡峭） -->
  <path d="M 380 200 Q 280 280 180 320 Q 140 335 100 340" stroke="#dc2626" stroke-width="3" fill="none"/>
  <text x="200" y="280" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">损失区：陡峭！</text>
  <text x="180" y="298" font-family="sans-serif" font-size="9" fill="#991b1b">损失 1000 的痛苦 ≈ 2 倍 收益 1000 的快乐</text>
  <!-- 关键标注：+1000 -->
  <line x1="580" y1="200" x2="580" y2="120" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="580" y="218" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">+1000</text>
  <!-- 关键标注：-1000 -->
  <line x1="180" y1="200" x2="180" y2="320" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="180" y="218" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">-1000</text>
  <!-- 痛苦/快乐对比箭头 -->
  <path d="M 600 120 Q 590 75 595 70" stroke="#16a34a" stroke-width="1.5"/>
  <text x="565" y="75" font-family="sans-serif" font-size="10" fill="#14532d">快乐 = 单位 X</text>
  <path d="M 200 320 Q 215 365 240 365" stroke="#dc2626" stroke-width="1.5"/>
  <text x="240" y="368" font-family="sans-serif" font-size="10" fill="#991b1b">痛苦 ≈ 2 倍单位 X</text>
</svg>
