<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">三表勾稽：互相印证，造假迟早露馅</text>
  <!-- 利润表 -->
  <rect x="80" y="80" width="160" height="100" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="110" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">利润表</text>
  <text x="160" y="135" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">净利润 15 亿</text>
  <text x="160" y="158" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">→ 留存收益 + 15 亿</text>
  <!-- 资产负债表 -->
  <rect x="280" y="180" width="160" height="100" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="210" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#78350f">资产负债表</text>
  <text x="360" y="235" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f">股东权益 +15 亿</text>
  <text x="360" y="258" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">应收+存货+现金变化</text>
  <!-- 现金流量表 -->
  <rect x="480" y="80" width="160" height="100" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="560" y="110" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">现金流量表</text>
  <text x="560" y="135" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">经营现金 18 亿</text>
  <text x="560" y="158" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">→ 现金资产 +18 亿</text>
  <!-- 箭头 -->
  <path d="M 160 180 L 280 210" stroke="#374151" stroke-width="2" marker-end="url(#yArr)"/>
  <text x="170" y="200" font-family="sans-serif" font-size="10" fill="#6b7280">净利润进权益</text>
  <path d="M 560 180 L 440 210" stroke="#374151" stroke-width="2" marker-end="url(#yArr)"/>
  <text x="495" y="200" font-family="sans-serif" font-size="10" fill="#6b7280">现金变化进资产</text>
  <path d="M 240 130 L 480 130" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#yArr2)"/>
  <text x="360" y="120" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#dc2626">净利润 vs 现金流 比值</text>
  <defs>
    <marker id="yArr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <marker id="yArr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
