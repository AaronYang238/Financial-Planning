<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">存款保险条例：50 万怎么赔</text>
  <!-- 场景：某银行倒闭，张三在该行有 80 万存款 -->
  <text x="360" y="56" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b7280">场景：张三在 X 银行有 80 万存款 + 利息 2 万 = 合计 82 万。X 银行被接管</text>
  <!-- 左侧：本金条 -->
  <rect x="60" y="100" width="500" height="60" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <!-- 50 万部分（绿） -->
  <rect x="60" y="100" width="305" height="60" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
  <text x="212" y="135" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">50 万（保险兜底）</text>
  <text x="212" y="152" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">7 个工作日内 100% 拿回</text>
  <!-- 30 万部分（红） -->
  <rect x="365" y="100" width="195" height="60" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
  <text x="462" y="135" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#991b1b">32 万（清算分配）</text>
  <text x="462" y="152" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">按清算比例 60-80%</text>
  <!-- 标签 -->
  <text x="60" y="92" font-family="sans-serif" font-size="11" fill="#6b7280">0</text>
  <text x="365" y="92" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#16a34a">50 万红线</text>
  <text x="560" y="92" text-anchor="end" font-family="sans-serif" font-size="11" fill="#6b7280">82 万</text>
  <!-- 计算 -->
  <rect x="60" y="200" width="600" height="160" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="230" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#78350f">张三最终能拿回多少？</text>
  <text x="80" y="258" font-family="sans-serif" font-size="12" fill="#78350f">① 保险兜底部分：50 万 × 100% = </text>
  <text x="580" y="258" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">50 万</text>
  <text x="80" y="285" font-family="sans-serif" font-size="12" fill="#78350f">② 超额部分进清算（按 70% 假设）：32 万 × 70% = </text>
  <text x="580" y="285" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b91c1c">22.4 万</text>
  <line x1="80" y1="298" x2="640" y2="298" stroke="#78350f" stroke-width="1"/>
  <text x="80" y="320" font-family="sans-serif" font-size="13" font-weight="bold" fill="#78350f">实际拿回：</text>
  <text x="580" y="320" text-anchor="end" font-family="sans-serif" font-size="15" font-weight="bold" fill="#78350f">72.4 万</text>
  <text x="80" y="345" font-family="sans-serif" font-size="13" font-weight="bold" fill="#991b1b">损失：</text>
  <text x="580" y="345" text-anchor="end" font-family="sans-serif" font-size="15" font-weight="bold" fill="#991b1b">9.6 万（约 12%）</text>
  <text x="360" y="390" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">超过 50 万的部分没有保险——所以单一银行不要存超过 50 万</text>
</svg>
