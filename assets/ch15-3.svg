<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">同一只 R2 理财：旧式 vs 新式的净值曲线</text>
  <!-- 坐标轴 -->
  <line x1="80" y1="280" x2="680" y2="280" stroke="#374151" stroke-width="2"/>
  <line x1="80" y1="60" x2="80" y2="280" stroke="#374151" stroke-width="2"/>
  <!-- Y 轴刻度 -->
  <text x="70" y="285" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">0.96</text>
  <text x="70" y="240" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">0.98</text>
  <line x1="78" y1="235" x2="80" y2="235" stroke="#6b7280" stroke-width="1"/>
  <text x="70" y="195" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">1.00</text>
  <line x1="78" y1="190" x2="80" y2="190" stroke="#6b7280" stroke-width="1"/>
  <text x="70" y="150" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">1.02</text>
  <line x1="78" y1="145" x2="80" y2="145" stroke="#6b7280" stroke-width="1"/>
  <text x="70" y="105" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">1.04</text>
  <line x1="78" y1="100" x2="80" y2="100" stroke="#6b7280" stroke-width="1"/>
  <text x="70" y="65" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">1.06</text>
  <!-- 1.0 基准线 -->
  <line x1="80" y1="190" x2="680" y2="190" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- 旧式：摊余成本法（平稳上升） -->
  <path d="M 100 190 L 200 178 L 300 168 L 400 158 L 500 145 L 600 132 L 660 124" stroke="#16a34a" stroke-width="3" fill="none"/>
  <text x="350" y="140" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">旧式（摊余成本）：看着稳</text>
  <!-- 新式：市值法（波动上升） -->
  <path d="M 100 190 Q 130 175 160 180 Q 200 168 240 175 Q 280 162 320 170 Q 360 155 400 168 Q 440 145 480 250 Q 520 235 560 220 Q 600 175 660 130" stroke="#dc2626" stroke-width="3" fill="none"/>
  <text x="500" y="280" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">新式（市值法）：真实波动</text>
  <!-- 标注"破净点" -->
  <circle cx="480" cy="250" r="6" fill="#dc2626" stroke="white" stroke-width="2"/>
  <text x="475" y="270" font-family="sans-serif" font-size="10" font-weight="bold" fill="#991b1b">2022-11 破净</text>
  <!-- X 轴 -->
  <text x="100" y="305" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">买入</text>
  <text x="200" y="305" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">3M</text>
  <text x="300" y="305" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">6M</text>
  <text x="400" y="305" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">9M</text>
  <text x="500" y="305" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">12M</text>
  <text x="600" y="305" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">15M</text>
  <text x="660" y="305" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">18M</text>
  <text x="360" y="335" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">两条曲线的"长期终点几乎一样"——区别只在"你能否看见波动"</text>
</svg>
