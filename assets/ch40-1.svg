<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">基金季报的 5 个关键页（10 分钟看完）</text>
  <!-- 第 1 页 -->
  <rect x="40" y="60" width="125" height="320" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="103" y="90" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">① 基本信息</text>
  <line x1="50" y1="100" x2="155" y2="100" stroke="#2563eb" stroke-width="1"/>
  <text x="50" y="125" font-family="sans-serif" font-size="10" fill="#1e3a8a">📊 规模变化</text>
  <text x="50" y="145" font-family="sans-serif" font-size="10" fill="#1e3a8a">👤 基金经理</text>
  <text x="50" y="165" font-family="sans-serif" font-size="10" fill="#1e3a8a">📅 任职时间</text>
  <text x="50" y="185" font-family="sans-serif" font-size="10" fill="#1e3a8a">💼 公司及行</text>
  <text x="50" y="215" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">⚠️ 危险信号：</text>
  <text x="50" y="235" font-family="sans-serif" font-size="10" fill="#991b1b">- 经理刚换</text>
  <text x="50" y="255" font-family="sans-serif" font-size="10" fill="#991b1b">- 规模 1 季暴增</text>
  <text x="50" y="275" font-family="sans-serif" font-size="10" fill="#991b1b">- 规模 1 季暴跌</text>
  <text x="103" y="350" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#1e3a8a">2 分钟</text>
  <!-- 第 2 页 -->
  <rect x="175" y="60" width="125" height="320" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="238" y="90" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14532d">② 业绩表现</text>
  <line x1="185" y1="100" x2="290" y2="100" stroke="#16a34a" stroke-width="1"/>
  <text x="185" y="125" font-family="sans-serif" font-size="10" fill="#14532d">📈 本季回报</text>
  <text x="185" y="145" font-family="sans-serif" font-size="10" fill="#14532d">📊 vs 业绩基准</text>
  <text x="185" y="165" font-family="sans-serif" font-size="10" fill="#14532d">⏱️ 近 1/3/5 年</text>
  <text x="185" y="185" font-family="sans-serif" font-size="10" fill="#14532d">📉 最大回撤</text>
  <text x="185" y="215" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">⚠️ 危险信号：</text>
  <text x="185" y="235" font-family="sans-serif" font-size="10" fill="#991b1b">- 跑输基准超 5%</text>
  <text x="185" y="255" font-family="sans-serif" font-size="10" fill="#991b1b">- 回撤异常深</text>
  <text x="185" y="275" font-family="sans-serif" font-size="10" fill="#991b1b">- 突然爆雷</text>
  <text x="238" y="350" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#14532d">2 分钟</text>
  <!-- 第 3 页（核心）-->
  <rect x="310" y="60" width="125" height="320" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="373" y="90" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350f">③ 持仓 ★</text>
  <line x1="320" y1="100" x2="425" y2="100" stroke="#d97706" stroke-width="1"/>
  <text x="320" y="125" font-family="sans-serif" font-size="10" fill="#78350f">📋 前 10 大股</text>
  <text x="320" y="145" font-family="sans-serif" font-size="10" fill="#78350f">% 占比</text>
  <text x="320" y="165" font-family="sans-serif" font-size="10" fill="#78350f">🏭 行业分布</text>
  <text x="320" y="185" font-family="sans-serif" font-size="10" fill="#78350f">📊 换手率</text>
  <text x="320" y="215" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">⚠️ 危险信号：</text>
  <text x="320" y="235" font-family="sans-serif" font-size="10" fill="#991b1b">- 前 10 占 70%+</text>
  <text x="320" y="255" font-family="sans-serif" font-size="10" fill="#991b1b">- ST 公司持仓</text>
  <text x="320" y="275" font-family="sans-serif" font-size="10" fill="#991b1b">- 行业单一 90%+</text>
  <text x="320" y="295" font-family="sans-serif" font-size="10" fill="#991b1b">- 风格漂移</text>
  <text x="373" y="350" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#78350f">3 分钟（核心）</text>
  <!-- 第 4 页 -->
  <rect x="445" y="60" width="125" height="320" rx="8" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <text x="508" y="90" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7c2d12">④ 投资者结构</text>
  <line x1="455" y1="100" x2="560" y2="100" stroke="#ea580c" stroke-width="1"/>
  <text x="455" y="125" font-family="sans-serif" font-size="10" fill="#7c2d12">🏦 机构持有 %</text>
  <text x="455" y="145" font-family="sans-serif" font-size="10" fill="#7c2d12">👥 散户持有 %</text>
  <text x="455" y="165" font-family="sans-serif" font-size="10" fill="#7c2d12">🔄 申赎比例</text>
  <text x="455" y="185" font-family="sans-serif" font-size="10" fill="#7c2d12">👨‍💼 经理自购</text>
  <text x="455" y="215" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">⚠️ 危险信号：</text>
  <text x="455" y="235" font-family="sans-serif" font-size="10" fill="#991b1b">- 机构占比骤降</text>
  <text x="455" y="255" font-family="sans-serif" font-size="10" fill="#991b1b">- 净申赎极端</text>
  <text x="455" y="275" font-family="sans-serif" font-size="10" fill="#991b1b">- 经理零自购</text>
  <text x="508" y="350" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#7c2d12">2 分钟</text>
  <!-- 第 5 页 -->
  <rect x="580" y="60" width="125" height="320" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="643" y="90" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#991b1b">⑤ 经理观点</text>
  <line x1="590" y1="100" x2="695" y2="100" stroke="#dc2626" stroke-width="1"/>
  <text x="590" y="125" font-family="sans-serif" font-size="10" fill="#991b1b">📝 季度操作回顾</text>
  <text x="590" y="145" font-family="sans-serif" font-size="10" fill="#991b1b">🔮 后市展望</text>
  <text x="590" y="165" font-family="sans-serif" font-size="10" fill="#991b1b">🎯 策略调整</text>
  <text x="590" y="195" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">观察要点：</text>
  <text x="590" y="215" font-family="sans-serif" font-size="10" fill="#991b1b">- 是否言行一致</text>
  <text x="590" y="235" font-family="sans-serif" font-size="10" fill="#991b1b">- 是否过度自信</text>
  <text x="590" y="255" font-family="sans-serif" font-size="10" fill="#991b1b">- 是否承认错误</text>
  <text x="590" y="275" font-family="sans-serif" font-size="10" fill="#991b1b">- 风格是否变了</text>
  <text x="643" y="350" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#991b1b">1 分钟</text>
</svg>
