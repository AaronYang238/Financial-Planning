<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">A 股四大宽基：按"大小盘"定位</text>
  <!-- 上证 50 -->
  <rect x="40" y="60" width="160" height="280" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">上证 50</text>
  <text x="120" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">SSE 50</text>
  <line x1="60" y1="122" x2="200" y2="122" stroke="#2563eb" stroke-width="1"/>
  <text x="120" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">超大盘股</text>
  <text x="120" y="170" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">50 只</text>
  <text x="120" y="190" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">沪市最大 50 家</text>
  <text x="120" y="220" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">代表行业：</text>
  <text x="120" y="238" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#1e3a8a">金融 / 白酒 / 能源</text>
  <text x="120" y="270" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e3a8a">风格：</text>
  <text x="120" y="288" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#1e3a8a">价值 / 稳健</text>
  <text x="120" y="320" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic" fill="#1e3a8a">"防御型"宽基</text>
  <!-- 沪深 300 -->
  <rect x="220" y="60" width="160" height="280" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="300" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#14532d">沪深 300</text>
  <text x="300" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">CSI 300</text>
  <line x1="240" y1="122" x2="380" y2="122" stroke="#16a34a" stroke-width="1"/>
  <text x="300" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">大盘股</text>
  <text x="300" y="170" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">300 只</text>
  <text x="300" y="190" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">沪深两市最大 300</text>
  <text x="300" y="220" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">代表行业：</text>
  <text x="300" y="238" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#14532d">金融 / 消费 / 医药</text>
  <text x="300" y="270" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#14532d">风格：</text>
  <text x="300" y="288" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#14532d">大盘混合（核心）</text>
  <text x="300" y="320" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic" fill="#14532d">A 股核心宽基</text>
  <!-- 中证 500 -->
  <rect x="400" y="60" width="160" height="280" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="480" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#78350f">中证 500</text>
  <text x="480" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">CSI 500</text>
  <line x1="420" y1="122" x2="560" y2="122" stroke="#d97706" stroke-width="1"/>
  <text x="480" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78350f">中盘股</text>
  <text x="480" y="170" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">500 只</text>
  <text x="480" y="190" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">沪深 300 后 500 家</text>
  <text x="480" y="220" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">代表行业：</text>
  <text x="480" y="238" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#78350f">制造 / 化工 / 科技</text>
  <text x="480" y="270" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#78350f">风格：</text>
  <text x="480" y="288" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#78350f">成长 / 弹性</text>
  <text x="480" y="320" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic" fill="#78350f">"进攻型"宽基</text>
  <!-- 中证 1000 -->
  <rect x="580" y="60" width="120" height="280" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="640" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#991b1b">中证 1000</text>
  <text x="640" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">CSI 1000</text>
  <line x1="600" y1="122" x2="680" y2="122" stroke="#dc2626" stroke-width="1"/>
  <text x="640" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">小盘股</text>
  <text x="640" y="170" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">1000 只</text>
  <text x="640" y="190" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">800 名后</text>
  <text x="640" y="220" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">行业更分散</text>
  <text x="640" y="270" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#991b1b">风格：</text>
  <text x="640" y="288" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#991b1b">高弹性 / 高波</text>
  <text x="640" y="320" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic" fill="#991b1b">极进攻</text>
</svg>
