<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">四大类衍生品：本质、机制、谁在用</text>
  <!-- 远期 -->
  <rect x="40" y="60" width="320" height="160" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">① 远期合约（Forward）</text>
  <line x1="55" y1="100" x2="345" y2="100" stroke="#2563eb" stroke-width="1"/>
  <text x="60" y="125" font-family="sans-serif" font-size="11" fill="#1e3a8a">📋 "我们约定，X 月 X 日</text>
  <text x="60" y="143" font-family="sans-serif" font-size="11" fill="#1e3a8a">     你按 5 元卖 100 吨大豆给我"</text>
  <text x="60" y="170" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">📍 场外 OTC（一对一）</text>
  <text x="60" y="188" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">👥 机构 / 大企业之间</text>
  <text x="60" y="210" font-family="sans-serif" font-size="10" font-style="italic" fill="#1e3a8a">→ 散户基本接触不到</text>
  <!-- 期货 -->
  <rect x="380" y="60" width="320" height="160" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="540" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#14532d">② 期货（Futures）</text>
  <line x1="395" y1="100" x2="685" y2="100" stroke="#16a34a" stroke-width="1"/>
  <text x="400" y="125" font-family="sans-serif" font-size="11" fill="#14532d">📋 远期的"标准化版"</text>
  <text x="400" y="143" font-family="sans-serif" font-size="11" fill="#14532d">     交易所撮合、保证金交易</text>
  <text x="400" y="170" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">📍 交易所（场内）</text>
  <text x="400" y="188" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">👥 机构 + 部分散户</text>
  <text x="400" y="210" font-family="sans-serif" font-size="10" font-style="italic" fill="#14532d">→ 散户需 50 万门槛</text>
  <!-- 期权 -->
  <rect x="40" y="240" width="320" height="160" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="200" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#78350f">③ 期权（Options）</text>
  <line x1="55" y1="280" x2="345" y2="280" stroke="#d97706" stroke-width="1"/>
  <text x="60" y="305" font-family="sans-serif" font-size="11" fill="#78350f">📋 "我有权（但无义务）</text>
  <text x="60" y="323" font-family="sans-serif" font-size="11" fill="#78350f">     按某价买/卖股票"</text>
  <text x="60" y="350" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78350f">📍 交易所（场内）+ 场外</text>
  <text x="60" y="368" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78350f">👥 机构 + 部分散户</text>
  <text x="60" y="390" font-family="sans-serif" font-size="10" font-style="italic" fill="#78350f">→ 散户需 50 万门槛 + 测试</text>
  <!-- 互换 -->
  <rect x="380" y="240" width="320" height="160" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="540" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#991b1b">④ 互换（Swap）</text>
  <line x1="395" y1="280" x2="685" y2="280" stroke="#dc2626" stroke-width="1"/>
  <text x="400" y="305" font-family="sans-serif" font-size="11" fill="#991b1b">📋 "我们交换两种现金流"</text>
  <text x="400" y="323" font-family="sans-serif" font-size="11" fill="#991b1b">     如：固定利率 ↔ 浮动利率</text>
  <text x="400" y="350" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">📍 场外 OTC（机构间）</text>
  <text x="400" y="368" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">👥 银行 / 保险 / 大型企业</text>
  <text x="400" y="390" font-family="sans-serif" font-size="10" font-style="italic" fill="#991b1b">→ 散户完全接触不到</text>
</svg>
