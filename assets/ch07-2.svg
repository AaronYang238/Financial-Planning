<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">应急金三大目标：不可能三角</text>
  <!-- 三角形 -->
  <polygon points="360,80 180,310 540,310" fill="none" stroke="#374151" stroke-width="2"/>
  <!-- 顶点：流动性 -->
  <circle cx="360" cy="80" r="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">流动性</text>
  <text x="360" y="95" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">第一位</text>
  <!-- 左下：安全性 -->
  <circle cx="180" cy="310" r="40" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="180" y="308" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">安全性</text>
  <text x="180" y="325" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">第二位</text>
  <!-- 右下：收益性 -->
  <circle cx="540" cy="310" r="40" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="540" y="308" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#991b1b">收益性</text>
  <text x="540" y="325" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">第三位（可妥协）</text>
  <!-- 中间小提示 -->
  <text x="360" y="195" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">三者不可兼得</text>
  <text x="360" y="215" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">应急金按"流动 > 安全 > 收益"取舍</text>
  <!-- 错误对比 -->
  <text x="360" y="365" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">把"收益"放第一，就不是应急金了——那是投资</text>
</svg>
