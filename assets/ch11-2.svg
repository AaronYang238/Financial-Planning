<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">债券价格 vs YTM：完美的反比关系</text>
  <!-- 坐标轴 -->
  <line x1="80" y1="290" x2="680" y2="290" stroke="#374151" stroke-width="2"/>
  <line x1="80" y1="60" x2="80" y2="290" stroke="#374151" stroke-width="2"/>
  <text x="380" y="320" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">YTM 到期收益率 →</text>
  <text x="40" y="170" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937" transform="rotate(-90 40 170)">债券价格 →</text>
  <!-- Y 轴刻度 -->
  <text x="70" y="293" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">90</text>
  <text x="70" y="230" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">95</text>
  <line x1="78" y1="225" x2="80" y2="225" stroke="#6b7280" stroke-width="1"/>
  <text x="70" y="170" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">100</text>
  <line x1="78" y1="165" x2="80" y2="165" stroke="#6b7280" stroke-width="1"/>
  <text x="70" y="110" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">105</text>
  <line x1="78" y1="105" x2="80" y2="105" stroke="#6b7280" stroke-width="1"/>
  <text x="70" y="70" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">110</text>
  <!-- X 轴刻度 -->
  <text x="180" y="305" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">3%</text>
  <line x1="180" y1="288" x2="180" y2="292" stroke="#6b7280" stroke-width="1"/>
  <text x="280" y="305" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">4%</text>
  <line x1="280" y1="288" x2="280" y2="292" stroke="#6b7280" stroke-width="1"/>
  <text x="380" y="305" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">5%</text>
  <line x1="380" y1="288" x2="380" y2="292" stroke="#6b7280" stroke-width="1"/>
  <text x="480" y="305" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">6%</text>
  <line x1="480" y1="288" x2="480" y2="292" stroke="#6b7280" stroke-width="1"/>
  <text x="580" y="305" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">7%</text>
  <line x1="580" y1="288" x2="580" y2="292" stroke="#6b7280" stroke-width="1"/>
  <!-- 反比曲线 -->
  <path d="M 180 85 Q 280 130 380 170 Q 480 220 580 260" stroke="#dc2626" stroke-width="3" fill="none"/>
  <!-- 三个关键点 -->
  <circle cx="280" cy="130" r="6" fill="#16a34a" stroke="white" stroke-width="2"/>
  <text x="225" y="125" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">104.5 元</text>
  <text x="225" y="140" font-family="sans-serif" font-size="10" fill="#14532d">YTM 4%</text>
  <text x="225" y="153" font-family="sans-serif" font-size="9" font-style="italic" fill="#14532d">利率下跌→价涨</text>
  <circle cx="380" cy="170" r="7" fill="#2563eb" stroke="white" stroke-width="2"/>
  <text x="400" y="165" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">100 元（面值）</text>
  <text x="400" y="180" font-family="sans-serif" font-size="10" fill="#1e3a8a">YTM = 票息 5%</text>
  <text x="400" y="193" font-family="sans-serif" font-size="9" font-style="italic" fill="#1e3a8a">均衡点</text>
  <circle cx="480" cy="220" r="6" fill="#dc2626" stroke="white" stroke-width="2"/>
  <text x="500" y="220" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">96 元</text>
  <text x="500" y="235" font-family="sans-serif" font-size="10" fill="#991b1b">YTM 6%</text>
  <text x="500" y="248" font-family="sans-serif" font-size="9" font-style="italic" fill="#991b1b">利率上涨→价跌</text>
</svg>
