<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">数据源金字塔：你处在哪一层</text>
  <!-- L4 顶层：原始数据 -->
  <polygon points="280,60 440,60 420,110 300,110" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="360" y="85" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">L4 原始数据</text>
  <text x="360" y="100" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#991b1b">交易所 / 央行 / 监管</text>
  <!-- L3 -->
  <polygon points="300,110 420,110 460,170 260,170" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <text x="360" y="138" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7c2d12">L3 专业终端</text>
  <text x="360" y="157" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7c2d12">万得 / Choice / 同花顺 iFinD</text>
  <!-- L2 -->
  <polygon points="260,170 460,170 500,240 220,240" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350f">L2 综合财经平台</text>
  <text x="360" y="220" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">东方财富 / 同花顺 / 雪球 / 财新 / 华尔街见闻</text>
  <!-- L1 -->
  <polygon points="220,240 500,240 540,320 180,320" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14532d">L1 散户级（90% 散户够用）</text>
  <text x="360" y="290" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">天天基金 / 蛋卷 / 晨星 / 雪球</text>
  <text x="360" y="305" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#14532d">理杏仁 / 萝卜投研 / 雪球数据</text>
  <!-- L0 底层 -->
  <polygon points="180,320 540,320 580,380 140,380" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="345" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">L0 入门级</text>
  <text x="360" y="362" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">支付宝 / 微信理财 / 券商 APP</text>
</svg>
