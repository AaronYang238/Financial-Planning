<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">5 年阶梯化：25 万分 5 份，每年到期 1 份</text>
  <!-- Y 轴：5 个存单 -->
  <text x="80" y="76" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">5万存1年</text>
  <text x="80" y="116" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#16a34a">5万存2年</text>
  <text x="80" y="156" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#d97706">5万存3年</text>
  <text x="80" y="196" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#dc2626">5万存4年</text>
  <text x="80" y="236" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7c3aed">5万存5年</text>
  <!-- X 轴：年份 -->
  <text x="150" y="285" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">第 1 年</text>
  <text x="240" y="285" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">第 2 年</text>
  <text x="330" y="285" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">第 3 年</text>
  <text x="420" y="285" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">第 4 年</text>
  <text x="510" y="285" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">第 5 年</text>
  <text x="600" y="285" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">第 6 年起</text>
  <!-- 1 年期存单 -->
  <rect x="105" y="60" width="90" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="150" y="78" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">到期 →</text>
  <rect x="195" y="60" width="450" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="420" y="78" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">续存 5 年 → 5 年后到期 → 续存 5 年...</text>
  <!-- 2 年期 -->
  <rect x="105" y="100" width="180" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="195" y="118" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">到期 →</text>
  <rect x="285" y="100" width="360" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="465" y="118" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">续存 5 年 → 5 年后到期 → 续存...</text>
  <!-- 3 年期 -->
  <rect x="105" y="140" width="270" height="30" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="240" y="158" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">到期 →</text>
  <rect x="375" y="140" width="270" height="30" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="510" y="158" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">续存 5 年</text>
  <!-- 4 年期 -->
  <rect x="105" y="180" width="360" height="30" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="285" y="198" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">到期 →</text>
  <rect x="465" y="180" width="180" height="30" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="555" y="198" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">续存 5 年</text>
  <!-- 5 年期 -->
  <rect x="105" y="220" width="450" height="30" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="330" y="238" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5b21b6">到期 →</text>
  <rect x="555" y="220" width="90" height="30" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="600" y="238" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5b21b6">续存</text>
  <!-- 底部：稳态 -->
  <line x1="555" y1="260" x2="645" y2="260" stroke="#16a34a" stroke-width="3"/>
  <text x="600" y="335" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#16a34a">稳态：每年到期 5 万，整体享 5 年期利率</text>
  <text x="360" y="365" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">前 4 年是搭建期；第 5 年起进入稳态——既有 5 年期利率，又每年有钱到期</text>
</svg>
