<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">钟形曲线：年化 6%、波动率 12% 的基金</text>
  <!-- X 轴 -->
  <line x1="80" y1="270" x2="680" y2="270" stroke="#374151" stroke-width="2"/>
  <!-- 钟形曲线 -->
  <path d="M 80 268 Q 200 268, 260 235 Q 320 175, 380 80 Q 440 175, 500 235 Q 560 268, 680 268" stroke="#2563eb" stroke-width="2.5" fill="#dbeafe" fill-opacity="0.6"/>
  <!-- 中线 -->
  <line x1="380" y1="80" x2="380" y2="270" stroke="#1e40af" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="380" y="290" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e40af">+6%</text>
  <text x="380" y="305" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">平均</text>
  <!-- 1σ 线 -->
  <line x1="320" y1="175" x2="320" y2="270" stroke="#f59e0b" stroke-width="1"/>
  <line x1="440" y1="175" x2="440" y2="270" stroke="#f59e0b" stroke-width="1"/>
  <text x="320" y="290" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#92400e">-6%</text>
  <text x="440" y="290" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#92400e">+18%</text>
  <!-- 2σ 线 -->
  <line x1="260" y1="235" x2="260" y2="270" stroke="#dc2626" stroke-width="1"/>
  <line x1="500" y1="235" x2="500" y2="270" stroke="#dc2626" stroke-width="1"/>
  <text x="260" y="290" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">-18%</text>
  <text x="500" y="290" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">+30%</text>
  <!-- 标注 -->
  <text x="380" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e40af">68% 落在这里</text>
  <text x="380" y="170" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e40af">(±1σ：-6% ~ +18%)</text>
  <text x="380" y="225" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#92400e">95% 落在 ±2σ 内</text>
  <text x="380" y="320" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">σ = 波动率 = 12%</text>
</svg>
