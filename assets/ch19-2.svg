<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">利润表瀑布：从收入到净利润</text>
  <!-- 收入 -->
  <rect x="80" y="60" width="160" height="240" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="160" y="50" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">营业收入 100</text>
  <text x="160" y="190" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">100</text>
  <!-- 营业成本 -->
  <rect x="260" y="120" width="40" height="60" fill="#fca5a5" stroke="#dc2626"/>
  <text x="280" y="115" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7f1d1d">成本</text>
  <text x="280" y="155" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f1d1d">-60</text>
  <!-- 毛利 -->
  <rect x="320" y="180" width="80" height="120" fill="#86efac" stroke="#16a34a"/>
  <text x="360" y="170" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#14532d">毛利 40</text>
  <text x="360" y="245" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">40</text>
  <!-- 销售/管理/研发 -->
  <rect x="420" y="220" width="40" height="40" fill="#fca5a5" stroke="#dc2626"/>
  <text x="440" y="215" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7f1d1d">三费</text>
  <text x="440" y="244" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f1d1d">-20</text>
  <!-- 营业利润 -->
  <rect x="480" y="260" width="80" height="40" fill="#86efac" stroke="#16a34a"/>
  <text x="520" y="250" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#14532d">营业利润 20</text>
  <text x="520" y="285" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">20</text>
  <!-- 所得税 -->
  <rect x="580" y="270" width="30" height="30" fill="#fca5a5" stroke="#dc2626"/>
  <text x="595" y="265" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7f1d1d">税</text>
  <text x="595" y="290" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f1d1d">-5</text>
  <!-- 净利润 -->
  <rect x="625" y="285" width="70" height="15" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="275" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">净利润 15</text>
  <text x="660" y="297" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="white">15</text>
  <!-- 横向标尺 -->
  <line x1="80" y1="310" x2="700" y2="310" stroke="#9ca3af" stroke-width="1"/>
  <text x="160" y="325" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">毛利率 40%</text>
  <text x="520" y="325" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">营业利润率 20%</text>
  <text x="660" y="325" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#14532d">净利率 15%</text>
</svg>
