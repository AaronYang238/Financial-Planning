<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">REITs 的现金流结构</text>
  <!-- 底层资产 -->
  <rect x="40" y="60" width="180" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="130" y="90" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">底层不动产</text>
  <text x="130" y="110" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">产业园 / 高速 / 仓储</text>
  <text x="130" y="125" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">保障房 / 数据中心</text>
  <!-- 租金/收费 -->
  <text x="270" y="85" font-family="sans-serif" font-size="11" fill="#16a34a">租金/收费</text>
  <path d="M 220 100 L 320 100" stroke="#16a34a" stroke-width="2" marker-end="url(#arrREIT1)"/>
  <!-- REITs 公司 -->
  <rect x="320" y="60" width="180" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="410" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#78350f">REITs 基金</text>
  <text x="410" y="115" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f">收租金 + 扣管理费</text>
  <!-- 分派 -->
  <text x="540" y="85" font-family="sans-serif" font-size="11" fill="#d97706">分派 90%+</text>
  <path d="M 500 100 L 600 100" stroke="#d97706" stroke-width="2" marker-end="url(#arrREIT1)"/>
  <!-- 持有人 -->
  <rect x="600" y="60" width="80" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="640" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">你</text>
  <text x="640" y="115" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">持有人</text>
  <!-- 双向：交易市场 -->
  <rect x="40" y="240" width="640" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="360" y="270" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#5b21b6">证券交易所（二级市场）</text>
  <text x="360" y="290" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5b21b6">散户可像股票一样买卖 REITs 份额</text>
  <text x="360" y="305" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5b21b6">价格 = 净值 ± 折溢价 ± 市场情绪</text>
  <!-- 双箭头 -->
  <path d="M 640 140 L 640 240" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrREIT2)"/>
  <text x="660" y="195" font-family="sans-serif" font-size="11" fill="#7c3aed">买/卖</text>
  <!-- 底部说明 -->
  <text x="360" y="358" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#444">两类收益：① 分派（类似租金）② 价差（市价波动）</text>
  <defs>
    <marker id="arrREIT1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
    <marker id="arrREIT2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
  </defs>
</svg>
