<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">中国信用债四大类：本质相似，体系不同</text>
  <text x="360" y="48" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">都是"公司借钱给散户/机构"，但监管/发行人/期限差异明显</text>
  <!-- 企业债 -->
  <rect x="40" y="70" width="155" height="340" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="117" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">企业债</text>
  <text x="117" y="118" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">Enterprise Bond</text>
  <line x1="55" y1="130" x2="180" y2="130" stroke="#2563eb" stroke-width="1"/>
  <text x="55" y="155" font-family="sans-serif" font-size="11" fill="#1e3a8a">监管：发改委</text>
  <text x="55" y="180" font-family="sans-serif" font-size="11" fill="#1e3a8a">发行人：</text>
  <text x="55" y="197" font-family="sans-serif" font-size="10" fill="#1e3a8a">国企 / 城投居多</text>
  <text x="55" y="225" font-family="sans-serif" font-size="11" fill="#1e3a8a">期限：</text>
  <text x="55" y="242" font-family="sans-serif" font-size="10" fill="#1e3a8a">5-15 年（长）</text>
  <text x="55" y="270" font-family="sans-serif" font-size="11" fill="#1e3a8a">市场：</text>
  <text x="55" y="287" font-family="sans-serif" font-size="10" fill="#1e3a8a">银行间 + 交易所</text>
  <text x="55" y="315" font-family="sans-serif" font-size="11" fill="#1e3a8a">用途：</text>
  <text x="55" y="332" font-family="sans-serif" font-size="10" fill="#1e3a8a">基建、能源等</text>
  <text x="117" y="375" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#1e3a8a">"老牌品种"</text>
  <text x="117" y="395" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">城投债主要在这里</text>
  <!-- 公司债 -->
  <rect x="205" y="70" width="155" height="340" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="282" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">公司债</text>
  <text x="282" y="118" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">Corporate Bond</text>
  <line x1="220" y1="130" x2="345" y2="130" stroke="#16a34a" stroke-width="1"/>
  <text x="220" y="155" font-family="sans-serif" font-size="11" fill="#14532d">监管：证监会</text>
  <text x="220" y="180" font-family="sans-serif" font-size="11" fill="#14532d">发行人：</text>
  <text x="220" y="197" font-family="sans-serif" font-size="10" fill="#14532d">上市/非上市公司</text>
  <text x="220" y="225" font-family="sans-serif" font-size="11" fill="#14532d">期限：</text>
  <text x="220" y="242" font-family="sans-serif" font-size="10" fill="#14532d">3-10 年</text>
  <text x="220" y="270" font-family="sans-serif" font-size="11" fill="#14532d">市场：</text>
  <text x="220" y="287" font-family="sans-serif" font-size="10" fill="#14532d">交易所为主</text>
  <text x="220" y="315" font-family="sans-serif" font-size="11" fill="#14532d">用途：</text>
  <text x="220" y="332" font-family="sans-serif" font-size="10" fill="#14532d">日常经营、再融资</text>
  <text x="282" y="375" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#14532d">"散户最易接触"</text>
  <text x="282" y="395" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">券商账户能买</text>
  <!-- 中期票据 -->
  <rect x="370" y="70" width="155" height="340" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="447" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#78350f">中期票据</text>
  <text x="447" y="118" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">MTN</text>
  <line x1="385" y1="130" x2="510" y2="130" stroke="#d97706" stroke-width="1"/>
  <text x="385" y="155" font-family="sans-serif" font-size="11" fill="#78350f">监管：交易商协会</text>
  <text x="385" y="180" font-family="sans-serif" font-size="11" fill="#78350f">发行人：</text>
  <text x="385" y="197" font-family="sans-serif" font-size="10" fill="#78350f">国企 + 大型民企</text>
  <text x="385" y="225" font-family="sans-serif" font-size="11" fill="#78350f">期限：</text>
  <text x="385" y="242" font-family="sans-serif" font-size="10" fill="#78350f">1-10 年</text>
  <text x="385" y="270" font-family="sans-serif" font-size="11" fill="#78350f">市场：</text>
  <text x="385" y="287" font-family="sans-serif" font-size="10" fill="#78350f">银行间（散户进不去）</text>
  <text x="385" y="315" font-family="sans-serif" font-size="11" fill="#78350f">用途：</text>
  <text x="385" y="332" font-family="sans-serif" font-size="10" fill="#78350f">运营资金、并购</text>
  <text x="447" y="375" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#78350f">规模最大</text>
  <text x="447" y="395" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">散户只能通过债基</text>
  <!-- 短融 -->
  <rect x="535" y="70" width="155" height="340" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="612" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#991b1b">短期融资券</text>
  <text x="612" y="118" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">短融 / 超短融</text>
  <line x1="550" y1="130" x2="675" y2="130" stroke="#dc2626" stroke-width="1"/>
  <text x="550" y="155" font-family="sans-serif" font-size="11" fill="#991b1b">监管：交易商协会</text>
  <text x="550" y="180" font-family="sans-serif" font-size="11" fill="#991b1b">发行人：</text>
  <text x="550" y="197" font-family="sans-serif" font-size="10" fill="#991b1b">资金需求紧的公司</text>
  <text x="550" y="225" font-family="sans-serif" font-size="11" fill="#991b1b">期限：</text>
  <text x="550" y="242" font-family="sans-serif" font-size="10" fill="#991b1b">≤ 1 年（超短 ≤ 270 天）</text>
  <text x="550" y="270" font-family="sans-serif" font-size="11" fill="#991b1b">市场：</text>
  <text x="550" y="287" font-family="sans-serif" font-size="10" fill="#991b1b">银行间</text>
  <text x="550" y="315" font-family="sans-serif" font-size="11" fill="#991b1b">用途：</text>
  <text x="550" y="332" font-family="sans-serif" font-size="10" fill="#991b1b">短期周转</text>
  <text x="612" y="375" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#991b1b">永煤就是超短融</text>
  <text x="612" y="395" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">短期=不等于安全</text>
</svg>
