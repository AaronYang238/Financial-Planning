<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">定投 5 年：简单年化 vs XIRR 的差距</text>
  <text x="360" y="48" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">每月 5000 元 × 60 期 + 终值 38 万 → 真实年化是多少？</text>
  <!-- 时间轴 -->
  <line x1="60" y1="180" x2="680" y2="180" stroke="#374151" stroke-width="2"/>
  <text x="60" y="200" font-size="10" fill="#6b7280">2020-1</text>
  <text x="680" y="200" font-size="10" fill="#6b7280" text-anchor="end">2024-12</text>
  <!-- 现金流向下箭头（流出）-->
  <g stroke="#dc2626" stroke-width="1.5" fill="#dc2626">
    <line x1="80" y1="180" x2="80" y2="130"/>
    <line x1="120" y1="180" x2="120" y2="130"/>
    <line x1="160" y1="180" x2="160" y2="130"/>
    <line x1="200" y1="180" x2="200" y2="130"/>
    <line x1="240" y1="180" x2="240" y2="130"/>
    <line x1="280" y1="180" x2="280" y2="130"/>
    <line x1="320" y1="180" x2="320" y2="130"/>
    <line x1="360" y1="180" x2="360" y2="130"/>
    <line x1="400" y1="180" x2="400" y2="130"/>
    <line x1="440" y1="180" x2="440" y2="130"/>
    <line x1="480" y1="180" x2="480" y2="130"/>
    <line x1="520" y1="180" x2="520" y2="130"/>
    <line x1="560" y1="180" x2="560" y2="130"/>
    <line x1="600" y1="180" x2="600" y2="130"/>
    <line x1="640" y1="180" x2="640" y2="130"/>
  </g>
  <text x="360" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">每月流出 5000 元 × 60 期 = 30 万投入</text>
  <!-- 终值流入 -->
  <path d="M 660 230 L 660 280" stroke="#16a34a" stroke-width="3" marker-end="url(#arrXIRR)"/>
  <text x="660" y="305" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">+38 万</text>
  <text x="660" y="320" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">2024 末</text>
  <!-- 三种算法对比 -->
  <rect x="80" y="240" width="200" height="100" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="180" y="262" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">❌ 简单年化（错）</text>
  <text x="180" y="280" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">(38-30)/30/5 年</text>
  <text x="180" y="298" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#991b1b">= 5.34%</text>
  <text x="180" y="320" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#991b1b">严重低估</text>
  <rect x="300" y="240" width="200" height="100" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="400" y="262" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78350f">⚠️ 简单复利（不准）</text>
  <text x="400" y="280" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">(38/30)^(1/5)-1</text>
  <text x="400" y="298" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#78350f">= 4.85%</text>
  <text x="400" y="320" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#78350f">仍然失真</text>
  <rect x="520" y="240" width="170" height="100" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="605" y="262" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">✓ XIRR（正确）</text>
  <text x="605" y="280" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">=XIRR(现金流,日期)</text>
  <text x="605" y="298" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">= 9.87%</text>
  <text x="605" y="320" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#14532d">真实年化</text>
  <defs>
    <marker id="arrXIRR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
