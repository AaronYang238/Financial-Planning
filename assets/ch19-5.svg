<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">四种护城河：你为什么离不开它</text>
  <!-- 品牌 -->
  <rect x="40" y="60" width="320" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">① 品牌（无形资产）</text>
  <text x="200" y="112" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">愿意为它多花钱</text>
  <line x1="60" y1="128" x2="340" y2="128" stroke="#2563eb" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="200" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">例子：</text>
  <text x="200" y="170" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">茅台、可口可乐、爱马仕</text>
  <text x="200" y="190" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">→ 高毛利率 70%+ 的来源</text>
  <!-- 网络效应 -->
  <rect x="380" y="60" width="320" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="540" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#14532d">② 网络效应</text>
  <text x="540" y="112" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">用的人越多，对你越有用</text>
  <line x1="400" y1="128" x2="680" y2="128" stroke="#16a34a" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="540" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">例子：</text>
  <text x="540" y="170" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">微信、淘宝、支付宝</text>
  <text x="540" y="190" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">→ 赢家通吃，护城河最深</text>
  <!-- 转换成本 -->
  <rect x="40" y="230" width="320" height="150" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="200" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#78350f">③ 转换成本</text>
  <text x="200" y="282" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f">换别家很麻烦</text>
  <line x1="60" y1="298" x2="340" y2="298" stroke="#d97706" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="200" y="320" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78350f">例子：</text>
  <text x="200" y="340" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">企业 ERP（SAP、用友）</text>
  <text x="200" y="360" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">→ 客户被"套住"</text>
  <!-- 规模优势 -->
  <rect x="380" y="230" width="320" height="150" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="540" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#991b1b">④ 规模优势</text>
  <text x="540" y="282" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991b1b">越大越便宜</text>
  <line x1="400" y1="298" x2="680" y2="298" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="540" y="320" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">例子：</text>
  <text x="540" y="340" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">海螺水泥、京东物流、台积电</text>
  <text x="540" y="360" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">→ 小公司打不过</text>
</svg>
