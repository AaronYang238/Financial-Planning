<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">金价三大驱动：方向与时效</text>
  <!-- 中心金价 -->
  <circle cx="360" cy="190" r="58" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="360" y="185" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#78350f">金价</text>
  <text x="360" y="205" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">不生息的硬资产</text>
  <!-- 驱动一：美元 -->
  <rect x="40" y="70" width="180" height="100" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">① 美元指数</text>
  <text x="130" y="115" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">反向：美元强→金跌</text>
  <text x="130" y="133" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">黄金以美元计价</text>
  <text x="130" y="153" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#1e3a8a">最强相关</text>
  <path d="M 222 140 L 302 175" stroke="#2563eb" stroke-width="2" marker-end="url(#a28)"/>
  <!-- 驱动二：实际利率 -->
  <rect x="500" y="70" width="180" height="100" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="590" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#991b1b">② 实际利率</text>
  <text x="590" y="115" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991b1b">反向：利率高→金跌</text>
  <text x="590" y="133" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">= 名义利率 − 通胀</text>
  <text x="590" y="153" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#991b1b">核心驱动（机会成本）</text>
  <path d="M 498 140 L 418 175" stroke="#dc2626" stroke-width="2" marker-end="url(#a28)"/>
  <!-- 驱动三：避险 -->
  <rect x="270" y="280" width="180" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="303" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">③ 避险情绪</text>
  <text x="360" y="322" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">战争/危机→短期飙升</text>
  <text x="360" y="337" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic" fill="#14532d">3-6 个月消化，别追</text>
  <path d="M 360 278 L 360 252" stroke="#16a34a" stroke-width="2" marker-end="url(#a28)"/>
  <!-- 例子标注 -->
  <text x="130" y="215" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">例：2022 美元加息</text>
  <text x="130" y="230" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">黄金跌至 1600</text>
  <text x="590" y="215" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">例：实际利率 -7%</text>
  <text x="590" y="230" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">黄金大涨（2022）</text>
  <defs>
    <marker id="a28" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
