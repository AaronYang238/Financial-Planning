<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">国债逆回购：资金 + 抵押的双向流动</text>
  <!-- 你 -->
  <rect x="40" y="100" width="140" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="110" y="130" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#14532d">你（出钱方）</text>
  <text x="110" y="155" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">想短期理财</text>
  <text x="110" y="172" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">不想承担信用风险</text>
  <text x="110" y="195" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">"我出钱"</text>
  <!-- 交易所 -->
  <rect x="280" y="100" width="160" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="130" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#78350f">交易所</text>
  <text x="360" y="148" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">（上交所/深交所）</text>
  <text x="360" y="170" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">中央对手方</text>
  <text x="360" y="190" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">保管国债 + 撮合交易</text>
  <!-- 借钱方 -->
  <rect x="540" y="100" width="140" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="610" y="130" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#991b1b">借钱方</text>
  <text x="610" y="148" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">券商/私募/机构</text>
  <text x="610" y="170" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">短期缺钱</text>
  <text x="610" y="195" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">"我要钱"</text>
  <!-- 资金流（上） -->
  <path d="M 180 130 L 280 130" stroke="#16a34a" stroke-width="3" marker-end="url(#greenArr10)"/>
  <path d="M 440 130 L 540 130" stroke="#16a34a" stroke-width="3" marker-end="url(#greenArr10)"/>
  <text x="360" y="92" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#16a34a">① 钱（出借日）→</text>
  <!-- 国债抵押（下） -->
  <path d="M 540 175 L 440 175" stroke="#7c3aed" stroke-width="3" marker-end="url(#purpleArr10)" stroke-dasharray="5,3"/>
  <text x="490" y="200" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7c3aed">② 国债抵押</text>
  <!-- 还钱流（下） -->
  <path d="M 540 250 L 440 250" stroke="#dc2626" stroke-width="3" marker-end="url(#redArr10)"/>
  <path d="M 280 250 L 180 250" stroke="#dc2626" stroke-width="3" marker-end="url(#redArr10)"/>
  <text x="360" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#dc2626">③ 钱 + 利息（到期日）←</text>
  <!-- 万一违约 -->
  <text x="360" y="295" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7c3aed">如果借方违约 → 交易所变现抵押的国债还你 = 几乎不可能损失</text>
  <text x="360" y="325" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#444">中国国债从未违约 → 这是市面最接近"零风险"的短期收益</text>
  <defs>
    <marker id="greenArr10" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
    <marker id="purpleArr10" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
    <marker id="redArr10" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
