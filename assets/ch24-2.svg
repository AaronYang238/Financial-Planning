<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">定投的两种命运：微笑曲线 vs 倒微笑</text>
  <!-- 左侧：微笑曲线（定投赢） -->
  <text x="180" y="60" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">微笑曲线（定投 > 一次性）</text>
  <line x1="40" y1="280" x2="320" y2="280" stroke="#374151" stroke-width="1.5"/>
  <line x1="40" y1="80" x2="40" y2="280" stroke="#374151" stroke-width="1.5"/>
  <!-- 微笑曲线：先跌后涨 -->
  <path d="M 40 130 Q 130 270 220 250 Q 280 160 320 100" stroke="#16a34a" stroke-width="3" fill="none"/>
  <text x="40" y="290" font-size="9" fill="#6b7280">起</text>
  <text x="320" y="290" font-size="9" fill="#6b7280">终</text>
  <text x="180" y="295" text-anchor="middle" font-size="10" fill="#6b7280">时间</text>
  <!-- 定投点 -->
  <circle cx="40" cy="130" r="4" fill="#16a34a"/>
  <circle cx="100" cy="225" r="4" fill="#16a34a"/>
  <circle cx="160" cy="270" r="4" fill="#16a34a"/>
  <circle cx="220" cy="250" r="4" fill="#16a34a"/>
  <circle cx="280" cy="160" r="4" fill="#16a34a"/>
  <circle cx="320" cy="100" r="4" fill="#16a34a"/>
  <text x="180" y="320" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#14532d">起点跌、中间深跌、终点涨</text>
  <text x="180" y="335" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">→ 低位多买便宜筹码</text>
  <text x="180" y="350" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#14532d">→ 定投平均成本低，最后涨上来大赚</text>
  <!-- 分割线 -->
  <line x1="360" y1="60" x2="360" y2="370" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- 右侧：倒微笑（定投亏） -->
  <text x="540" y="60" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#991b1b">倒微笑（一次性 > 定投）</text>
  <line x1="400" y1="280" x2="680" y2="280" stroke="#374151" stroke-width="1.5"/>
  <line x1="400" y1="80" x2="400" y2="280" stroke="#374151" stroke-width="1.5"/>
  <!-- 倒微笑：先涨后跌 -->
  <path d="M 400 250 Q 490 110 580 130 Q 640 220 680 250" stroke="#dc2626" stroke-width="3" fill="none"/>
  <text x="400" y="290" font-size="9" fill="#6b7280">起</text>
  <text x="680" y="290" font-size="9" fill="#6b7280">终</text>
  <text x="540" y="295" text-anchor="middle" font-size="10" fill="#6b7280">时间</text>
  <!-- 定投点 -->
  <circle cx="400" cy="250" r="4" fill="#dc2626"/>
  <circle cx="460" cy="160" r="4" fill="#dc2626"/>
  <circle cx="520" cy="115" r="4" fill="#dc2626"/>
  <circle cx="580" cy="130" r="4" fill="#dc2626"/>
  <circle cx="640" cy="220" r="4" fill="#dc2626"/>
  <circle cx="680" cy="250" r="4" fill="#dc2626"/>
  <text x="540" y="320" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#991b1b">起点低、中间高、终点又跌回低</text>
  <text x="540" y="335" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">→ 高位多买昂贵筹码</text>
  <text x="540" y="350" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#991b1b">→ 定投平均成本高，最后跌下来大亏</text>
</svg>
