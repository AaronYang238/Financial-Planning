<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">个税综合所得税率表（年度）</text>
  <!-- 表头 -->
  <line x1="60" y1="60" x2="680" y2="60" stroke="#374151" stroke-width="1.5"/>
  <text x="180" y="80" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#374151">年应纳税所得额</text>
  <text x="400" y="80" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#374151">税率</text>
  <text x="540" y="80" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#374151">速算扣除</text>
  <text x="640" y="80" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#374151">边际</text>
  <line x1="60" y1="90" x2="680" y2="90" stroke="#374151" stroke-width="1"/>
  <!-- 第 1 级 -->
  <rect x="60" y="100" width="620" height="34" fill="#dcfce7"/>
  <text x="180" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">≤ 36,000</text>
  <text x="400" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">3%</text>
  <text x="540" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">0</text>
  <text x="640" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">最低</text>
  <!-- 第 2 级 -->
  <rect x="60" y="134" width="620" height="34" fill="#bbf7d0"/>
  <text x="180" y="156" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">36,001 - 144,000</text>
  <text x="400" y="156" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">10%</text>
  <text x="540" y="156" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">2,520</text>
  <text x="640" y="156" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d"></text>
  <!-- 第 3 级 -->
  <rect x="60" y="168" width="620" height="34" fill="#fef3c7"/>
  <text x="180" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f">144,001 - 300,000</text>
  <text x="400" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78350f">20%</text>
  <text x="540" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f">16,920</text>
  <text x="640" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f"></text>
  <!-- 第 4 级 -->
  <rect x="60" y="202" width="620" height="34" fill="#fed7aa"/>
  <text x="180" y="224" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7c2d12">300,001 - 420,000</text>
  <text x="400" y="224" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7c2d12">25%</text>
  <text x="540" y="224" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7c2d12">31,920</text>
  <text x="640" y="224" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7c2d12">中等</text>
  <!-- 第 5 级 -->
  <rect x="60" y="236" width="620" height="34" fill="#fee2e2"/>
  <text x="180" y="258" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991b1b">420,001 - 660,000</text>
  <text x="400" y="258" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">30%</text>
  <text x="540" y="258" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991b1b">52,920</text>
  <text x="640" y="258" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991b1b"></text>
  <!-- 第 6 级 -->
  <rect x="60" y="270" width="620" height="34" fill="#fca5a5"/>
  <text x="180" y="292" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991b1b">660,001 - 960,000</text>
  <text x="400" y="292" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">35%</text>
  <text x="540" y="292" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991b1b">85,920</text>
  <text x="640" y="292" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991b1b">高</text>
  <!-- 第 7 级 -->
  <rect x="60" y="304" width="620" height="34" fill="#7f1d1d"/>
  <text x="180" y="326" text-anchor="middle" font-family="sans-serif" font-size="11" fill="white">> 960,000</text>
  <text x="400" y="326" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="white">45%</text>
  <text x="540" y="326" text-anchor="middle" font-family="sans-serif" font-size="11" fill="white">181,920</text>
  <text x="640" y="326" text-anchor="middle" font-family="sans-serif" font-size="11" fill="white">最高</text>
  <line x1="60" y1="338" x2="680" y2="338" stroke="#374151" stroke-width="1.5"/>
  <text x="360" y="365" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#444">应纳税额 = 应纳税所得额 × 税率 - 速算扣除</text>
  <text x="360" y="382" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">累进 = 多挣一块钱按"最高一档"算多挣的那部分</text>
</svg>
