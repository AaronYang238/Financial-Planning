<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">利率变动 1% 对不同期限债券的影响</text>
  <!-- 基准线 0 -->
  <line x1="80" y1="190" x2="680" y2="190" stroke="#374151" stroke-width="2"/>
  <text x="70" y="194" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#374151">0%</text>
  <!-- Y 轴 -->
  <line x1="80" y1="60" x2="80" y2="320" stroke="#374151" stroke-width="2"/>
  <text x="70" y="100" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">+15%</text>
  <line x1="78" y1="95" x2="80" y2="95" stroke="#6b7280"/>
  <text x="70" y="145" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">+8%</text>
  <line x1="78" y1="140" x2="80" y2="140" stroke="#6b7280"/>
  <text x="70" y="235" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">-8%</text>
  <line x1="78" y1="230" x2="80" y2="230" stroke="#6b7280"/>
  <text x="70" y="285" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">-15%</text>
  <line x1="78" y1="280" x2="80" y2="280" stroke="#6b7280"/>
  <!-- 利率下降 1% -->
  <text x="200" y="50" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#16a34a">利率下降 1%</text>
  <!-- 1 年 +1% -->
  <rect x="120" y="180" width="40" height="10" fill="#86efac" stroke="#16a34a" stroke-width="1"/>
  <text x="140" y="175" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">+1%</text>
  <text x="140" y="335" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">1 年期</text>
  <!-- 5 年 +4.3% -->
  <rect x="180" y="148" width="40" height="42" fill="#86efac" stroke="#16a34a" stroke-width="1"/>
  <text x="200" y="143" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">+4.3%</text>
  <text x="200" y="335" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">5 年期</text>
  <!-- 10 年 +8.5% -->
  <rect x="240" y="105" width="40" height="85" fill="#86efac" stroke="#16a34a" stroke-width="1"/>
  <text x="260" y="100" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">+8.5%</text>
  <text x="260" y="335" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">10 年期</text>
  <!-- 30 年 +18% -->
  <rect x="300" y="60" width="40" height="130" fill="#16a34a" stroke="#14532d" stroke-width="1"/>
  <text x="320" y="55" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#14532d">+18%</text>
  <text x="320" y="335" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">30 年期</text>
  <!-- 分隔虚线 -->
  <line x1="380" y1="60" x2="380" y2="320" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- 利率上升 1% -->
  <text x="540" y="50" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626">利率上升 1%</text>
  <!-- 1 年 -1% -->
  <rect x="420" y="190" width="40" height="10" fill="#fca5a5" stroke="#dc2626" stroke-width="1"/>
  <text x="440" y="215" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">-1%</text>
  <text x="440" y="335" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">1 年期</text>
  <!-- 5 年 -4.3% -->
  <rect x="480" y="190" width="40" height="42" fill="#fca5a5" stroke="#dc2626" stroke-width="1"/>
  <text x="500" y="245" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">-4.3%</text>
  <text x="500" y="335" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">5 年期</text>
  <!-- 10 年 -8.5% -->
  <rect x="540" y="190" width="40" height="85" fill="#fca5a5" stroke="#dc2626" stroke-width="1"/>
  <text x="560" y="288" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">-8.5%</text>
  <text x="560" y="335" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">10 年期</text>
  <!-- 30 年 -18% -->
  <rect x="600" y="190" width="40" height="130" fill="#dc2626" stroke="#7f1d1d" stroke-width="1"/>
  <text x="620" y="333" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#7f1d1d">-18%</text>
  <text x="620" y="348" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">30 年期</text>
</svg>
