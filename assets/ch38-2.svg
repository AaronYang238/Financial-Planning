<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">同一笔定投（5 年投 30 万 → 38 万），五种"率"五个答案</text>
  <!-- 横向条形对比 -->
  <line x1="230" y1="60 " x2="230" y2="300" stroke="#374151" stroke-width="2"/>
  <!-- 累计收益率 26.67% -->
  <text x="222" y="88" text-anchor="end" font-family="sans-serif" font-size="11" fill="#1f2937">累计收益率</text>
  <rect x="230" y="72" width="400" height="24" fill="#93c5fd"/>
  <text x="640" y="89" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">26.67%</text>
  <text x="240" y="89" font-family="sans-serif" font-size="9" fill="#1e3a8a">平台爱显示这个（看着最大）</text>
  <!-- 简单年化 5.34% -->
  <text x="222" y="136" text-anchor="end" font-family="sans-serif" font-size="11" fill="#1f2937">简单年化</text>
  <rect x="230" y="120" width="80" height="24" fill="#fca5a5"/>
  <text x="320" y="137" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7f1d1d">5.34% ❌ 错的，别用</text>
  <!-- CAGR 4.85% -->
  <text x="222" y="184" text-anchor="end" font-family="sans-serif" font-size="11" fill="#1f2937">几何年化 CAGR</text>
  <rect x="230" y="168" width="73" height="24" fill="#fcd34d"/>
  <text x="313" y="185" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78350f">4.85% ⚠ 不准（假设 30 万从第一天就在场）</text>
  <!-- XIRR 9.87% -->
  <text x="222" y="232" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">XIRR ★</text>
  <rect x="230" y="216" width="148" height="24" fill="#4ade80"/>
  <text x="388" y="233" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">9.87% ✓ 正确（每笔钱按实际在场时间算）</text>
  <!-- TWR 9.87% -->
  <text x="222" y="280" text-anchor="end" font-family="sans-serif" font-size="11" fill="#1f2937">时间加权 TWR</text>
  <rect x="230" y="264" width="148" height="24" fill="#86efac"/>
  <text x="388" y="281" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">9.87%（评价基金本身，剥离你的申赎）</text>
  <!-- 底注 -->
  <text x="360" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">评自己的钱用 XIRR，评基金经理用 TWR——两者差距 = 你"择时操作"的贡献（常为负）</text>
</svg>
