<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">保障型保险四大类</text>
  <!-- 重疾险 -->
  <rect x="40" y="60" width="155" height="320" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="117" y="90" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">① 重疾险 ★</text>
  <text x="117" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">最优先</text>
  <line x1="55" y1="120" x2="180" y2="120" stroke="#16a34a" stroke-width="1"/>
  <text x="55" y="145" font-family="sans-serif" font-size="11" fill="#14532d">💰 保额：</text>
  <text x="55" y="162" font-family="sans-serif" font-size="10" fill="#14532d">年收入 5 倍以上</text>
  <text x="55" y="185" font-family="sans-serif" font-size="11" fill="#14532d">💸 保费：</text>
  <text x="55" y="202" font-family="sans-serif" font-size="10" fill="#14532d">30 岁 50 万保额</text>
  <text x="55" y="217" font-family="sans-serif" font-size="10" fill="#14532d">年缴约 5,000-8,000</text>
  <text x="55" y="240" font-family="sans-serif" font-size="11" fill="#14532d">📋 赔付：</text>
  <text x="55" y="257" font-family="sans-serif" font-size="10" fill="#14532d">确诊即赔（120 种）</text>
  <text x="55" y="280" font-family="sans-serif" font-size="11" fill="#14532d">⏰ 期限：</text>
  <text x="55" y="297" font-family="sans-serif" font-size="10" fill="#14532d">保 70 岁 / 终身</text>
  <text x="117" y="335" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">应对：</text>
  <text x="117" y="355" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">病后收入中断</text>
  <text x="117" y="370" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">+ 高额治疗</text>
  <!-- 医疗险 -->
  <rect x="205" y="60" width="155" height="320" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="282" y="90" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">② 百万医疗 ★</text>
  <text x="282" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">几乎必备</text>
  <line x1="220" y1="120" x2="345" y2="120" stroke="#2563eb" stroke-width="1"/>
  <text x="220" y="145" font-family="sans-serif" font-size="11" fill="#1e3a8a">💰 保额：</text>
  <text x="220" y="162" font-family="sans-serif" font-size="10" fill="#1e3a8a">300-600 万</text>
  <text x="220" y="185" font-family="sans-serif" font-size="11" fill="#1e3a8a">💸 保费：</text>
  <text x="220" y="202" font-family="sans-serif" font-size="10" fill="#1e3a8a">30 岁年缴 200-400</text>
  <text x="220" y="217" font-family="sans-serif" font-size="10" fill="#1e3a8a">极高杠杆</text>
  <text x="220" y="240" font-family="sans-serif" font-size="11" fill="#1e3a8a">📋 赔付：</text>
  <text x="220" y="257" font-family="sans-serif" font-size="10" fill="#1e3a8a">实报实销</text>
  <text x="220" y="280" font-family="sans-serif" font-size="11" fill="#1e3a8a">⚠️ 期限：</text>
  <text x="220" y="297" font-family="sans-serif" font-size="10" fill="#1e3a8a">**一年一续保**</text>
  <text x="282" y="335" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">应对：</text>
  <text x="282" y="355" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">大额医疗费</text>
  <text x="282" y="370" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">（社保外）</text>
  <!-- 意外险 -->
  <rect x="370" y="60" width="155" height="320" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="447" y="90" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#78350f">③ 意外险 ★</text>
  <text x="447" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">便宜必备</text>
  <line x1="385" y1="120" x2="510" y2="120" stroke="#d97706" stroke-width="1"/>
  <text x="385" y="145" font-family="sans-serif" font-size="11" fill="#78350f">💰 保额：</text>
  <text x="385" y="162" font-family="sans-serif" font-size="10" fill="#78350f">100-300 万</text>
  <text x="385" y="185" font-family="sans-serif" font-size="11" fill="#78350f">💸 保费：</text>
  <text x="385" y="202" font-family="sans-serif" font-size="10" fill="#78350f">每年 200-500</text>
  <text x="385" y="217" font-family="sans-serif" font-size="10" fill="#78350f">最便宜</text>
  <text x="385" y="240" font-family="sans-serif" font-size="11" fill="#78350f">📋 赔付：</text>
  <text x="385" y="257" font-family="sans-serif" font-size="10" fill="#78350f">意外伤残 / 身故</text>
  <text x="385" y="280" font-family="sans-serif" font-size="11" fill="#78350f">⏰ 期限：</text>
  <text x="385" y="297" font-family="sans-serif" font-size="10" fill="#78350f">一年期</text>
  <text x="447" y="335" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78350f">应对：</text>
  <text x="447" y="355" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">车祸 / 高空坠落</text>
  <text x="447" y="370" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">意外身故</text>
  <!-- 寿险 -->
  <rect x="535" y="60" width="155" height="320" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="612" y="90" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#991b1b">④ 定期寿险</text>
  <text x="612" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">有家庭责任时</text>
  <line x1="550" y1="120" x2="675" y2="120" stroke="#dc2626" stroke-width="1"/>
  <text x="550" y="145" font-family="sans-serif" font-size="11" fill="#991b1b">💰 保额：</text>
  <text x="550" y="162" font-family="sans-serif" font-size="10" fill="#991b1b">100-500 万</text>
  <text x="550" y="185" font-family="sans-serif" font-size="11" fill="#991b1b">💸 保费：</text>
  <text x="550" y="202" font-family="sans-serif" font-size="10" fill="#991b1b">30 岁 100 万</text>
  <text x="550" y="217" font-family="sans-serif" font-size="10" fill="#991b1b">年缴约 1,500-3,000</text>
  <text x="550" y="240" font-family="sans-serif" font-size="11" fill="#991b1b">📋 赔付：</text>
  <text x="550" y="257" font-family="sans-serif" font-size="10" fill="#991b1b">身故 / 全残</text>
  <text x="550" y="280" font-family="sans-serif" font-size="11" fill="#991b1b">⏰ 期限：</text>
  <text x="550" y="297" font-family="sans-serif" font-size="10" fill="#991b1b">保 20/30 年</text>
  <text x="612" y="335" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">应对：</text>
  <text x="612" y="355" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">家庭顶梁柱</text>
  <text x="612" y="370" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">早逝留贷款 + 老小</text>
</svg>
