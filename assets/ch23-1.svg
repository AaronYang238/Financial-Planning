<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">主动基金规模 vs 历史超额收益（vs 沪深300，示意）</text>
  <text x="360" y="48" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">基于中国市场近 10 年统计的"规模魔咒"规律</text>
  <!-- 坐标轴 -->
  <line x1="80" y1="300" x2="680" y2="300" stroke="#374151" stroke-width="2"/>
  <line x1="80" y1="80" x2="80" y2="300" stroke="#374151" stroke-width="2"/>
  <!-- Y 轴 -->
  <text x="70" y="304" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">-2%</text>
  <text x="70" y="260" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">0%</text>
  <line x1="78" y1="255" x2="80" y2="255" stroke="#6b7280" stroke-width="1"/>
  <text x="70" y="215" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">+2%</text>
  <line x1="78" y1="210" x2="80" y2="210" stroke="#6b7280" stroke-width="1"/>
  <text x="70" y="170" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">+4%</text>
  <line x1="78" y1="165" x2="80" y2="165" stroke="#6b7280" stroke-width="1"/>
  <text x="70" y="125" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">+6%</text>
  <line x1="78" y1="120" x2="80" y2="120" stroke="#6b7280" stroke-width="1"/>
  <text x="40" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#374151" transform="rotate(-90 40 190)">年化超额收益</text>
  <!-- X 轴 -->
  <text x="380" y="328" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#374151">基金规模（亿元）</text>
  <text x="120" y="318" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">5</text>
  <text x="220" y="318" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">30</text>
  <text x="320" y="318" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">100</text>
  <text x="420" y="318" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">300</text>
  <text x="520" y="318" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">500</text>
  <text x="620" y="318" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">800+</text>
  <!-- 基准线 0% -->
  <line x1="80" y1="255" x2="680" y2="255" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="685" y="258" font-family="sans-serif" font-size="10" fill="#6b7280">指数（基准）</text>
  <!-- 曲线 -->
  <path d="M 120 130 Q 220 145 320 175 Q 420 215 520 250 Q 620 280 670 295" stroke="#dc2626" stroke-width="3" fill="none"/>
  <!-- 数据点 -->
  <circle cx="120" cy="130" r="6" fill="#16a34a" stroke="white" stroke-width="2"/>
  <text x="120" y="115" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#14532d">+5%</text>
  <circle cx="220" cy="145" r="6" fill="#16a34a" stroke="white" stroke-width="2"/>
  <text x="220" y="135" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#14532d">+4.5%</text>
  <circle cx="320" cy="175" r="6" fill="#f59e0b" stroke="white" stroke-width="2"/>
  <text x="320" y="165" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#92400e">+3%</text>
  <circle cx="420" cy="215" r="6" fill="#f59e0b" stroke="white" stroke-width="2"/>
  <text x="420" y="205" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#92400e">+1%</text>
  <circle cx="520" cy="250" r="6" fill="#dc2626" stroke="white" stroke-width="2"/>
  <text x="520" y="240" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#991b1b">+0.2%</text>
  <circle cx="620" cy="280" r="6" fill="#dc2626" stroke="white" stroke-width="2"/>
  <text x="620" y="295" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#991b1b">-1.5%</text>
  <!-- 甜蜜区标注 -->
  <rect x="100" y="100" width="200" height="60" fill="#dcfce7" opacity="0.4"/>
  <text x="200" y="95" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#14532d">"甜蜜区" 5-50 亿</text>
  <!-- 死亡区 -->
  <rect x="470" y="240" width="200" height="55" fill="#fee2e2" opacity="0.4"/>
  <text x="570" y="365" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#991b1b">"死亡区" 500 亿+</text>
</svg>
