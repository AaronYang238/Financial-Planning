<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">10 万元 · 年化 5% · 单利 vs 复利</text>
  <!-- 坐标轴 -->
  <line x1="70" y1="330" x2="700" y2="330" stroke="#374151" stroke-width="2"/>
  <line x1="70" y1="330" x2="70" y2="60" stroke="#374151" stroke-width="2"/>
  <!-- 横轴 -->
  <text x="70" y="350" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">0</text>
  <text x="175" y="350" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">5年</text>
  <text x="280" y="350" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">10年</text>
  <text x="385" y="350" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">15年</text>
  <text x="490" y="350" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">20年</text>
  <text x="595" y="350" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">25年</text>
  <text x="700" y="350" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">30年</text>
  <!-- 纵轴 -->
  <line x1="66" y1="330" x2="70" y2="330" stroke="#374151"/>
  <text x="60" y="334" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">10万</text>
  <line x1="66" y1="262" x2="70" y2="262" stroke="#374151"/>
  <text x="60" y="266" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">20万</text>
  <line x1="66" y1="195" x2="70" y2="195" stroke="#374151"/>
  <text x="60" y="199" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">30万</text>
  <line x1="66" y1="127" x2="70" y2="127" stroke="#374151"/>
  <text x="60" y="131" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">40万</text>
  <!-- 网格 -->
  <line x1="70" y1="262" x2="700" y2="262" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="70" y1="195" x2="700" y2="195" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="70" y1="127" x2="700" y2="127" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <!-- 单利直线 -->
  <line x1="70" y1="330" x2="700" y2="160" stroke="#3b82f6" stroke-width="2.5" fill="none"/>
  <text x="630" y="178" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e40af">单利 25 万</text>
  <!-- 复利曲线（取关键点平滑） -->
  <path d="M 70 330 Q 200 320, 280 295 Q 380 270, 490 222 Q 580 175, 700 70" stroke="#dc2626" stroke-width="2.5" fill="none"/>
  <text x="630" y="62" font-family="sans-serif" font-size="12" font-weight="bold" fill="#991b1b">复利 43 万</text>
  <!-- 差额标注 -->
  <line x1="680" y1="160" x2="680" y2="70" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="558" y="115" font-family="sans-serif" font-size="11" fill="#b45309">↑ 30 年差出 18 万</text>
</svg>
