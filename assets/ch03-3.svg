<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">不同资产 × 不同通胀环境：表现热力图</text>
  <!-- 表头 -->
  <text x="140" y="78" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">资产</text>
  <text x="260" y="78" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">低通胀</text>
  <text x="260" y="92" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">&lt; 2%</text>
  <text x="370" y="78" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">温和通胀</text>
  <text x="370" y="92" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">2%–4%</text>
  <text x="480" y="78" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">高通胀</text>
  <text x="480" y="92" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">&gt; 5%</text>
  <text x="590" y="78" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">通缩</text>
  <text x="590" y="92" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">&lt; 0%</text>
  <!-- 分隔线 -->
  <line x1="60" y1="100" x2="660" y2="100" stroke="#374151" stroke-width="1"/>
  <!-- 单元格颜色映射: 绿好/灰中性/红差 -->
  <!-- 现金 -->
  <text x="140" y="125" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">现金/活期</text>
  <rect x="215" y="108" width="90" height="30" fill="#e5e7eb"/><text x="260" y="128" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">持平</text>
  <rect x="325" y="108" width="90" height="30" fill="#fed7aa"/><text x="370" y="128" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7c2d12">微负</text>
  <rect x="435" y="108" width="90" height="30" fill="#fca5a5"/><text x="480" y="128" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7f1d1d">严重负</text>
  <rect x="545" y="108" width="90" height="30" fill="#86efac"/><text x="590" y="128" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">正</text>
  <!-- 定存/货基 -->
  <text x="140" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">定存/货币基金</text>
  <rect x="215" y="141" width="90" height="30" fill="#bbf7d0"/><text x="260" y="161" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">微正</text>
  <rect x="325" y="141" width="90" height="30" fill="#e5e7eb"/><text x="370" y="161" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">持平</text>
  <rect x="435" y="141" width="90" height="30" fill="#fca5a5"/><text x="480" y="161" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7f1d1d">负</text>
  <rect x="545" y="141" width="90" height="30" fill="#bbf7d0"/><text x="590" y="161" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">略正</text>
  <!-- 长期债券 -->
  <text x="140" y="191" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">长期债券</text>
  <rect x="215" y="174" width="90" height="30" fill="#bbf7d0"/><text x="260" y="194" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">正</text>
  <rect x="325" y="174" width="90" height="30" fill="#e5e7eb"/><text x="370" y="194" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">持平</text>
  <rect x="435" y="174" width="90" height="30" fill="#fca5a5"/><text x="480" y="194" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7f1d1d">负</text>
  <rect x="545" y="174" width="90" height="30" fill="#4ade80"/><text x="590" y="194" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">大正</text>
  <!-- 股票 -->
  <text x="140" y="224" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">股票（整体）</text>
  <rect x="215" y="207" width="90" height="30" fill="#bbf7d0"/><text x="260" y="227" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">正</text>
  <rect x="325" y="207" width="90" height="30" fill="#bbf7d0"/><text x="370" y="227" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">正</text>
  <rect x="435" y="207" width="90" height="30" fill="#fed7aa"/><text x="480" y="227" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7c2d12">波动大</text>
  <rect x="545" y="207" width="90" height="30" fill="#fca5a5"/><text x="590" y="227" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7f1d1d">负</text>
  <!-- 房地产 -->
  <text x="140" y="257" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">房地产</text>
  <rect x="215" y="240" width="90" height="30" fill="#bbf7d0"/><text x="260" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">正</text>
  <rect x="325" y="240" width="90" height="30" fill="#bbf7d0"/><text x="370" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">正</text>
  <rect x="435" y="240" width="90" height="30" fill="#fed7aa"/><text x="480" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7c2d12">看地段</text>
  <rect x="545" y="240" width="90" height="30" fill="#fca5a5"/><text x="590" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7f1d1d">负</text>
  <!-- 黄金 -->
  <text x="140" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">黄金</text>
  <rect x="215" y="273" width="90" height="30" fill="#e5e7eb"/><text x="260" y="293" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">弱</text>
  <rect x="325" y="273" width="90" height="30" fill="#e5e7eb"/><text x="370" y="293" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">弱</text>
  <rect x="435" y="273" width="90" height="30" fill="#4ade80"/><text x="480" y="293" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">强</text>
  <rect x="545" y="273" width="90" height="30" fill="#e5e7eb"/><text x="590" y="293" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">弱</text>
  <!-- 大宗商品 -->
  <text x="140" y="323" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">大宗商品</text>
  <rect x="215" y="306" width="90" height="30" fill="#e5e7eb"/><text x="260" y="326" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">弱</text>
  <rect x="325" y="306" width="90" height="30" fill="#e5e7eb"/><text x="370" y="326" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">弱</text>
  <rect x="435" y="306" width="90" height="30" fill="#4ade80"/><text x="480" y="326" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">强</text>
  <rect x="545" y="306" width="90" height="30" fill="#fca5a5"/><text x="590" y="326" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7f1d1d">负</text>
  <text x="360" y="370" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">绿=好  灰=中性  橙=差  红=很差。所以理财要"配置"而不是"押注一种"</text>
</svg>
