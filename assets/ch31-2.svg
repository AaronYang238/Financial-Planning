<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">保险配置金字塔：先保障，后储蓄</text>
  <!-- L4 不要（顶端） -->
  <polygon points="310,60 410,60 390,105 330,105" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="360" y="88" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#991b1b">L4 不要 0%</text>
  <text x="510" y="80" font-family="sans-serif" font-size="10" fill="#991b1b">"返本重疾"分红主险、境外保险</text>
  <!-- L3 慎重 -->
  <polygon points="330,115 390,115 420,170 300,170" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <text x="360" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7c2d12">L3 慎重 ≤20%</text>
  <text x="520" y="145" font-family="sans-serif" font-size="10" fill="#7c2d12">储蓄型：年金 / 增额终身寿</text>
  <text x="520" y="160" font-family="sans-serif" font-size="9" font-style="italic" fill="#7c2d12">必须先算 IRR 再买</text>
  <!-- L2 视情况 -->
  <polygon points="300,180 420,180 450,235 270,235" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="213" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350f">L2 视情况 20%</text>
  <text x="540" y="210" font-family="sans-serif" font-size="10" fill="#78350f">定期寿险</text>
  <text x="540" y="225" font-family="sans-serif" font-size="9" font-style="italic" fill="#78350f">有房贷 / 孩子的家庭支柱必备</text>
  <!-- L1 必备（底座） -->
  <polygon points="270,245 450,245 490,310 230,310" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="360" y="275" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">L1 必备 60-70%</text>
  <text x="360" y="297" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">百万医疗 + 重疾险 + 意外险</text>
  <text x="580" y="280" font-family="sans-serif" font-size="10" fill="#14532d">先把"大病不返贫"</text>
  <text x="580" y="295" font-family="sans-serif" font-size="10" fill="#14532d">的底座打牢</text>
  <!-- 左侧箭头标注 -->
  <text x="150" y="90" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">↑ 优先级最低</text>
  <text x="150" y="290" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">↓ 优先级最高</text>
  <line x1="150" y1="105" x2="150" y2="270" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a31)"/>
  <text x="360" y="350" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">占比 = 占家庭年保费预算的比例。顺序错了（先买储蓄型）= 最常见的保险坑</text>
  <defs>
    <marker id="a31" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
