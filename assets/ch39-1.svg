<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">五兄弟函数：知道任意四个，求第五个</text>
  <!-- 中心 -->
  <circle cx="360" cy="195" r="62" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="360" y="188" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#78350f">一笔钱的</text>
  <text x="360" y="208" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#78350f">时间故事</text>
  <!-- FV -->
  <rect x="290" y="55" width="140" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">FV 未来值</text>
  <text x="360" y="98" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#14532d">30 年后有多少？</text>
  <line x1="360" y1="113" x2="360" y2="131" stroke="#9ca3af" stroke-width="1.5"/>
  <!-- PV -->
  <rect x="60" y="167" width="140" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="190" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">PV 现值</text>
  <text x="130" y="210" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#1e3a8a">今天需要存多少？</text>
  <line x1="202" y1="195" x2="296" y2="195" stroke="#9ca3af" stroke-width="1.5"/>
  <!-- PMT -->
  <rect x="520" y="167" width="140" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="590" y="190" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#991b1b">PMT 每期支付</text>
  <text x="590" y="210" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#991b1b">月供 / 月定投多少？</text>
  <line x1="518" y1="195" x2="424" y2="195" stroke="#9ca3af" stroke-width="1.5"/>
  <!-- RATE -->
  <rect x="140" y="285" width="140" height="56" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="210" y="308" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#831843">RATE 利率</text>
  <text x="210" y="328" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#831843">隐含年化是多少？</text>
  <line x1="262" y1="283" x2="318" y2="240" stroke="#9ca3af" stroke-width="1.5"/>
  <!-- NPER -->
  <rect x="440" y="285" width="140" height="56" rx="8" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <text x="510" y="308" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7c2d12">NPER 期数</text>
  <text x="510" y="328" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7c2d12">还要存多少年？</text>
  <line x1="458" y1="283" x2="402" y2="240" stroke="#9ca3af" stroke-width="1.5"/>
  <!-- 注 -->
  <text x="130" y="135" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">口诀：利率和期数</text>
  <text x="130" y="150" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">单位要一致（月/年）</text>
  <text x="590" y="135" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">口诀：付出去的钱</text>
  <text x="590" y="150" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">写负号</text>
</svg>
