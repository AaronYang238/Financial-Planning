<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">四把尺子衡量基金：分别看什么</text>
  <!-- 四个象限 -->
  <!-- 夏普 -->
  <rect x="40" y="60" width="320" height="160" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">夏普比率（最常用）</text>
  <line x1="55" y1="100" x2="345" y2="100" stroke="#2563eb" stroke-width="1"/>
  <text x="60" y="125" font-family="sans-serif" font-size="11" fill="#1e3a8a">问的问题：</text>
  <text x="60" y="145" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">"每承担 1 份风险拿到多少收益？"</text>
  <text x="60" y="175" font-family="sans-serif" font-size="10" fill="#1e3a8a">公式：(收益 - 无风险) / 总波动率</text>
  <text x="60" y="195" font-family="sans-serif" font-size="10" fill="#1e3a8a">> 1 优秀，> 2 极优秀</text>
  <text x="60" y="215" font-family="sans-serif" font-size="10" font-style="italic" fill="#1e3a8a">→ 平衡型基金的通用指标</text>
  <!-- 索提诺 -->
  <rect x="380" y="60" width="320" height="160" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="540" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#14532d">索提诺比率</text>
  <line x1="395" y1="100" x2="685" y2="100" stroke="#16a34a" stroke-width="1"/>
  <text x="400" y="125" font-family="sans-serif" font-size="11" fill="#14532d">问的问题：</text>
  <text x="400" y="145" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">"只看下跌波动，收益值得吗？"</text>
  <text x="400" y="175" font-family="sans-serif" font-size="10" fill="#14532d">公式：(收益 - 无风险) / 下行波动</text>
  <text x="400" y="195" font-family="sans-serif" font-size="10" fill="#14532d">通常比夏普高 30-50%</text>
  <text x="400" y="215" font-family="sans-serif" font-size="10" font-style="italic" fill="#14532d">→ 高波动 / 偏股基金更公平</text>
  <!-- 卡玛 -->
  <rect x="40" y="240" width="320" height="140" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="200" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#78350f">卡玛比率</text>
  <line x1="55" y1="280" x2="345" y2="280" stroke="#d97706" stroke-width="1"/>
  <text x="60" y="305" font-family="sans-serif" font-size="11" fill="#78350f">问的问题：</text>
  <text x="60" y="325" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78350f">"为了赚钱最深亏过多少？"</text>
  <text x="60" y="350" font-family="sans-serif" font-size="10" fill="#78350f">公式：年化收益 / 最大回撤</text>
  <text x="60" y="370" font-family="sans-serif" font-size="10" font-style="italic" fill="#78350f">→ 心理承受弱的人最敏感</text>
  <!-- 信息比率 -->
  <rect x="380" y="240" width="320" height="140" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="540" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#991b1b">信息比率</text>
  <line x1="395" y1="280" x2="685" y2="280" stroke="#dc2626" stroke-width="1"/>
  <text x="400" y="305" font-family="sans-serif" font-size="11" fill="#991b1b">问的问题：</text>
  <text x="400" y="325" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">"基金经理真有 alpha 吗？"</text>
  <text x="400" y="350" font-family="sans-serif" font-size="10" fill="#991b1b">公式：(基金 - 基准) / 跟踪误差</text>
  <text x="400" y="370" font-family="sans-serif" font-size="10" font-style="italic" fill="#991b1b">→ 比较主动基金 vs 指数</text>
</svg>
