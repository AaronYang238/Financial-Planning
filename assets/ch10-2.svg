<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">GC001 全年利率走势示意：节假日 / 季末出现峰值</text>
  <!-- 坐标轴 -->
  <line x1="80" y1="280" x2="680" y2="280" stroke="#374151" stroke-width="2"/>
  <line x1="80" y1="60" x2="80" y2="280" stroke="#374151" stroke-width="2"/>
  <!-- Y 轴刻度 -->
  <text x="70" y="285" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">0%</text>
  <text x="70" y="245" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">2%</text>
  <line x1="78" y1="240" x2="80" y2="240" stroke="#6b7280" stroke-width="1"/>
  <text x="70" y="205" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">4%</text>
  <line x1="78" y1="200" x2="80" y2="200" stroke="#6b7280" stroke-width="1"/>
  <text x="70" y="165" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">6%</text>
  <line x1="78" y1="160" x2="80" y2="160" stroke="#6b7280" stroke-width="1"/>
  <text x="70" y="125" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">8%</text>
  <line x1="78" y1="120" x2="80" y2="120" stroke="#6b7280" stroke-width="1"/>
  <text x="70" y="85" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">10%</text>
  <line x1="78" y1="80" x2="80" y2="80" stroke="#6b7280" stroke-width="1"/>
  <!-- 基线（货基年化 1.5%） -->
  <line x1="80" y1="250" x2="680" y2="250" stroke="#16a34a" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="685" y="253" font-family="sans-serif" font-size="10" fill="#16a34a">货基约 1.5%</text>
  <!-- 利率曲线（手工模拟） -->
  <path d="M 90 245 L 130 247 L 150 218 L 170 250 L 210 246 L 240 215 L 260 248 L 300 248 L 330 198 L 350 248 L 380 235 L 420 245 L 450 200 L 470 247 L 510 246 L 540 200 L 560 248 L 600 246 L 620 130 L 640 245 L 670 245"
        stroke="#dc2626" stroke-width="2" fill="none"/>
  <!-- 节假日峰值标注 -->
  <text x="150" y="208" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#dc2626">元旦</text>
  <text x="240" y="205" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#dc2626">春节</text>
  <text x="330" y="188" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#dc2626">五一</text>
  <text x="450" y="190" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#dc2626">端午</text>
  <text x="540" y="190" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#dc2626">中秋</text>
  <text x="620" y="120" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#dc2626">国庆 7-8%</text>
  <!-- X 轴月份 -->
  <text x="120" y="298" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">1月</text>
  <text x="180" y="298" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">2月</text>
  <text x="240" y="298" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">3月</text>
  <text x="300" y="298" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">5月</text>
  <text x="360" y="298" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">6月</text>
  <text x="420" y="298" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">7月</text>
  <text x="480" y="298" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">9月</text>
  <text x="540" y="298" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">10月</text>
  <text x="600" y="298" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">11月</text>
  <text x="660" y="298" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">12月</text>
  <text x="360" y="325" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">平时 1.5-2.5%，节假日前 1-3 个交易日飙到 3-8%，极端情况（如 2013、2019）破 15%</text>
</svg>
