<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">R1-R5 风险等级实际表现（2022-2024 区间）</text>
  <!-- 列标题 -->
  <text x="60" y="70" font-family="sans-serif" font-size="11" font-weight="bold" fill="#374151">等级</text>
  <text x="170" y="70" font-family="sans-serif" font-size="11" font-weight="bold" fill="#374151">资产配置</text>
  <text x="380" y="70" font-family="sans-serif" font-size="11" font-weight="bold" fill="#374151">业绩基准</text>
  <text x="480" y="70" font-family="sans-serif" font-size="11" font-weight="bold" fill="#374151">历史最大回撤</text>
  <text x="630" y="70" font-family="sans-serif" font-size="11" font-weight="bold" fill="#374151">类似品</text>
  <line x1="50" y1="80" x2="680" y2="80" stroke="#374151" stroke-width="1.5"/>
  <!-- R1 -->
  <rect x="50" y="90" width="60" height="42" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="80" y="116" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">R1</text>
  <text x="170" y="110" font-family="sans-serif" font-size="10" fill="#14532d">100% 货基 + 同业 + 国债</text>
  <text x="170" y="124" font-family="sans-serif" font-size="9" fill="#14532d">几乎没债券波动</text>
  <text x="380" y="115" font-family="sans-serif" font-size="10" fill="#14532d">1.5-2.0%</text>
  <text x="480" y="115" font-family="sans-serif" font-size="10" font-weight="bold" fill="#14532d">几乎 0</text>
  <text x="630" y="115" font-family="sans-serif" font-size="10" fill="#14532d">货基</text>
  <!-- R2 -->
  <rect x="50" y="140" width="60" height="42" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="80" y="166" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#78350f">R2</text>
  <text x="170" y="160" font-family="sans-serif" font-size="10" fill="#78350f">国债 + 信用债 + 同业（≥80%）</text>
  <text x="170" y="174" font-family="sans-serif" font-size="9" fill="#78350f">少量股票 / 衍生品 (≤20%)</text>
  <text x="380" y="165" font-family="sans-serif" font-size="10" fill="#78350f">2.5-4.0%</text>
  <text x="480" y="165" font-family="sans-serif" font-size="10" font-weight="bold" fill="#dc2626">-2% 到 -5%</text>
  <text x="630" y="165" font-family="sans-serif" font-size="10" fill="#78350f">中长期纯债基</text>
  <!-- R3 -->
  <rect x="50" y="190" width="60" height="42" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
  <text x="80" y="216" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7c2d12">R3</text>
  <text x="170" y="210" font-family="sans-serif" font-size="10" fill="#7c2d12">混合：股 20-40% + 债 60-80%</text>
  <text x="170" y="224" font-family="sans-serif" font-size="9" fill="#7c2d12">部分衍生品</text>
  <text x="380" y="215" font-family="sans-serif" font-size="10" fill="#7c2d12">3.5-5.5%</text>
  <text x="480" y="215" font-family="sans-serif" font-size="10" font-weight="bold" fill="#dc2626">-8% 到 -15%</text>
  <text x="630" y="215" font-family="sans-serif" font-size="10" fill="#7c2d12">偏债混合基金</text>
  <!-- R4 -->
  <rect x="50" y="240" width="60" height="42" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="80" y="266" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#991b1b">R4</text>
  <text x="170" y="260" font-family="sans-serif" font-size="10" fill="#991b1b">股 40-70% + 债 30-60%</text>
  <text x="170" y="274" font-family="sans-serif" font-size="9" fill="#991b1b">衍生品 + 商品</text>
  <text x="380" y="265" font-family="sans-serif" font-size="10" fill="#991b1b">5-8%</text>
  <text x="480" y="265" font-family="sans-serif" font-size="10" font-weight="bold" fill="#991b1b">-20% 到 -30%</text>
  <text x="630" y="265" font-family="sans-serif" font-size="10" fill="#991b1b">混合基金</text>
  <!-- R5 -->
  <rect x="50" y="290" width="60" height="42" fill="#7f1d1d" stroke="#450a0a" stroke-width="1.5"/>
  <text x="80" y="316" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">R5</text>
  <text x="170" y="310" font-family="sans-serif" font-size="10" fill="#7f1d1d">股 70%+ / 衍生品 / 杠杆</text>
  <text x="170" y="324" font-family="sans-serif" font-size="9" fill="#7f1d1d">激进策略</text>
  <text x="380" y="315" font-family="sans-serif" font-size="10" fill="#7f1d1d">7-10%（不保证）</text>
  <text x="480" y="315" font-family="sans-serif" font-size="10" font-weight="bold" fill="#7f1d1d">-40%+</text>
  <text x="630" y="315" font-family="sans-serif" font-size="10" fill="#7f1d1d">股票型基金</text>
  <line x1="50" y1="345" x2="680" y2="345" stroke="#374151" stroke-width="1"/>
  <text x="360" y="365" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">银行理财 95% 是 R2 → 本质就是"被改名的中长期纯债基"</text>
</svg>
