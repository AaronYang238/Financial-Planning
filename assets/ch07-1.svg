<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">没有应急金的多米诺骨牌</text>
  <!-- 起点 -->
  <rect x="40" y="60" width="140" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="110" y="86" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#991b1b">突发事件</text>
  <text x="110" y="105" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">失业/生病/意外</text>
  <!-- 箭头 -->
  <path d="M 180 90 L 218 90" stroke="#dc2626" stroke-width="2" marker-end="url(#redArr07)"/>
  <!-- 第 1 步 -->
  <rect x="220" y="60" width="140" height="60" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <text x="290" y="86" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7c2d12">必须立刻拿钱</text>
  <text x="290" y="105" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7c2d12">房贷/医药费/生活</text>
  <!-- 箭头 -->
  <path d="M 360 90 L 398 90" stroke="#dc2626" stroke-width="2" marker-end="url(#redArr07)"/>
  <!-- 第 2 步 -->
  <rect x="400" y="60" width="140" height="60" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <text x="470" y="86" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350f">没现金</text>
  <text x="470" y="105" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">只能动投资本金</text>
  <!-- 箭头 -->
  <path d="M 540 90 L 578 90" stroke="#dc2626" stroke-width="2" marker-end="url(#redArr07)"/>
  <!-- 第 3 步 -->
  <rect x="580" y="60" width="120" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="640" y="86" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#991b1b">被迫低价卖</text>
  <text x="640" y="105" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">（市场往往同时跌）</text>
  <!-- 向下箭头 -->
  <path d="M 640 120 L 640 158" stroke="#dc2626" stroke-width="2" marker-end="url(#redArr07)"/>
  <!-- 第 4 步 -->
  <rect x="560" y="160" width="160" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="640" y="186" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#991b1b">亏损实化</text>
  <text x="640" y="205" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">"账面浮亏"变"真实亏损"</text>
  <!-- 向左箭头 -->
  <path d="M 558 190 L 522 190" stroke="#dc2626" stroke-width="2" marker-end="url(#redArr07)"/>
  <!-- 第 5 步 -->
  <rect x="360" y="160" width="160" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="440" y="186" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#991b1b">卖完还不够</text>
  <text x="440" y="205" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">？借钱</text>
  <!-- 向左箭头 -->
  <path d="M 358 190 L 322 190" stroke="#dc2626" stroke-width="2" marker-end="url(#redArr07)"/>
  <!-- 第 6 步 -->
  <rect x="160" y="160" width="160" height="60" rx="6" fill="#7f1d1d" stroke="#450a0a" stroke-width="2"/>
  <text x="240" y="186" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="white">信用卡套现/网贷</text>
  <text x="240" y="205" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">年化 15%-36%</text>
  <!-- 向下箭头 -->
  <path d="M 240 220 L 240 258" stroke="#450a0a" stroke-width="2" marker-end="url(#blackArr07)"/>
  <!-- 终点 -->
  <rect x="100" y="260" width="280" height="60" rx="6" fill="#450a0a" stroke="black" stroke-width="2"/>
  <text x="240" y="286" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">债务雪球：以后每月都要还利息</text>
  <text x="240" y="305" text-anchor="middle" font-family="sans-serif" font-size="11" fill="white">原本是"暂时困难"变成"长期负担"</text>
  <text x="360" y="355" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444">第一张骨牌只要倒下，整条链路就会自动跑完——除非中间有应急金兜底</text>
  <defs>
    <marker id="redArr07" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <marker id="blackArr07" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#450a0a"/>
    </marker>
  </defs>
</svg>
