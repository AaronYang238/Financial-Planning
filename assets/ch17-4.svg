<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">除权除息日：你的总市值不变</text>
  <!-- 除息前 -->
  <rect x="80" y="80" width="200" height="140" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="110" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">除息前</text>
  <text x="180" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">股价 20 元</text>
  <text x="180" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">× 1000 股</text>
  <line x1="100" y1="175" x2="260" y2="175" stroke="#2563eb" stroke-width="1"/>
  <text x="180" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">总市值 20,000</text>
  <!-- 箭头 -->
  <path d="M 290 150 L 440 150" stroke="#374151" stroke-width="2" marker-end="url(#xArr)"/>
  <text x="365" y="138" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">每股派息 0.5 元</text>
  <defs>
    <marker id="xArr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <!-- 除息后 -->
  <rect x="450" y="80" width="220" height="140" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="560" y="110" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">除息后</text>
  <text x="560" y="135" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">股价 19.5 元 × 1000 股</text>
  <text x="560" y="153" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">= 19,500</text>
  <text x="560" y="170" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">+ 现金 500 元</text>
  <line x1="470" y1="178" x2="650" y2="178" stroke="#16a34a" stroke-width="1"/>
  <text x="560" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">总价值 20,000</text>
  <text x="360" y="255" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">分红 ≠ 凭空多出来的钱——是把"股票市值"换成"现金"</text>
</svg>
