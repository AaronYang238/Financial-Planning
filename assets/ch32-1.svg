<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">数字资产主流分类（仅作认知）</text>
  <!-- 比特币 -->
  <rect x="40" y="60" width="200" height="280" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="140" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#78350f">① 比特币 BTC</text>
  <text x="140" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">"数字黄金"</text>
  <line x1="55" y1="120" x2="225" y2="120" stroke="#d97706" stroke-width="1"/>
  <text x="55" y="145" font-family="sans-serif" font-size="11" fill="#78350f">📊 市值占比：</text>
  <text x="55" y="163" font-family="sans-serif" font-size="11" fill="#78350f">约 50%</text>
  <text x="55" y="190" font-family="sans-serif" font-size="11" fill="#78350f">🎯 定位：</text>
  <text x="55" y="208" font-family="sans-serif" font-size="11" fill="#78350f">价值储藏</text>
  <text x="55" y="235" font-family="sans-serif" font-size="11" fill="#78350f">📈 波动：</text>
  <text x="55" y="253" font-family="sans-serif" font-size="11" fill="#78350f">极高（年 60-100%）</text>
  <text x="55" y="280" font-family="sans-serif" font-size="11" fill="#78350f">⏰ 历史：</text>
  <text x="55" y="298" font-family="sans-serif" font-size="11" fill="#78350f">15 年</text>
  <text x="140" y="328" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#78350f">"加密资产之锚"</text>
  <!-- 以太坊 -->
  <rect x="260" y="60" width="200" height="280" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">② 以太坊 ETH</text>
  <text x="360" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">"区块链平台"</text>
  <line x1="275" y1="120" x2="445" y2="120" stroke="#2563eb" stroke-width="1"/>
  <text x="275" y="145" font-family="sans-serif" font-size="11" fill="#1e3a8a">📊 市值占比：</text>
  <text x="275" y="163" font-family="sans-serif" font-size="11" fill="#1e3a8a">约 18%</text>
  <text x="275" y="190" font-family="sans-serif" font-size="11" fill="#1e3a8a">🎯 定位：</text>
  <text x="275" y="208" font-family="sans-serif" font-size="11" fill="#1e3a8a">智能合约平台</text>
  <text x="275" y="235" font-family="sans-serif" font-size="11" fill="#1e3a8a">📈 波动：</text>
  <text x="275" y="253" font-family="sans-serif" font-size="11" fill="#1e3a8a">高（比 BTC 更大）</text>
  <text x="275" y="280" font-family="sans-serif" font-size="11" fill="#1e3a8a">⏰ 历史：</text>
  <text x="275" y="298" font-family="sans-serif" font-size="11" fill="#1e3a8a">10 年</text>
  <text x="360" y="328" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#1e3a8a">DeFi / NFT 基础</text>
  <!-- 稳定币 -->
  <rect x="480" y="60" width="200" height="280" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="580" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#14532d">③ 稳定币</text>
  <text x="580" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">USDT / USDC</text>
  <line x1="495" y1="120" x2="665" y2="120" stroke="#16a34a" stroke-width="1"/>
  <text x="495" y="145" font-family="sans-serif" font-size="11" fill="#14532d">📊 锚定：</text>
  <text x="495" y="163" font-family="sans-serif" font-size="11" fill="#14532d">1 USDT ≈ 1 USD</text>
  <text x="495" y="190" font-family="sans-serif" font-size="11" fill="#14532d">🎯 定位：</text>
  <text x="495" y="208" font-family="sans-serif" font-size="11" fill="#14532d">加密世界"现金"</text>
  <text x="495" y="235" font-family="sans-serif" font-size="11" fill="#14532d">📈 波动：</text>
  <text x="495" y="253" font-family="sans-serif" font-size="11" fill="#14532d">理论极小（但存在脱锚风险）</text>
  <text x="495" y="280" font-family="sans-serif" font-size="11" fill="#14532d">⚠️ 风险：</text>
  <text x="495" y="298" font-family="sans-serif" font-size="11" fill="#14532d">发行方信用</text>
  <text x="580" y="328" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#14532d">中国禁止使用</text>
</svg>
