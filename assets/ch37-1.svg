<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">储蓄率 → 工作年数（接 01 章伏笔）</text>
  <text x="360" y="48" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">提高储蓄率的边际效应在低位最大</text>
  <!-- 坐标轴 -->
  <line x1="80" y1="320" x2="680" y2="320" stroke="#374151" stroke-width="2"/>
  <line x1="80" y1="60" x2="80" y2="320" stroke="#374151" stroke-width="2"/>
  <text x="380" y="350" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#374151">储蓄率</text>
  <text x="40" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#374151" transform="rotate(-90 40 190)">工作年数</text>
  <!-- X 轴刻度 -->
  <text x="140" y="335" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">10%</text>
  <text x="240" y="335" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">30%</text>
  <text x="380" y="335" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">50%</text>
  <text x="520" y="335" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">70%</text>
  <text x="660" y="335" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">90%</text>
  <!-- Y 轴刻度 -->
  <text x="70" y="324" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">0</text>
  <text x="70" y="270" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">10</text>
  <line x1="78" y1="265" x2="80" y2="265" stroke="#6b7280"/>
  <text x="70" y="210" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">25</text>
  <line x1="78" y1="205" x2="80" y2="205" stroke="#6b7280"/>
  <text x="70" y="150" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">40</text>
  <line x1="78" y1="145" x2="80" y2="145" stroke="#6b7280"/>
  <text x="70" y="80" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">55</text>
  <!-- 曲线（指数衰减） -->
  <path d="M 140 80 Q 200 110 240 175 Q 290 220 380 250 Q 460 275 520 295 Q 580 310 660 318" stroke="#dc2626" stroke-width="3" fill="none"/>
  <!-- 关键点 -->
  <circle cx="140" cy="80" r="6" fill="#dc2626" stroke="white" stroke-width="2"/>
  <text x="150" y="78" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">10%储蓄 = 51 年</text>
  <circle cx="240" cy="175" r="6" fill="#d97706" stroke="white" stroke-width="2"/>
  <text x="250" y="173" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78350f">30% = 28 年</text>
  <circle cx="380" cy="250" r="6" fill="#16a34a" stroke="white" stroke-width="2"/>
  <text x="390" y="247" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">50% = 17 年</text>
  <circle cx="520" cy="295" r="6" fill="#2563eb" stroke="white" stroke-width="2"/>
  <text x="530" y="292" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">70% = 8.5 年</text>
  <circle cx="660" cy="318" r="6" fill="#7c3aed" stroke="white" stroke-width="2"/>
  <text x="600" y="313" font-family="sans-serif" font-size="11" font-weight="bold" fill="#5b21b6">90% = 3 年</text>
</svg>
