<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">散户能买的三种国债</text>
  <!-- 凭证式 -->
  <rect x="40" y="60" width="200" height="320" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">凭证式国债</text>
  <text x="140" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">（已基本停发）</text>
  <line x1="60" y1="120" x2="220" y2="120" stroke="#2563eb" stroke-width="1"/>
  <text x="60" y="145" font-family="sans-serif" font-size="11" fill="#1e3a8a">📜 纸质凭证</text>
  <text x="60" y="170" font-family="sans-serif" font-size="11" fill="#1e3a8a">🏦 银行柜台买</text>
  <text x="60" y="195" font-family="sans-serif" font-size="11" fill="#1e3a8a">💰 100 元起</text>
  <text x="60" y="220" font-family="sans-serif" font-size="11" fill="#1e3a8a">📅 3 年 / 5 年</text>
  <text x="60" y="245" font-family="sans-serif" font-size="11" fill="#1e3a8a">📍 不能交易</text>
  <text x="60" y="270" font-family="sans-serif" font-size="11" fill="#1e3a8a">⏰ 提前兑付按梯度</text>
  <text x="140" y="310" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#1e3a8a">→ 老一辈的</text>
  <text x="140" y="328" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#1e3a8a">"国库券"</text>
  <text x="140" y="360" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">已被电子式取代</text>
  <!-- 储蓄国债（电子式） -->
  <rect x="260" y="60" width="200" height="320" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="360" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#14532d">储蓄国债（电子式）</text>
  <text x="360" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">★ 散户主力 ★</text>
  <line x1="280" y1="120" x2="440" y2="120" stroke="#16a34a" stroke-width="1"/>
  <text x="280" y="145" font-family="sans-serif" font-size="11" fill="#14532d">💻 电子登记</text>
  <text x="280" y="170" font-family="sans-serif" font-size="11" fill="#14532d">🏦 银行 APP / 柜台</text>
  <text x="280" y="195" font-family="sans-serif" font-size="11" fill="#14532d">💰 100 元起</text>
  <text x="280" y="220" font-family="sans-serif" font-size="11" fill="#14532d">📅 3 年 / 5 年</text>
  <text x="280" y="245" font-family="sans-serif" font-size="11" fill="#14532d">📍 不能交易</text>
  <text x="280" y="270" font-family="sans-serif" font-size="11" fill="#14532d">⏰ 提前兑付按梯度</text>
  <text x="360" y="305" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">利率比定期高 30-50 bp</text>
  <text x="360" y="328" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#14532d">→ 保守资金最优</text>
  <text x="360" y="360" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">本章主要讲它</text>
  <!-- 记账式 -->
  <rect x="480" y="60" width="200" height="320" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="580" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#78350f">记账式国债</text>
  <text x="580" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">（上市流通）</text>
  <line x1="500" y1="120" x2="660" y2="120" stroke="#d97706" stroke-width="1"/>
  <text x="500" y="145" font-family="sans-serif" font-size="11" fill="#78350f">💻 电子登记</text>
  <text x="500" y="170" font-family="sans-serif" font-size="11" fill="#78350f">📈 券商账户</text>
  <text x="500" y="195" font-family="sans-serif" font-size="11" fill="#78350f">💰 1000 元起</text>
  <text x="500" y="220" font-family="sans-serif" font-size="11" fill="#78350f">📅 1-30 年期都有</text>
  <text x="500" y="245" font-family="sans-serif" font-size="11" fill="#78350f">📍 ✅ 可随时买卖</text>
  <text x="500" y="270" font-family="sans-serif" font-size="11" fill="#78350f">⚡ 价格随利率波动</text>
  <text x="580" y="305" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78350f">流动性最好</text>
  <text x="580" y="328" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#78350f">→ 灵活资金选</text>
  <text x="580" y="360" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">注意：会浮亏</text>
</svg>
