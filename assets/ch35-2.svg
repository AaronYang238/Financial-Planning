<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">处置效应：卖掉会下蛋的鸡，留下不下蛋的</text>
  <!-- 账户初始 -->
  <rect x="280" y="55" width="160" height="56 " rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="360" y="79" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#374151">你的账户</text>
  <text x="360" y="99" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">A 股票 +20% ｜ B 股票 -30%</text>
  <!-- 分叉 -->
  <path d="M 320 115 L 200 155" stroke="#374151" stroke-width="2" marker-end="url(#a35)"/>
  <path d="M 400 115 L 520 155" stroke="#374151" stroke-width="2" marker-end="url(#a35)"/>
  <!-- A 股票：卖了 -->
  <rect x="80" y="160" width="240" height="105" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="200" y="186" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">A 股票（赚 20%）</text>
  <text x="200" y="208" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">基本面还在变好</text>
  <text x="200" y="232" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626">→ 却被卖掉"落袋为安"</text>
  <text x="200" y="252" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#6b7280">锁定快乐（卖盈概率高 50-70%）</text>
  <!-- B 股票：死扛 -->
  <rect x="400" y="160" width="240" height="105" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="520" y="186" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#991b1b">B 股票（亏 30%）</text>
  <text x="520" y="208" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991b1b">基本面已经恶化</text>
  <text x="520" y="232" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626">→ 却死扛"等回本"</text>
  <text x="520" y="252" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#6b7280">逃避痛苦（不愿确认亏损）</text>
  <!-- 结果 -->
  <path d="M 200 270 L 320 305" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3"/>
  <path d="M 520 270 L 400 305" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="230" y="300" width="260" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="319" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350f">长期结果：组合里全是"垃圾股"</text>
  <text x="360" y="336" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">对策：按"未来预期"决策，设止损规则（如 -20% 强制卖）</text>
  <defs>
    <marker id="a35" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
