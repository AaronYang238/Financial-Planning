<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">四种买黄金方式对比</text>
  <!-- 实物金 -->
  <rect x="40" y="60" width="155" height="340" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="117" y="90" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#78350f">实物金</text>
  <text x="117" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">金条 / 金币 / 首饰</text>
  <line x1="55" y1="120" x2="180" y2="120" stroke="#d97706" stroke-width="1"/>
  <text x="55" y="145" font-family="sans-serif" font-size="11" fill="#78350f">📍 渠道：</text>
  <text x="55" y="162" font-family="sans-serif" font-size="10" fill="#78350f">银行/金店/品牌</text>
  <text x="55" y="190" font-family="sans-serif" font-size="11" fill="#78350f">💰 加工费：</text>
  <text x="55" y="207" font-family="sans-serif" font-size="10" fill="#78350f">金条 1-5%</text>
  <text x="55" y="222" font-family="sans-serif" font-size="10" fill="#78350f">首饰 10-30%</text>
  <text x="55" y="250" font-family="sans-serif" font-size="11" fill="#78350f">🔒 保管：</text>
  <text x="55" y="267" font-family="sans-serif" font-size="10" fill="#78350f">保险箱/丢失风险</text>
  <text x="55" y="295" font-family="sans-serif" font-size="11" fill="#78350f">💱 变现：</text>
  <text x="55" y="312" font-family="sans-serif" font-size="10" fill="#78350f">回收价打折 1-3%</text>
  <text x="117" y="350" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78350f">✓ 抗黑天鹅</text>
  <text x="117" y="368" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">✗ 成本高</text>
  <text x="117" y="388" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic" fill="#78350f">适合：保险心态</text>
  <!-- 纸黄金 -->
  <rect x="205" y="60" width="155" height="340" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="282" y="90" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">纸黄金</text>
  <text x="282" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">银行账户记录</text>
  <line x1="220" y1="120" x2="345" y2="120" stroke="#2563eb" stroke-width="1"/>
  <text x="220" y="145" font-family="sans-serif" font-size="11" fill="#1e3a8a">📍 渠道：</text>
  <text x="220" y="162" font-family="sans-serif" font-size="10" fill="#1e3a8a">银行 APP（工行等）</text>
  <text x="220" y="190" font-family="sans-serif" font-size="11" fill="#1e3a8a">💰 点差：</text>
  <text x="220" y="207" font-family="sans-serif" font-size="10" fill="#1e3a8a">买卖 0.5-1.5%</text>
  <text x="220" y="222" font-family="sans-serif" font-size="10" fill="#1e3a8a">较高</text>
  <text x="220" y="250" font-family="sans-serif" font-size="11" fill="#1e3a8a">🔒 保管：</text>
  <text x="220" y="267" font-family="sans-serif" font-size="10" fill="#1e3a8a">银行账户记账</text>
  <text x="220" y="295" font-family="sans-serif" font-size="11" fill="#1e3a8a">💱 变现：</text>
  <text x="220" y="312" font-family="sans-serif" font-size="10" fill="#1e3a8a">即时 + 点差</text>
  <text x="282" y="350" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">✓ 方便</text>
  <text x="282" y="368" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">✗ 点差吃利润</text>
  <text x="282" y="388" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic" fill="#1e3a8a">适合：习惯银行的人</text>
  <!-- 黄金 ETF -->
  <rect x="370" y="60" width="155" height="340" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="447" y="90" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">黄金 ETF ★</text>
  <text x="447" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">券商账户买卖</text>
  <line x1="385" y1="120" x2="510" y2="120" stroke="#16a34a" stroke-width="1"/>
  <text x="385" y="145" font-family="sans-serif" font-size="11" fill="#14532d">📍 渠道：</text>
  <text x="385" y="162" font-family="sans-serif" font-size="10" fill="#14532d">券商交易（如 518880）</text>
  <text x="385" y="190" font-family="sans-serif" font-size="11" fill="#14532d">💰 成本：</text>
  <text x="385" y="207" font-family="sans-serif" font-size="10" fill="#14532d">佣金 0.025%</text>
  <text x="385" y="222" font-family="sans-serif" font-size="10" fill="#14532d">管理费 0.5%/年</text>
  <text x="385" y="250" font-family="sans-serif" font-size="11" fill="#14532d">🔒 保管：</text>
  <text x="385" y="267" font-family="sans-serif" font-size="10" fill="#14532d">基金持有实物金</text>
  <text x="385" y="295" font-family="sans-serif" font-size="11" fill="#14532d">💱 变现：</text>
  <text x="385" y="312" font-family="sans-serif" font-size="10" fill="#14532d">T+1，按市价</text>
  <text x="447" y="350" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">✓ 成本最低</text>
  <text x="447" y="368" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">✓ 流动性好</text>
  <text x="447" y="388" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic" fill="#14532d">推荐：投资目的</text>
  <!-- 积存金 -->
  <rect x="535" y="60" width="155" height="340" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="612" y="90" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#991b1b">积存金</text>
  <text x="612" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">每月定投</text>
  <line x1="550" y1="120" x2="675" y2="120" stroke="#dc2626" stroke-width="1"/>
  <text x="550" y="145" font-family="sans-serif" font-size="11" fill="#991b1b">📍 渠道：</text>
  <text x="550" y="162" font-family="sans-serif" font-size="10" fill="#991b1b">银行（工行/招行等）</text>
  <text x="550" y="190" font-family="sans-serif" font-size="11" fill="#991b1b">💰 起点：</text>
  <text x="550" y="207" font-family="sans-serif" font-size="10" fill="#991b1b">200 元/月或 1 克起</text>
  <text x="550" y="250" font-family="sans-serif" font-size="11" fill="#991b1b">🔒 保管：</text>
  <text x="550" y="267" font-family="sans-serif" font-size="10" fill="#991b1b">银行账户记账</text>
  <text x="550" y="295" font-family="sans-serif" font-size="11" fill="#991b1b">💱 变现：</text>
  <text x="550" y="312" font-family="sans-serif" font-size="10" fill="#991b1b">可换实物金 / 卖出</text>
  <text x="612" y="350" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">✓ 适合定投</text>
  <text x="612" y="368" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">✗ 点差较高</text>
  <text x="612" y="388" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic" fill="#991b1b">适合：小白定投</text>
</svg>
