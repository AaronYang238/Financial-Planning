<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">比特币的波动是什么量级：和股票、黄金比一比</text>
  <!-- 左半：年化波动率 -->
  <text x="200" y="62" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">年化波动率</text>
  <line x1="60" y1="290" x2="340" y2="290" stroke="#374151" stroke-width="2"/>
  <!-- 黄金 ~15% -->
  <rect x="80" y="253" width="60" height="37" fill="#fbbf24"/>
  <text x="110" y="245" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78350f">15%</text>
  <text x="110" y="308" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">黄金</text>
  <!-- 沪深300 ~25% -->
  <rect x="170" y="228" width="60" height="62" fill="#60a5fa"/>
  <text x="200" y="220" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">25%</text>
  <text x="200" y="308" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">沪深 300</text>
  <!-- BTC 60-100% -->
  <rect x="260" y="90" width="60" height="200" fill="#f87171"/>
  <text x="290" y="82" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7f1d1d">60-100%</text>
  <text x="290" y="308" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">比特币</text>
  <!-- 右半：历史最大回撤 -->
  <text x="530" y="62" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">历史最大回撤</text>
  <line x1="400" y1="90" x2="680" y2="90" stroke="#374151" stroke-width="2"/>
  <!-- 黄金 -45%（1980-1999） -->
  <rect x="420" y="90" width="60" height="100" fill="#fbbf24"/>
  <text x="450" y="205" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78350f">-45%</text>
  <text x="450" y="225" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">黄金</text>
  <text x="450" y="240" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#9ca3af">(1980 后 20 年)</text>
  <!-- 沪深300 -72%（上证07-08） -->
  <rect x="510" y="90" width="60" height="140" fill="#60a5fa"/>
  <text x="540" y="245" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">-72%</text>
  <text x="540" y="265" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">A 股</text>
  <text x="540" y="280" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#9ca3af">(2007-08)</text>
  <!-- BTC -84% -->
  <rect x="600" y="90" width="60" height="168" fill="#f87171"/>
  <text x="630" y="273" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7f1d1d">-84%</text>
  <text x="630" y="293" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">比特币</text>
  <text x="630" y="308" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#9ca3af">(2017-18)</text>
  <text x="360" y="350" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">单日 ±20% 是常态、回撤 -80% 出现过两次——绝大多数人的心理承受力撑不过一轮周期</text>
</svg>
