<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">定投微笑曲线：跌的时候多买份额，回来就赚</text>
  <line x1="70" y1="250" x2="680" y2="250" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="70" y1="60" x2="70" y2="300" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="60" y="70" text-anchor="end" font-family="sans-serif" font-size="11" fill="#6b7280">净值</text>
  <text x="675" y="268" text-anchor="end" font-family="sans-serif" font-size="11" fill="#6b7280">时间</text>
  <!-- smile curve (U shape) ends same level -->
  <path d="M100 90 Q360 360 620 90" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <!-- start and end same level dashed -->
  <line x1="100" y1="90" x2="620" y2="90" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="100" y="80" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">起点</text>
  <text x="620" y="80" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">净值只是"涨回原点"</text>
  <!-- buy dots along curve -->
  <g fill="#dc2626">
  <circle cx="100" cy="90" r="5"/>
  <circle cx="200" cy="170" r="6"/>
  <circle cx="300" cy="235" r="8"/>
  <circle cx="360" cy="255" r="9"/>
  <circle cx="420" cy="235" r="8"/>
  <circle cx="520" cy="170" r="6"/>
  <circle cx="620" cy="90" r="5"/>
  </g>
  <text x="360" y="290" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">↑ 圆点越大 = 同样的钱买到越多份额（底部买得最多）</text>
  <text x="360" y="335" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#16a34a">净值回原点，但你的成本被拉低 → 整体盈利。前提：低位别停、回本要止盈</text>
  <text x="360" y="360" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#7f1d1d">微笑曲线只对"震荡/先跌后涨"有效；单边下跌的烂资产，定投只是越亏越多</text>
</svg>
