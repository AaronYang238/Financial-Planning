<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">资管新规前 vs 后的银行理财</text>
  <!-- 左侧：之前 -->
  <rect x="40" y="60" width="320" height="320" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">2018 之前（预期收益型）</text>
  <line x1="60" y1="105" x2="340" y2="105" stroke="#2563eb" stroke-width="1"/>
  <text x="60" y="135" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">📋 产品形态</text>
  <text x="60" y="155" font-family="sans-serif" font-size="11" fill="#1e3a8a">买 1 年 4.5%，到期一次性兑付</text>
  <text x="60" y="180" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">💰 收益</text>
  <text x="60" y="200" font-family="sans-serif" font-size="11" fill="#1e3a8a">合同列明"预期收益率"</text>
  <text x="60" y="225" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">🛡️ 风险</text>
  <text x="60" y="245" font-family="sans-serif" font-size="11" fill="#1e3a8a">出问题银行兜底（隐性刚兑）</text>
  <text x="60" y="270" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">📊 估值</text>
  <text x="60" y="290" font-family="sans-serif" font-size="11" fill="#1e3a8a">摊余成本，净值看似永远涨</text>
  <text x="60" y="315" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">🎭 实质</text>
  <text x="60" y="335" font-family="sans-serif" font-size="11" fill="#1e3a8a">"打着理财名字的高息存款"</text>
  <text x="200" y="365" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#1e3a8a">已退出历史舞台</text>
  <!-- 右侧：之后 -->
  <rect x="380" y="60" width="320" height="320" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="540" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#991b1b">2022 之后（净值型）</text>
  <line x1="400" y1="105" x2="680" y2="105" stroke="#dc2626" stroke-width="1"/>
  <text x="400" y="135" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">📋 产品形态</text>
  <text x="400" y="155" font-family="sans-serif" font-size="11" fill="#991b1b">类似基金，每天有净值</text>
  <text x="400" y="180" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">💰 收益</text>
  <text x="400" y="200" font-family="sans-serif" font-size="11" fill="#991b1b">"业绩比较基准"（不承诺）</text>
  <text x="400" y="225" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">🛡️ 风险</text>
  <text x="400" y="245" font-family="sans-serif" font-size="11" fill="#991b1b">投资者自担，可能亏本金</text>
  <text x="400" y="270" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">📊 估值</text>
  <text x="400" y="290" font-family="sans-serif" font-size="11" fill="#991b1b">市值法（每天波动）</text>
  <text x="400" y="315" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">🎭 实质</text>
  <text x="400" y="335" font-family="sans-serif" font-size="11" fill="#991b1b">"银行卖的资管产品（≈债基）"</text>
  <text x="540" y="365" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#991b1b">当前形态，必须当投资品看</text>
</svg>
