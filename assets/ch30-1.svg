<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">中国散户投资海外的三条合规路径</text>
  <!-- QDII -->
  <rect x="40" y="60" width="200" height="320" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#14532d">① QDII 基金</text>
  <text x="140" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">Qualified Domestic</text>
  <text x="140" y="123" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">Institutional Investor</text>
  <line x1="55" y1="135" x2="225" y2="135" stroke="#16a34a" stroke-width="1"/>
  <text x="55" y="160" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">起点：</text>
  <text x="55" y="178" font-family="sans-serif" font-size="11" fill="#14532d">10 元</text>
  <text x="55" y="200" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">额度：</text>
  <text x="55" y="218" font-family="sans-serif" font-size="11" fill="#14532d">不占 5 万美元</text>
  <text x="55" y="240" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">投什么：</text>
  <text x="55" y="258" font-family="sans-serif" font-size="11" fill="#14532d">标普500/纳指/海外</text>
  <text x="55" y="276" font-family="sans-serif" font-size="11" fill="#14532d">股债/REITs</text>
  <text x="55" y="298" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">币种：</text>
  <text x="55" y="316" font-family="sans-serif" font-size="11" fill="#14532d">人民币</text>
  <text x="140" y="348" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">✓ 最方便、新手首选</text>
  <text x="140" y="368" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#14532d">缺点：受额度限制可能限购</text>
  <!-- 港股通 -->
  <rect x="260" y="60" width="200" height="320" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">② 港股通</text>
  <text x="360" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">沪/深 ↔ 港股直通</text>
  <line x1="275" y1="135" x2="445" y2="135" stroke="#2563eb" stroke-width="1"/>
  <text x="275" y="160" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">起点：</text>
  <text x="275" y="178" font-family="sans-serif" font-size="11" fill="#1e3a8a">50 万账户余额</text>
  <text x="275" y="200" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">额度：</text>
  <text x="275" y="218" font-family="sans-serif" font-size="11" fill="#1e3a8a">不占 5 万美元</text>
  <text x="275" y="240" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">投什么：</text>
  <text x="275" y="258" font-family="sans-serif" font-size="11" fill="#1e3a8a">港股（恒生/科技）</text>
  <text x="275" y="276" font-family="sans-serif" font-size="11" fill="#1e3a8a">部分港股不能买</text>
  <text x="275" y="298" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">币种：</text>
  <text x="275" y="316" font-family="sans-serif" font-size="11" fill="#1e3a8a">人民币（结算时换汇）</text>
  <text x="360" y="348" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">✓ 直接买中概互联网</text>
  <text x="360" y="368" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#1e3a8a">缺点：50 万门槛 + 仅限港股</text>
  <!-- 美股直投 -->
  <rect x="480" y="60" width="200" height="320" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="580" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#991b1b">③ 美股直投</text>
  <text x="580" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">境外券商账户</text>
  <line x1="495" y1="135" x2="665" y2="135" stroke="#dc2626" stroke-width="1"/>
  <text x="495" y="160" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">起点：</text>
  <text x="495" y="178" font-family="sans-serif" font-size="11" fill="#991b1b">$100 起</text>
  <text x="495" y="200" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">额度：</text>
  <text x="495" y="218" font-family="sans-serif" font-size="11" fill="#991b1b">受 5 万美元限制</text>
  <text x="495" y="240" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">投什么：</text>
  <text x="495" y="258" font-family="sans-serif" font-size="11" fill="#991b1b">美股 / 美债 / ETF</text>
  <text x="495" y="276" font-family="sans-serif" font-size="11" fill="#991b1b">海外加密 / 期权</text>
  <text x="495" y="298" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">币种：</text>
  <text x="495" y="316" font-family="sans-serif" font-size="11" fill="#991b1b">美元</text>
  <text x="580" y="348" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">⚠️ 合规边界灰色</text>
  <text x="580" y="368" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#991b1b">用 5 万额度"投资"不被允许</text>
</svg>
