<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">中国银行业层级：风险递增，利率递增</text>
  <!-- 金字塔 -->
  <!-- 第 1 层：国有六大行 -->
  <polygon points="280,60 440,60 460,110 260,110" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="85" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">国有六大行</text>
  <text x="360" y="102" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">工建中农交邮储</text>
  <!-- 第 2 层：股份制 -->
  <polygon points="260,110 460,110 490,170 230,170" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="135" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">12 家全国性股份行</text>
  <text x="360" y="152" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">招商/中信/民生/兴业/平安等</text>
  <!-- 第 3 层：城商行 -->
  <polygon points="230,170 490,170 530,240 190,240" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#78350f">城市商业银行（130+）</text>
  <text x="360" y="212" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">北京/上海/江苏/宁波等</text>
  <text x="360" y="228" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic" fill="#78350f">质量差距大，要分头部尾部</text>
  <!-- 第 4 层：农商行 -->
  <polygon points="190,240 530,240 580,310 140,310" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <text x="360" y="265" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7c2d12">农商行/村镇银行（1500+）</text>
  <text x="360" y="282" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7c2d12">数量多，本地化</text>
  <text x="360" y="298" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic" fill="#7c2d12">河南村镇银行事件后要谨慎</text>
  <!-- 第 5 层：民营银行 -->
  <polygon points="140,310 580,310 640,370 80,370" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="360" y="335" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#831843">民营银行（19 家）</text>
  <text x="360" y="352" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#831843">微众/网商/众邦/亿联等</text>
  <!-- 右侧标签：利率 -->
  <text x="660" y="85" font-family="sans-serif" font-size="11" fill="#2563eb">1.8% 定期</text>
  <text x="660" y="140" font-family="sans-serif" font-size="11" fill="#16a34a">2.0-2.2%</text>
  <text x="660" y="205" font-family="sans-serif" font-size="11" fill="#d97706">2.3-2.8%</text>
  <text x="660" y="275" font-family="sans-serif" font-size="11" fill="#ea580c">2.5-3.0%</text>
  <text x="660" y="345" font-family="sans-serif" font-size="11" fill="#db2777">3.0-3.8%</text>
  <!-- 左侧标签：风险 -->
  <text x="60" y="85" font-family="sans-serif" font-size="11" text-anchor="end" fill="#6b7280">极低</text>
  <text x="60" y="140" font-family="sans-serif" font-size="11" text-anchor="end" fill="#6b7280">很低</text>
  <text x="60" y="205" font-family="sans-serif" font-size="11" text-anchor="end" fill="#6b7280">中</text>
  <text x="60" y="275" font-family="sans-serif" font-size="11" text-anchor="end" fill="#6b7280">中-高</text>
  <text x="60" y="345" font-family="sans-serif" font-size="11" text-anchor="end" fill="#6b7280">较高</text>
  <text x="60" y="48" font-family="sans-serif" font-size="11" font-weight="bold" fill="#6b7280">风险</text>
  <text x="660" y="48" font-family="sans-serif" font-size="11" font-weight="bold" fill="#6b7280">利率</text>
</svg>
