<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">债基筛选决策树</text>
  <!-- 步骤 1 -->
  <rect x="220" y="55" width="280" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">第 1 步：定持有期 → 选短债 or 中长债</text>
  <text x="360" y="96" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">久期匹配持有期</text>
  <path d="M 360 105 L 360 130" stroke="#374151" stroke-width="2" marker-end="url(#aArr)"/>
  <!-- 步骤 2 -->
  <rect x="220" y="135" width="280" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="158" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#78350f">第 2 步：定风险等级 → 纯债 or 二级债</text>
  <text x="360" y="176" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">能否接受 5%+ 回撤</text>
  <path d="M 360 185 L 360 210" stroke="#374151" stroke-width="2" marker-end="url(#aArr)"/>
  <!-- 步骤 3 -->
  <rect x="220" y="215" width="280" height="50" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <text x="360" y="238" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7c2d12">第 3 步：筛经理 → 任职 5+ 年</text>
  <text x="360" y="256" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7c2d12">经历过完整利率周期</text>
  <path d="M 360 265 L 360 290" stroke="#374151" stroke-width="2" marker-end="url(#aArr)"/>
  <!-- 步骤 4 -->
  <rect x="220" y="295" width="280" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="318" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">第 4 步：筛规模 → 5-50 亿</text>
  <text x="360" y="336" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">避开太小（清盘）和太大（笨重）</text>
  <path d="M 360 345 L 360 370" stroke="#374151" stroke-width="2" marker-end="url(#aArr)"/>
  <!-- 步骤 5 -->
  <rect x="220" y="375" width="280" height="50" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="360" y="398" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#831843">第 5 步：查最大回撤 + 卡玛</text>
  <text x="360" y="416" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#831843">最大回撤在类型健康范围 ｜ 卡玛 > 2</text>
  <path d="M 360 425 L 360 450" stroke="#374151" stroke-width="2" marker-end="url(#aArr)"/>
  <!-- 结果 -->
  <text x="360" y="465" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">候选基金 → 最后看费率排序</text>
  <defs>
    <marker id="aArr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
