<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">汇率叠加：你的实际收益 = 标的涨跌 + 汇率变化</text>
  <!-- 场景：标普涨 10% -->
  <rect x="60" y="70" width="160" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="98" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">标普 500</text>
  <text x="140" y="122" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">+10%</text>
  <text x="250" y="110" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#374151">+</text>
  <!-- 三种汇率情景 -->
  <rect x="280" y="60" width="170" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="365" y="83" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">人民币贬值 5%</text>
  <text x="365" y="103" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">（美元变值钱）</text>
  <rect x="280" y="126" width="170" height="48" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="365" y="146" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">汇率不变</text>
  <text x="365" y="164" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">0%</text>
  <rect x="280" y="184" width="170" height="56" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="365" y="207" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991b1b">人民币升值 5%</text>
  <text x="365" y="227" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">（美元缩水）</text>
  <text x="480" y="155" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#374151">=</text>
  <!-- 结果 -->
  <rect x="510" y="60" width="170" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="595" y="85" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#14532d">+15%</text>
  <text x="595" y="105" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">双重加成</text>
  <rect x="510" y="126" width="170" height="48" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="595" y="148" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#374151">+10%</text>
  <text x="595" y="166" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">纯标的回报</text>
  <rect x="510" y="184" width="170" height="56" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="595" y="209" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#991b1b">+5%</text>
  <text x="595" y="229" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">被汇率吃掉一半</text>
  <!-- 警示 -->
  <rect x="60" y="270" width="620" height="64" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="370" y="295" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350f">最坏情景：标的 -10% × 人民币升值 5% = -15%（双重打击）</text>
  <text x="370" y="318" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f">汇率波动 ±5-10%/年是常态——不确定方向时可"对冲版 : 不对冲版 = 50 : 50"</text>
</svg>
