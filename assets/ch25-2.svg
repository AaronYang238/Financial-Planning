<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">杠杆 vs 现货：同样行情，截然不同的损益</text>
  <text x="360" y="48" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">本金 10 万，股价 100 元 → 涨/跌 5% 后</text>
  <!-- 表格行 -->
  <line x1="60" y1="80" x2="680" y2="80" stroke="#374151" stroke-width="1.5"/>
  <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#374151">行情</text>
  <text x="260" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">买股票（1x）</text>
  <text x="420" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">买期货（10x）</text>
  <text x="580" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">买期权（100x）</text>
  <line x1="60" y1="110" x2="680" y2="110" stroke="#374151" stroke-width="0.5"/>
  <!-- 涨 5% -->
  <text x="120" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">涨 5%</text>
  <rect x="200" y="125" width="120" height="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="260" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">+5,000</text>
  <rect x="360" y="125" width="120" height="22" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/>
  <text x="420" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">+50,000</text>
  <rect x="520" y="125" width="120" height="22" fill="#86efac" stroke="#16a34a" stroke-width="1"/>
  <text x="580" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">+500,000</text>
  <line x1="60" y1="160" x2="680" y2="160" stroke="#374151" stroke-width="0.5"/>
  <!-- 涨 1% -->
  <text x="120" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">涨 1%</text>
  <text x="260" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">+1,000</text>
  <text x="420" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">+10,000</text>
  <text x="580" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">+100,000</text>
  <line x1="60" y1="210" x2="680" y2="210" stroke="#374151" stroke-width="0.5"/>
  <!-- 不变 -->
  <text x="120" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">不变</text>
  <text x="260" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">0</text>
  <text x="420" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">0</text>
  <text x="580" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991b1b">**-100%**</text>
  <text x="580" y="255" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#991b1b">（时间价值损耗）</text>
  <line x1="60" y1="265" x2="680" y2="265" stroke="#374151" stroke-width="0.5"/>
  <!-- 跌 1% -->
  <text x="120" y="295" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991b1b">跌 1%</text>
  <text x="260" y="295" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991b1b">-1,000</text>
  <text x="420" y="295" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991b1b">-10,000</text>
  <text x="580" y="295" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7f1d1d">**-100,000+**</text>
  <line x1="60" y1="315" x2="680" y2="315" stroke="#374151" stroke-width="0.5"/>
  <!-- 跌 10% -->
  <text x="120" y="345" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7f1d1d">跌 10%</text>
  <text x="260" y="345" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7f1d1d">-10,000</text>
  <text x="420" y="345" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7f1d1d">**爆仓**</text>
  <text x="580" y="345" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7f1d1d">**爆仓**</text>
  <line x1="60" y1="360" x2="680" y2="360" stroke="#374151" stroke-width="1.5"/>
</svg>
