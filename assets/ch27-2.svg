<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">散户决策金字塔：你处在哪一层</text>
  <text x="360" y="48" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">下层未稳，不要碰上层工具</text>
  <!-- 金字塔 5 层 -->
  <!-- L1 底层 -->
  <polygon points="60,360 660,360 600,310 120,310" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="340" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">L1 基础（必须先建）</text>
  <text x="100" y="380" font-family="sans-serif" font-size="10" fill="#374151">应急金 6-12 个月 + 商业保险（重疾/医疗/意外）</text>
  <!-- L2 -->
  <polygon points="120,310 600,310 540,260 180,260" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14532d">L2 固收资产（80% 散户的天花板）</text>
  <text x="100" y="400" font-family="sans-serif" font-size="10" fill="#374151">国债 / 储蓄国债 / 货基 / 短债基</text>
  <!-- L3 -->
  <polygon points="180,260 540,260 480,210 240,210" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350f">L3 权益资产</text>
  <!-- L4 -->
  <polygon points="240,210 480,210 420,160 300,160" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <text x="360" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7c2d12">L4 卫星资产</text>
  <!-- L5 顶层 -->
  <polygon points="300,160 420,160 360,80" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
  <text x="360" y="130" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#991b1b">L5 衍生品</text>
  <text x="360" y="148" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#991b1b">≤ 5% 仓位</text>
  <!-- 右侧说明 -->
  <text x="535" y="180" font-family="sans-serif" font-size="9" fill="#7c2d12">行业 ETF / 主动基金 ≤ 15%</text>
  <text x="495" y="230" font-family="sans-serif" font-size="9" fill="#78350f">沪深 300 / 中证 500 / 标普 500 = 核心</text>
  <text x="100" y="160" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">L5 准入条件：</text>
  <text x="100" y="178" font-family="sans-serif" font-size="10" fill="#991b1b">✓ 总资产 > 100 万</text>
  <text x="100" y="194" font-family="sans-serif" font-size="10" fill="#991b1b">✓ 股票投资经验 > 5 年</text>
  <text x="100" y="210" font-family="sans-serif" font-size="10" fill="#991b1b">✓ 已完成 L1-L4 全部配置</text>
  <text x="100" y="226" font-family="sans-serif" font-size="10" fill="#991b1b">✓ 接受 100% 亏损</text>
  <text x="100" y="242" font-family="sans-serif" font-size="10" fill="#991b1b">✓ 仅用于"备兑 / 保护性看跌"</text>
</svg>
