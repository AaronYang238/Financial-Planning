<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">个人信息工作流：频率越低的事越重要</text>
  <!-- 时间轴 -->
  <line x1="80" y1="270" x2="680" y2="270" stroke="#374151" stroke-width="2" marker-end="url(#a41)"/>
  <!-- 每日 -->
  <circle cx="140" cy="270" r="6" fill="#60a5fa"/>
  <rect x="70" y="180" width="140" height="74" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="202" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">每日 5 分钟</text>
  <text x="140" y="222" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">热点标题 + 大类资产</text>
  <text x="140" y="240" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#1e3a8a">只看不动手</text>
  <text x="140" y="295" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">信息</text>
  <!-- 周末 -->
  <circle cx="300" cy="270" r="6" fill="#34d399"/>
  <rect x="230" y="160" width="140" height="94" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="300" y="182" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14532d">周末 30 分钟</text>
  <text x="300" y="202" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">1-2 篇深度文章</text>
  <text x="300" y="220" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">检查持仓状态</text>
  <text x="300" y="240" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#14532d">仍然不操作</text>
  <text x="300" y="295" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">理解</text>
  <!-- 月末 -->
  <circle cx="460" cy="270" r="6" fill="#fbbf24"/>
  <rect x="390" y="140" width="140" height="114" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="460" y="162" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350f">月末 1 小时</text>
  <text x="460" y="182" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">更新净资产快照</text>
  <text x="460" y="200" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">检查配置偏离</text>
  <text x="460" y="218" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">看持仓季报</text>
  <text x="460" y="240" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#78350f">→ 唯一例行操作点</text>
  <text x="460" y="295" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">执行</text>
  <!-- 年末 -->
  <circle cx="620" cy="270" r="6" fill="#f87171"/>
  <rect x="550" y="120" width="140" height="134" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="620" y="142" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#991b1b">年末 半天</text>
  <text x="620" y="162" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">全年复盘</text>
  <text x="620" y="180" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">税务规划</text>
  <text x="620" y="198" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">次年配置 + 再平衡</text>
  <text x="620" y="222" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#991b1b">→ 最重要的一次</text>
  <text x="620" y="240" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic" fill="#991b1b">决定 90% 的长期回报</text>
  <text x="620" y="295" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">决策</text>
  <text x="360" y="325" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">原则：少即是多 · 不实时看盘 · 同指标只用一个数据源</text>
  <defs>
    <marker id="a41" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
