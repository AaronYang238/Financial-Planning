<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <!-- 中间口袋 -->
  <rect x="310" y="120" width="100" height="120" rx="10" fill="#fff4d6" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="195" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#92400e">你的口袋</text>
  <!-- 左侧：资产 -->
  <rect x="40" y="100" width="200" height="160" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="130" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#15803d">资产</text>
  <text x="140" y="160" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d">出租房（月租）</text>
  <text x="140" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d">分红股票</text>
  <text x="140" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d">货币基金</text>
  <text x="140" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d">能拿稿费的版权</text>
  <text x="140" y="245" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#15803d">→ 持续给你送钱</text>
  <!-- 箭头：资产 → 口袋 -->
  <path d="M 240 180 L 305 180" stroke="#16a34a" stroke-width="3" fill="none" marker-end="url(#greenArrow)"/>
  <!-- 右侧：负债 -->
  <rect x="480" y="100" width="200" height="160" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="580" y="130" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#991b1b">负债</text>
  <text x="580" y="160" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#991b1b">自住房（月供+物业）</text>
  <text x="580" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#991b1b">自用车（油+保险+折旧）</text>
  <text x="580" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#991b1b">名牌包（保养+贬值）</text>
  <text x="580" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#991b1b">信用卡分期</text>
  <text x="580" y="245" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#991b1b">→ 持续从你口袋掏钱</text>
  <!-- 箭头：口袋 → 负债 -->
  <path d="M 415 180 L 478 180" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#redArrow)"/>
  <defs>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
  </defs>
  <text x="360" y="290" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#444">看现金往哪流，就知道这东西对你是资产还是负债</text>
</svg>
