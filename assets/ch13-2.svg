<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">中国信用利差与评级（2025-2026 区间）</text>
  <text x="360" y="48" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">所有数字为示意性区间，市场每天变动</text>
  <!-- 坐标轴 -->
  <line x1="100" y1="320" x2="650" y2="320" stroke="#374151" stroke-width="2"/>
  <line x1="100" y1="70" x2="100" y2="320" stroke="#374151" stroke-width="2"/>
  <!-- Y 刻度 -->
  <text x="92" y="324" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">0</text>
  <text x="92" y="270" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">50</text>
  <line x1="98" y1="265" x2="100" y2="265" stroke="#6b7280" stroke-width="1"/>
  <text x="92" y="220" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">150</text>
  <line x1="98" y1="215" x2="100" y2="215" stroke="#6b7280" stroke-width="1"/>
  <text x="92" y="170" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">300</text>
  <line x1="98" y1="165" x2="100" y2="165" stroke="#6b7280" stroke-width="1"/>
  <text x="92" y="120" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">500</text>
  <line x1="98" y1="115" x2="100" y2="115" stroke="#6b7280" stroke-width="1"/>
  <text x="60" y="195" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#374151" transform="rotate(-90 60 195)">信用利差 (bp)</text>
  <!-- 国债基准 -->
  <line x1="100" y1="320" x2="650" y2="320" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="660" y="325" font-family="sans-serif" font-size="10" font-weight="bold" fill="#16a34a">国债=0</text>
  <!-- AAA 央企 ~30 bp -->
  <rect x="130" y="290" width="60" height="30" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="285" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">30 bp</text>
  <text x="160" y="340" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">AAA 央企</text>
  <text x="160" y="354" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">国家电网</text>
  <!-- AAA 城投（省级）~60 bp -->
  <rect x="210" y="276" width="60" height="44" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="240" y="271" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">60 bp</text>
  <text x="240" y="340" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">AAA 省级城投</text>
  <text x="240" y="354" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">江苏交控</text>
  <!-- AA+ ~100 bp -->
  <rect x="290" y="254" width="60" height="66" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="320" y="249" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78350f">100 bp</text>
  <text x="320" y="340" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">AA+ 公司</text>
  <text x="320" y="354" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">大型民营龙头</text>
  <!-- AA ~180 bp -->
  <rect x="370" y="217" width="60" height="103" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
  <text x="400" y="212" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7c2d12">180 bp</text>
  <text x="400" y="340" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">AA 公司</text>
  <text x="400" y="354" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">中型企业 / 县级城投</text>
  <!-- AA- 弱区域城投 ~300 bp -->
  <rect x="450" y="167" width="60" height="153" fill="#fca5a5" stroke="#dc2626" stroke-width="1.5"/>
  <text x="480" y="162" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">300 bp</text>
  <text x="480" y="340" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">AA- 弱区域</text>
  <text x="480" y="354" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">尾部城投</text>
  <!-- A 房地产 ~500-1000 bp -->
  <rect x="530" y="100" width="60" height="220" fill="#7f1d1d" stroke="#450a0a" stroke-width="1.5"/>
  <text x="560" y="95" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="white"></text>
  <text x="560" y="85" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7f1d1d">500+ bp</text>
  <text x="560" y="340" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">高收益 / 出险</text>
  <text x="560" y="354" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">地产 / 困境企业</text>
</svg>
