<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">三种债基：股票"沾染度"越高，波动越大</text>
  <!-- 纯债 -->
  <rect x="40" y="80" width="200" height="260" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="110" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1e3a8a">纯债基金</text>
  <text x="140" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">100% 债券</text>
  <line x1="60" y1="145" x2="220" y2="145" stroke="#2563eb" stroke-width="1"/>
  <!-- 横条 -->
  <rect x="60" y="160" width="160" height="32" fill="#3b82f6"/>
  <text x="140" y="181" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="white">债券 100%</text>
  <!-- 数字 -->
  <text x="140" y="225" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">长期年化 ≈ 4-5%</text>
  <text x="140" y="245" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">最大回撤 ≈ -3%</text>
  <text x="140" y="265" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">波动率 ≈ 1-3%</text>
  <text x="140" y="295" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">适合：保守型</text>
  <text x="140" y="315" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">替代银行定存/理财</text>
  <!-- 一级债基 -->
  <rect x="260" y="80" width="200" height="260" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="110" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#78350f">一级债基</text>
  <text x="360" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f">债 + 打新 + 可转债</text>
  <line x1="280" y1="145" x2="440" y2="145" stroke="#d97706" stroke-width="1"/>
  <!-- 横条堆叠 -->
  <rect x="280" y="160" width="128" height="32" fill="#3b82f6"/>
  <rect x="408" y="160" width="32" height="32" fill="#f59e0b"/>
  <text x="344" y="181" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="white">债 80%</text>
  <text x="424" y="181" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="white">转债</text>
  <!-- 数字 -->
  <text x="360" y="225" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f">长期年化 ≈ 5-6%</text>
  <text x="360" y="245" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f">最大回撤 ≈ -5%</text>
  <text x="360" y="265" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f">波动率 ≈ 2-5%</text>
  <text x="360" y="295" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78350f">适合：稳健型</text>
  <text x="360" y="315" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">2017 后已极少</text>
  <!-- 二级债基 -->
  <rect x="480" y="80" width="200" height="260" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="580" y="110" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#991b1b">二级债基</text>
  <text x="580" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991b1b">债 + 股票（≤20%）</text>
  <line x1="500" y1="145" x2="660" y2="145" stroke="#dc2626" stroke-width="1"/>
  <!-- 横条堆叠 -->
  <rect x="500" y="160" width="112" height="32" fill="#3b82f6"/>
  <rect x="612" y="160" width="16" height="32" fill="#f59e0b"/>
  <rect x="628" y="160" width="32" height="32" fill="#dc2626"/>
  <text x="556" y="181" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="white">债 70%</text>
  <text x="644" y="181" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="white">股20%</text>
  <!-- 数字 -->
  <text x="580" y="225" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991b1b">长期年化 ≈ 6-8%</text>
  <text x="580" y="245" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991b1b">最大回撤 ≈ -10%</text>
  <text x="580" y="265" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991b1b">波动率 ≈ 5-10%</text>
  <text x="580" y="295" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">适合：平衡型</text>
  <text x="580" y="315" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">含 20% 股性</text>
  <text x="360" y="380" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">监管规定：纯债 0% 股 ｜ 一级债 0% 二级市场股 ｜ 二级债 ≤20% 股</text>
</svg>
