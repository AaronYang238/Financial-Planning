<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">T+1 vs T+0：交易日 vs 资金日</text>
  <!-- A 股 T+1 -->
  <text x="180" y="68" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">A 股 T+1</text>
  <!-- 时间线 -->
  <line x1="60" y1="120" x2="320" y2="120" stroke="#374151" stroke-width="2"/>
  <circle cx="80" cy="120" r="6" fill="#dc2626"/>
  <text x="80" y="105" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#7f1d1d">T 日</text>
  <text x="80" y="145" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f1d1d">买入</text>
  <circle cx="200" cy="120" r="6" fill="#ef4444"/>
  <text x="200" y="105" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#7f1d1d">T+1</text>
  <text x="200" y="145" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f1d1d">才能卖</text>
  <circle cx="300" cy="120" r="6" fill="#fb7185"/>
  <text x="300" y="105" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#7f1d1d">T+2</text>
  <text x="300" y="145" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f1d1d">钱可提现</text>
  <text x="180" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7f1d1d">买入当天暴涨 9% 想卖——不行</text>
  <text x="180" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7f1d1d">第二天暴跌 8% 才卖——亏定了</text>
  <text x="180" y="240" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#7f1d1d">"被关一夜"是 A 股的家常便饭</text>
  <!-- 港股美股 T+0 -->
  <text x="540" y="68" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#16a34a">港股/美股 T+0</text>
  <line x1="420" y1="120" x2="680" y2="120" stroke="#374151" stroke-width="2"/>
  <circle cx="440" cy="120" r="6" fill="#16a34a"/>
  <text x="440" y="105" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#14532d">T 日 9:30</text>
  <text x="440" y="145" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">买入</text>
  <circle cx="560" cy="120" r="6" fill="#22c55e"/>
  <text x="560" y="105" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#14532d">T 日 14:00</text>
  <text x="560" y="145" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">就能卖</text>
  <circle cx="660" cy="120" r="6" fill="#4ade80"/>
  <text x="660" y="105" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#14532d">T+2</text>
  <text x="660" y="145" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">钱可提现</text>
  <text x="540" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">同一天可以反复买卖</text>
  <text x="540" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">日内交易（Day Trading）合法</text>
  <text x="540" y="240" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#14532d">但短线频繁交易难赚钱</text>
  <text x="360" y="290" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">T+1 限制了高频投机，但也"关"住了想止损的人</text>
</svg>
