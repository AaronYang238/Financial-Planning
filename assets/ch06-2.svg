<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">三种经典股债比：长期回报 vs 最大回撤</text>
  <!-- 保守 30/70 -->
  <text x="140" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">保守 30/70</text>
  <circle cx="140" cy="180" r="70" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <!-- 股 30% -->
  <path d="M 140 180 L 140 110 A 70 70 0 0 1 207 170 Z" fill="#dc2626"/>
  <text x="170" y="140" font-family="sans-serif" font-size="11" fill="white" font-weight="bold">股 30%</text>
  <text x="105" y="200" font-family="sans-serif" font-size="11" fill="#1e3a8a" font-weight="bold">债 70%</text>
  <text x="140" y="280" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">长期年化 ≈ 4-5%</text>
  <text x="140" y="298" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">最大回撤 ≈ -10%</text>
  <text x="140" y="320" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#6b7280">适合：50+ 岁 / 风险弱</text>
  <!-- 平衡 60/40 -->
  <text x="360" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#78350f">平衡 60/40</text>
  <circle cx="360" cy="180" r="70" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <!-- 股 60% -->
  <path d="M 360 180 L 360 110 A 70 70 0 1 1 295 215 Z" fill="#dc2626"/>
  <text x="370" y="155" font-family="sans-serif" font-size="11" fill="white" font-weight="bold">股 60%</text>
  <text x="310" y="225" font-family="sans-serif" font-size="11" fill="#78350f" font-weight="bold">债 40%</text>
  <text x="360" y="280" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">长期年化 ≈ 6-7%</text>
  <text x="360" y="298" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">最大回撤 ≈ -25%</text>
  <text x="360" y="320" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#6b7280">适合：30-50 岁 / 中等</text>
  <!-- 激进 80/20 -->
  <text x="580" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#14532d">激进 80/20</text>
  <circle cx="580" cy="180" r="70" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <!-- 股 80% -->
  <path d="M 580 180 L 580 110 A 70 70 0 1 1 514 167 Z" fill="#dc2626"/>
  <text x="590" y="160" font-family="sans-serif" font-size="11" fill="white" font-weight="bold">股 80%</text>
  <text x="540" y="225" font-family="sans-serif" font-size="11" fill="#14532d" font-weight="bold">债 20%</text>
  <text x="580" y="280" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">长期年化 ≈ 7-9%</text>
  <text x="580" y="298" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">最大回撤 ≈ -40%</text>
  <text x="580" y="320" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#6b7280">适合：&lt; 35 岁 / 风险强</text>
  <text x="360" y="365" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">股票比例越高，长期回报越高，但最大回撤也越大（中间没有免费午餐）</text>
</svg>
