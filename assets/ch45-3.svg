<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">再平衡：自动"高抛低吸"的纪律工具</text>
  <!-- before -->
  <text x="180" y="70" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">目标：股 60% / 债 40%</text>
  <rect x="120" y="90" width="120" height="160" fill="#fde68a" stroke="#ca8a04" stroke-width="1.5"/>
  <rect x="120" y="190" width="120" height="60" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="180" y="145" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854d0e">股 60%</text>
  <text x="180" y="225" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#14532d">债 40%</text>

  <!-- after drift -->
  <text x="360" y="70" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626">股大涨后漂移到 72/28</text>
  <rect x="300" y="90" width="120" height="190" fill="#fde68a" stroke="#ca8a04" stroke-width="1.5"/>
  <rect x="300" y="220" width="120" height="60" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="360" y="160" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854d0e">股 72%</text>
  <text x="360" y="255" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#14532d">债 28%</text>

  <!-- after rebalance -->
  <text x="560" y="70" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#16a34a">卖股买债，拉回 60/40</text>
  <rect x="500" y="90" width="120" height="160" fill="#fde68a" stroke="#ca8a04" stroke-width="1.5"/>
  <rect x="500" y="190" width="120" height="60" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="560" y="145" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854d0e">股 60%</text>
  <text x="560" y="225" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#14532d">债 40%</text>

  <defs><marker id="a453" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#64748b"/></marker></defs>
  <path d="M245 170 L295 170" stroke="#64748b" stroke-width="2" marker-end="url(#a453)"/>
  <path d="M425 170 L495 170" stroke="#64748b" stroke-width="2" marker-end="url(#a453)"/>
  <text x="360" y="320" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444">涨多的自动卖一点、跌多的自动补一点——不靠预测，靠规则。常用：每年1次或偏离±5%触发</text>
</svg>
