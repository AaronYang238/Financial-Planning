<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">金叉 vs 死叉：短线均线穿越长线均线</text>
  <line x1="80" y1="280" x2="680" y2="280" stroke="#374151" stroke-width="2"/>
  <line x1="80" y1="280" x2="80" y2="60" stroke="#374151" stroke-width="2"/>
  <text x="380" y="305" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">时间 →</text>
  <text x="40" y="170" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151" transform="rotate(-90 40 170)">股价</text>
  <!-- MA60 长线 -->
  <path d="M 80 200 Q 200 195, 300 180 Q 400 170, 500 160 Q 600 150, 680 145" stroke="#3b82f6" stroke-width="2.5" fill="none"/>
  <text x="690" y="148" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">MA60</text>
  <!-- MA5 短线 -->
  <path d="M 80 240 Q 150 210, 200 190 Q 240 175, 260 175 Q 280 175, 310 175 Q 350 165, 400 145 Q 450 130, 500 130 Q 540 130, 560 145 Q 590 170, 620 200" stroke="#dc2626" stroke-width="2.5" fill="none"/>
  <text x="690" y="200" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7f1d1d">MA5</text>
  <!-- 金叉 -->
  <circle cx="300" cy="180" r="6" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
  <text x="300" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#92400e">金叉</text>
  <text x="300" y="138" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#92400e">短线穿长线 ↑</text>
  <line x1="300" y1="142" x2="300" y2="174" stroke="#92400e" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- 死叉 -->
  <circle cx="560" cy="145" r="6" fill="#6b7280" stroke="#1f2937" stroke-width="2"/>
  <text x="560" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1f2937">死叉</text>
  <text x="560" y="118" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1f2937">短线穿长线 ↓</text>
  <line x1="560" y1="122" x2="560" y2="140" stroke="#1f2937" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="360" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">金叉 ≈ 买入信号 ｜ 死叉 ≈ 卖出信号 ｜ 但胜率约 55%，不能孤立用</text>
</svg>
