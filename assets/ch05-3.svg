<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">个人风险等级的决策流程</text>
  <!-- 步骤 1 -->
  <rect x="220" y="60" width="280" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="86" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">步骤 1：算客观承受能力</text>
  <text x="360" y="105" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">五维（年龄/收入/家庭/资产/职业）平均分</text>
  <!-- 箭头 -->
  <path d="M 360 120 L 360 150" stroke="#374151" stroke-width="2" marker-end="url(#arr1)"/>
  <!-- 步骤 2 -->
  <rect x="220" y="155" width="280" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="181" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#78350f">步骤 2：定客观上限</text>
  <text x="360" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f">查表得到"股票类资产上限 X%"</text>
  <!-- 箭头 -->
  <path d="M 360 215 L 360 245" stroke="#374151" stroke-width="2" marker-end="url(#arr1)"/>
  <!-- 步骤 3 -->
  <rect x="220" y="250" width="280" height="60" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <text x="360" y="276" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7c2d12">步骤 3：做心理压力测试</text>
  <text x="360" y="295" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7c2d12">想象 -50% / 5 年回不来 / 朋友赚 80%</text>
  <!-- 分叉 -->
  <path d="M 360 310 L 360 340" stroke="#374151" stroke-width="2"/>
  <path d="M 360 340 L 200 380" stroke="#374151" stroke-width="2" marker-end="url(#arr1)"/>
  <path d="M 360 340 L 520 380" stroke="#374151" stroke-width="2" marker-end="url(#arr1)"/>
  <text x="280" y="358" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">能承受</text>
  <text x="440" y="358" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">受不了</text>
  <!-- 步骤 4a -->
  <rect x="60" y="385" width="280" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="200" y="411" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">用 X% 作为风险比例</text>
  <text x="200" y="430" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">→ 第 06 章会教怎么具体分</text>
  <!-- 步骤 4b -->
  <rect x="380" y="385" width="280" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="520" y="411" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#991b1b">用 X% × 50% ~ 70%</text>
  <text x="520" y="430" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991b1b">把心理偏好叠加上去</text>
  <defs>
    <marker id="arr1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
