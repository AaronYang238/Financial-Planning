<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">中国养老三支柱：你退休后的钱从哪来</text>
  <!-- 屋顶 -->
  <polygon points="360,55 130,110 590,110" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="98" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#78350f">退休生活</text>
  <!-- 支柱一 -->
  <rect x="150" y="120" width="130" height="180" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="215" y="148" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">第一支柱</text>
  <text x="215" y="170" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">基本养老保险</text>
  <line x1="165" y1="182" x2="265" y2="182" stroke="#2563eb" stroke-width="1"/>
  <text x="215" y="202" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">国家主导</text>
  <text x="215" y="220" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">覆盖 10 亿+人</text>
  <text x="215" y="245" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e3a8a">替代率 ≈ 40%</text>
  <text x="215" y="268" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic" fill="#6b7280">只够"温饱底线"</text>
  <text x="215" y="288" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">五险一金里的 8%+16%</text>
  <!-- 支柱二 -->
  <rect x="295" y="120" width="130" height="180" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="148" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">第二支柱</text>
  <text x="360" y="170" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">企业/职业年金</text>
  <line x1="310" y1="182" x2="410" y2="182" stroke="#16a34a" stroke-width="1"/>
  <text x="360" y="202" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">单位主导</text>
  <text x="360" y="220" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">覆盖 ≈ 7000 万人</text>
  <text x="360" y="245" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#14532d">有就是福利</text>
  <text x="360" y="268" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic" fill="#6b7280">多数民企没有</text>
  <text x="360" y="288" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">体制内/大厂为主</text>
  <!-- 支柱三 -->
  <rect x="440" y="120" width="130" height="180" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="505" y="148" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#831843">第三支柱</text>
  <text x="505" y="170" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#831843">个人养老金</text>
  <line x1="455" y1="182" x2="555" y2="182" stroke="#db2777" stroke-width="1"/>
  <text x="505" y="202" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#831843">个人主导（2022 起）</text>
  <text x="505" y="220" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#831843">自愿开户</text>
  <text x="505" y="245" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#831843">年缴上限 1.2 万</text>
  <text x="505" y="268" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic" fill="#6b7280">缴费全额抵税</text>
  <text x="505" y="288" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">封闭至退休领取</text>
  <!-- 地基 -->
  <rect x="130" y="310" width="460" height="34" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="360" y="332" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#374151">第四块拼图：你自己的投资组合（本教程 42 章教的事）</text>
  <text x="360" y="366" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#444">第一支柱只够温饱、第二支柱多数人没有——所以第三支柱 + 自主投资是你能掌控的部分</text>
</svg>
