<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">同样年化 8%，过程完全不同</text>
  <!-- 坐标轴 -->
  <line x1="80" y1="280" x2="680" y2="280" stroke="#374151" stroke-width="2"/>
  <line x1="80" y1="280" x2="80" y2="60" stroke="#374151" stroke-width="2"/>
  <!-- 横轴 -->
  <text x="80" y="300" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">起点</text>
  <text x="200" y="300" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">第1年</text>
  <text x="320" y="300" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">第2年</text>
  <text x="440" y="300" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">第3年</text>
  <text x="560" y="300" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">第4年</text>
  <text x="680" y="300" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">第5年</text>
  <!-- 纵轴 -->
  <text x="72" y="284" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">10万</text>
  <text x="72" y="223" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">12万</text>
  <text x="72" y="162" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">14万</text>
  <text x="72" y="101" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">16万</text>
  <line x1="80" y1="223" x2="680" y2="223" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="80" y1="162" x2="680" y2="162" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="80" y1="101" x2="680" y2="101" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <!-- A 基金: 10→10.8→11.66→12.6→13.6→14.7 -->
  <polyline points="80,280 200,256 320,229 440,201 560,170 680,137" stroke="#2563eb" stroke-width="3" fill="none"/>
  <circle cx="80" cy="280" r="3" fill="#2563eb"/>
  <circle cx="200" cy="256" r="3" fill="#2563eb"/>
  <circle cx="320" cy="229" r="3" fill="#2563eb"/>
  <circle cx="440" cy="201" r="3" fill="#2563eb"/>
  <circle cx="560" cy="170" r="3" fill="#2563eb"/>
  <circle cx="680" cy="137" r="3" fill="#2563eb"/>
  <text x="540" y="125" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e40af">A 基金（平稳）</text>
  <!-- B 基金: 10→15→10.5→14.7→11.76→14.7 -->
  <polyline points="80,280 200,127 320,265 440,138 560,224 680,137" stroke="#dc2626" stroke-width="3" fill="none"/>
  <circle cx="80" cy="280" r="3" fill="#dc2626"/>
  <circle cx="200" cy="127" r="3" fill="#dc2626"/>
  <circle cx="320" cy="265" r="3" fill="#dc2626"/>
  <circle cx="440" cy="138" r="3" fill="#dc2626"/>
  <circle cx="560" cy="224" r="3" fill="#dc2626"/>
  <circle cx="680" cy="137" r="3" fill="#dc2626"/>
  <text x="220" y="118" font-family="sans-serif" font-size="12" font-weight="bold" fill="#991b1b">B 基金（颠簸）</text>
  <!-- 终点标注 -->
  <text x="690" y="155" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1f2937">14.7万</text>
</svg>
