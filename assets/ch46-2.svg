<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">打新股流程：低风险"薅羊毛"的四步</text>
  <defs><marker id="a46" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#2563eb"/></marker></defs>
  <g font-family="sans-serif">
  <rect x="40" y="110" width="140" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="110" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">① 持仓市值</text>
  <text x="110" y="162" text-anchor="middle" font-size="10" fill="#1e3a8a">沪/深市各需</text>
  <text x="110" y="178" text-anchor="middle" font-size="10" fill="#1e3a8a">底仓股票市值</text>

  <rect x="220" y="110" width="140" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="290" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">② 申购</text>
  <text x="290" y="162" text-anchor="middle" font-size="10" fill="#1e3a8a">新股发行日</text>
  <text x="290" y="178" text-anchor="middle" font-size="10" fill="#1e3a8a">一键顶格申购</text>

  <rect x="400" y="110" width="140" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="470" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">③ 中签</text>
  <text x="470" y="162" text-anchor="middle" font-size="10" fill="#1e3a8a">摇号，概率低</text>
  <text x="470" y="178" text-anchor="middle" font-size="10" fill="#1e3a8a">中签后按时缴款</text>

  <rect x="580" y="110" width="140" height="90" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="650" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">④ 上市卖出</text>
  <text x="650" y="162" text-anchor="middle" font-size="10" fill="#14532d">上市首日/数日</text>
  <text x="650" y="178" text-anchor="middle" font-size="10" fill="#14532d">通常溢价了结</text>
  </g>
  <path d="M182 155 L218 155" stroke="#2563eb" stroke-width="2" marker-end="url(#a46)"/>
  <path d="M362 155 L398 155" stroke="#2563eb" stroke-width="2" marker-end="url(#a46)"/>
  <path d="M542 155 L578 155" stroke="#2563eb" stroke-width="2" marker-end="url(#a46)"/>
  <text x="360" y="245" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">本质：用一笔底仓换"抽奖资格"。风险点 = 底仓本身会涨跌 + 注册制下新股可能破发</text>
  <text x="360" y="275" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#7f1d1d">⚠ "新股必涨"已成历史——注册制后破发常见，中签≠稳赚，需看基本面与估值</text>
</svg>
