<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">REITs 估值四象限：分派率 × P/NAV</text>
  <!-- 坐标轴 -->
  <line x1="120" y1="350" x2="660" y2="350" stroke="#374151" stroke-width="2"/>
  <line x1="120" y1="350" x2="120" y2="70" stroke="#374151" stroke-width="2"/>
  <text x="390" y="385" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">P/NAV（市价 ÷ 净资产）→</text>
  <text x="60" y="210" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937" transform="rotate(-90 60 210)">分派率 →</text>
  <!-- 轴刻度 -->
  <text x="250" y="368" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">低（&lt; 1.0 折价）</text>
  <text x="530" y="368" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">高（&gt; 1.3 溢价）</text>
  <text x="110" y="300" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">低</text>
  <text x="110" y="120" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">高</text>
  <!-- 中线 -->
  <line x1="390" y1="350" x2="390" y2="70" stroke="#9ca3af" stroke-dasharray="3,3"/>
  <line x1="120" y1="210" x2="660" y2="210" stroke="#9ca3af" stroke-dasharray="3,3"/>
  <!-- 左上：真便宜 -->
  <rect x="125" y="75" width="260" height="130" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="255" y="105" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#14532d">分派率高 + P/NAV 低</text>
  <text x="255" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">✓ 真便宜（买入信号）</text>
  <text x="255" y="155" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">但要查折价原因</text>
  <text x="255" y="172" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">（租约到期？地段问题？）</text>
  <!-- 右上：看似高息 -->
  <rect x="395" y="75" width="260" height="130" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="525" y="105" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#78350f">分派率高 + P/NAV 高</text>
  <text x="525" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#78350f">⚠️ 警惕</text>
  <text x="525" y="155" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">高分派可能不可持续</text>
  <text x="525" y="172" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">（一次性分派抬高数字）</text>
  <!-- 左下：观察 -->
  <rect x="125" y="215" width="260" height="130" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="255" y="245" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">分派率低 + P/NAV 低</text>
  <text x="255" y="270" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">🔍 观察</text>
  <text x="255" y="295" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">市场担忧底层资产质量</text>
  <text x="255" y="312" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">等基本面信号再说</text>
  <!-- 右下：避开 -->
  <rect x="395" y="215" width="260" height="130" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="525" y="245" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#991b1b">分派率低 + P/NAV 高</text>
  <text x="525" y="270" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#991b1b">❌ 严重高估（避开）</text>
  <text x="525" y="295" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">既贵又不分钱</text>
  <text x="525" y="312" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">常见于炒作期的热门 REITs</text>
</svg>
