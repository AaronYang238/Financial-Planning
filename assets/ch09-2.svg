<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">货币基金赎回机制：T+0 vs T+1</text>
  <!-- 左：T+0 快速赎回 -->
  <rect x="40" y="70" width="320" height="280" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="200" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#14532d">T+0 快速赎回</text>
  <line x1="60" y1="115" x2="340" y2="115" stroke="#16a34a" stroke-width="1"/>
  <text x="60" y="140" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14532d">额度：每日 1 万元</text>
  <text x="60" y="160" font-family="sans-serif" font-size="11" fill="#14532d">（同一身份证下，所有平台合并算）</text>
  <text x="60" y="185" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14532d">到账：实时（几秒）</text>
  <text x="60" y="210" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14532d">机制：基金公司用自有资金垫付</text>
  <text x="60" y="230" font-family="sans-serif" font-size="11" fill="#14532d">→ 之后再向基金扣份额</text>
  <text x="60" y="270" font-family="sans-serif" font-size="11" font-style="italic" fill="#14532d">✓ 适合：临时缺钱、买药、打车</text>
  <text x="60" y="290" font-family="sans-serif" font-size="11" font-style="italic" fill="#14532d">✓ 适合：应急金第一档（小额）</text>
  <text x="60" y="320" font-family="sans-serif" font-size="11" font-style="italic" fill="#991b1b">✗ 不适合：大额转账 / 装修付款</text>
  <!-- 右：T+1 普通赎回 -->
  <rect x="380" y="70" width="320" height="280" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="540" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">T+1 普通赎回</text>
  <line x1="400" y1="115" x2="680" y2="115" stroke="#2563eb" stroke-width="1"/>
  <text x="400" y="140" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">额度：无限制（无上限）</text>
  <text x="400" y="160" font-family="sans-serif" font-size="11" fill="#1e3a8a">（大型货基对单日 5000 万设限）</text>
  <text x="400" y="185" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">到账：T+1 工作日</text>
  <text x="400" y="210" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">机制：基金真的卖出资产取现</text>
  <text x="400" y="230" font-family="sans-serif" font-size="11" fill="#1e3a8a">→ 周五申请，下周一到账</text>
  <text x="400" y="270" font-family="sans-serif" font-size="11" font-style="italic" fill="#1e3a8a">✓ 适合：买房首付 / 装修</text>
  <text x="400" y="290" font-family="sans-serif" font-size="11" font-style="italic" fill="#1e3a8a">✓ 适合：转去股票账户买入</text>
  <text x="400" y="320" font-family="sans-serif" font-size="11" font-style="italic" fill="#991b1b">✗ 注意：周末/节假日顺延</text>
  <text x="360" y="380" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">日常用 T+0 救急，大额提前 1-2 个工作日做 T+1</text>
</svg>
