<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">A 股 vs 港股 vs 美股：八个核心差异</text>
  <!-- 表头 -->
  <text x="160" y="70" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">维度</text>
  <text x="340" y="70" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626">A 股</text>
  <text x="470" y="70" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#d97706">港股</text>
  <text x="600" y="70" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">美股</text>
  <line x1="60" y1="80" x2="680" y2="80" stroke="#374151" stroke-width="1.5"/>
  <!-- 交易日制度 -->
  <text x="160" y="105" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">交易制度</text>
  <text x="340" y="105" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7f1d1d">T+1</text>
  <text x="470" y="105" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7c2d12">T+0</text>
  <text x="600" y="105" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">T+0</text>
  <!-- 涨跌停 -->
  <text x="160" y="135" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">涨跌停</text>
  <text x="340" y="135" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f1d1d">±10%/20%/30%</text>
  <text x="470" y="135" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7c2d12">无限制</text>
  <text x="600" y="135" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e40af">无限制</text>
  <!-- 最小买入 -->
  <text x="160" y="165" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">最小买入</text>
  <text x="340" y="165" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7f1d1d">100 股（1 手）</text>
  <text x="470" y="165" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7c2d12">视股票而定</text>
  <text x="600" y="165" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">1 股</text>
  <!-- 交易时段 -->
  <text x="160" y="195" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">交易时段</text>
  <text x="340" y="195" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7f1d1d">9:30-11:30/13-15</text>
  <text x="470" y="195" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7c2d12">9:30-12/13-16</text>
  <text x="600" y="195" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#1e40af">21:30-04:00</text>
  <!-- 做空 -->
  <text x="160" y="225" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">做空机制</text>
  <text x="340" y="225" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7f1d1d">受限</text>
  <text x="470" y="225" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7c2d12">较开放</text>
  <text x="600" y="225" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">完全开放</text>
  <!-- 投资者结构 -->
  <text x="160" y="255" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">主力投资者</text>
  <text x="340" y="255" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7f1d1d">散户 ≈ 60%</text>
  <text x="470" y="255" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7c2d12">机构 70%+</text>
  <text x="600" y="255" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">机构 80%+</text>
  <!-- 退市 -->
  <text x="160" y="285" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">退市力度</text>
  <text x="340" y="285" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7f1d1d">较弱（近年加强）</text>
  <text x="470" y="285" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7c2d12">中</text>
  <text x="600" y="285" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">强</text>
  <!-- 分红 -->
  <text x="160" y="315" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">分红文化</text>
  <text x="340" y="315" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7f1d1d">不普遍</text>
  <text x="470" y="315" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7c2d12">普遍</text>
  <text x="600" y="315" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">普遍</text>
  <!-- 估值 -->
  <text x="160" y="345" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">PE 中位数</text>
  <text x="340" y="345" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7f1d1d">15-25</text>
  <text x="470" y="345" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7c2d12">8-15（偏低）</text>
  <text x="600" y="345" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">20-30</text>
  <line x1="60" y1="365" x2="680" y2="365" stroke="#374151" stroke-width="1"/>
  <!-- 总结 -->
  <text x="360" y="395" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">三个市场的"性格"</text>
  <text x="340" y="420" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7f1d1d">情绪化、波动大</text>
  <text x="340" y="436" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f1d1d">短期机会多</text>
  <text x="470" y="420" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7c2d12">价值洼地</text>
  <text x="470" y="436" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7c2d12">流动性差</text>
  <text x="600" y="420" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">规则成熟</text>
  <text x="600" y="436" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e40af">估值高</text>
</svg>
