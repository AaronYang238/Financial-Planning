<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">指数基金的四大优势</text>
  <!-- 1. 费率低 -->
  <rect x="40" y="60" width="320" height="140" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">① 费率极低</text>
  <line x1="60" y1="105" x2="340" y2="105" stroke="#2563eb" stroke-width="1"/>
  <text x="200" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">指数基金管理费：0.15% - 0.5%</text>
  <text x="200" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">主动基金管理费：1.5% - 2%</text>
  <text x="200" y="175" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#1e3a8a">30 年下来差距巨大（复利）</text>
  <!-- 2. 长期跑赢主动 -->
  <rect x="380" y="60" width="320" height="140" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="540" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#14532d">② 长期跑赢 80% 主动基金</text>
  <line x1="400" y1="105" x2="680" y2="105" stroke="#16a34a" stroke-width="1"/>
  <text x="540" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">10 年期：80% 主动基金跑输指数</text>
  <text x="540" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">20 年期：90% 主动基金跑输指数</text>
  <text x="540" y="175" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#14532d">基础规律：扣完费后多数主动都败北</text>
  <!-- 3. 简单 -->
  <rect x="40" y="220" width="320" height="140" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="200" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#78350f">③ 简单可执行</text>
  <line x1="60" y1="265" x2="340" y2="265" stroke="#d97706" stroke-width="1"/>
  <text x="200" y="290" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f">不用挑公司、不用看财报</text>
  <text x="200" y="310" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f">不用紧盯盘面、不用换手</text>
  <text x="200" y="335" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#78350f">"傻瓜式"投资，省时间</text>
  <!-- 4. 透明 -->
  <rect x="380" y="220" width="320" height="140" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="540" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#991b1b">④ 完全透明</text>
  <line x1="400" y1="265" x2="680" y2="265" stroke="#dc2626" stroke-width="1"/>
  <text x="540" y="290" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991b1b">成分股每天公开</text>
  <text x="540" y="310" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991b1b">不存在"基金经理跑路"风险</text>
  <text x="540" y="335" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#991b1b">不会有人偷偷换持仓</text>
</svg>
