<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">K 线结构：把四个价格压成一根棒</text>
  <!-- 阳线 -->
  <text x="180" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">阳线（涨）</text>
  <text x="180" y="83" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f1d1d">收盘 > 开盘 → 红色</text>
  <!-- 上影线 -->
  <line x1="180" y1="100" x2="180" y2="140" stroke="#dc2626" stroke-width="2"/>
  <!-- 实体 -->
  <rect x="160" y="140" width="40" height="120" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
  <!-- 下影线 -->
  <line x1="180" y1="260" x2="180" y2="290" stroke="#dc2626" stroke-width="2"/>
  <!-- 标注 -->
  <text x="220" y="105" font-family="sans-serif" font-size="10" fill="#374151">最高 105 ←</text>
  <text x="220" y="148" font-family="sans-serif" font-size="10" fill="#374151">收盘 102 ←</text>
  <text x="220" y="265" font-family="sans-serif" font-size="10" fill="#374151">开盘 95 ←</text>
  <text x="220" y="295" font-family="sans-serif" font-size="10" fill="#374151">最低 92 ←</text>
  <text x="180" y="320" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#7f1d1d">买方占优</text>
  <!-- 阴线 -->
  <text x="450" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#16a34a">阴线（跌）</text>
  <text x="450" y="83" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">收盘 < 开盘 → 绿色</text>
  <!-- 上影线 -->
  <line x1="450" y1="100" x2="450" y2="140" stroke="#16a34a" stroke-width="2"/>
  <!-- 实体（中空表示阴线，也可以用实色） -->
  <rect x="430" y="140" width="40" height="120" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <!-- 下影线 -->
  <line x1="450" y1="260" x2="450" y2="290" stroke="#16a34a" stroke-width="2"/>
  <!-- 标注 -->
  <text x="490" y="105" font-family="sans-serif" font-size="10" fill="#374151">最高 105 ←</text>
  <text x="490" y="148" font-family="sans-serif" font-size="10" fill="#374151">开盘 102 ←</text>
  <text x="490" y="265" font-family="sans-serif" font-size="10" fill="#374151">收盘 95 ←</text>
  <text x="490" y="295" font-family="sans-serif" font-size="10" fill="#374151">最低 92 ←</text>
  <text x="450" y="320" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#14532d">卖方占优</text>
  <text x="360" y="360" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">🇨🇳 注意：中国是"红涨绿跌"，美股欧股相反"绿涨红跌"</text>
</svg>
