<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">三大财报：三张表，三个问题</text>
  <!-- 利润表 -->
  <rect x="40" y="60" width="200" height="290" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">利润表</text>
  <text x="140" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">Income Statement</text>
  <line x1="60" y1="122" x2="220" y2="122" stroke="#2563eb" stroke-width="1"/>
  <text x="140" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">"赚没赚钱"</text>
  <text x="140" y="175" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">一段时间内的</text>
  <text x="140" y="192" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">收入 - 成本 - 费用</text>
  <text x="140" y="209" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">= 净利润</text>
  <line x1="60" y1="225" x2="220" y2="225" stroke="#2563eb" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="140" y="250" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">📊 流量</text>
  <text x="140" y="270" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">最容易"美化"</text>
  <text x="140" y="305" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#1e3a8a">看重: 毛利率</text>
  <text x="140" y="322" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#1e3a8a">净利率、营收增速</text>
  <!-- 资产负债表 -->
  <rect x="260" y="60" width="200" height="290" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#78350f">资产负债表</text>
  <text x="360" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">Balance Sheet</text>
  <line x1="280" y1="122" x2="440" y2="122" stroke="#d97706" stroke-width="1"/>
  <text x="360" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350f">"家底有多少"</text>
  <text x="360" y="175" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f">某一时刻的</text>
  <text x="360" y="192" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f">资产 = 负债 + 股东权益</text>
  <text x="360" y="209" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f">（永恒等式）</text>
  <line x1="280" y1="225" x2="440" y2="225" stroke="#d97706" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="360" y="250" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f">📷 存量</text>
  <text x="360" y="270" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f">公司"家底快照"</text>
  <text x="360" y="305" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#78350f">看重: 资产负债率</text>
  <text x="360" y="322" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#78350f">应收/存货/商誉</text>
  <!-- 现金流量表 -->
  <rect x="480" y="60" width="200" height="290" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="580" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#14532d">现金流量表</text>
  <text x="580" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">Cash Flow Statement</text>
  <line x1="500" y1="122" x2="660" y2="122" stroke="#16a34a" stroke-width="1"/>
  <text x="580" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14532d">"真金白银收到多少"</text>
  <text x="580" y="175" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">一段时间内的</text>
  <text x="580" y="192" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">经营 + 投资 + 筹资</text>
  <text x="580" y="209" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">三类现金流入流出</text>
  <line x1="500" y1="225" x2="660" y2="225" stroke="#16a34a" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="580" y="250" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">💰 流量</text>
  <text x="580" y="270" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">现金流不撒谎</text>
  <text x="580" y="305" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#14532d">看重: 经营现金流</text>
  <text x="580" y="322" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#14532d">vs 净利润比值</text>
  <text x="360" y="380" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">三张表互相印证：利润表"赚多少"+ 资产负债表"留多少"+ 现金流量表"真金白银多少"</text>
</svg>
