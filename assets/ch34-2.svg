<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">从 CAPM 到三因子：解释力 60-70% → 90%+</text>
  <!-- CAPM 侧 -->
  <text x="170" y="68" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937">CAPM（1964）</text>
  <rect x="100" y="120" width="140" height="150" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="190" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">市场因子</text>
  <text x="170" y="212" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">MKT（β）</text>
  <text x="170" y="295" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151">只用一个因子</text>
  <text x="170" y="315" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#991b1b">解释力 60-70%</text>
  <!-- 箭头 -->
  <path d="M 270 195 L 340 195" stroke="#374151" stroke-width="2.5" marker-end="url(#a34)"/>
  <text x="305" y="182" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">1992</text>
  <!-- FF3 侧 -->
  <text x="520" y="68" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937">Fama-French 三因子</text>
  <rect x="370" y="80" width="140" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="105" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">市场 MKT</text>
  <text x="440" y="125" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">（继承 CAPM）</text>
  <rect x="370" y="150" width="140" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="440" y="175" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14532d">规模 SMB</text>
  <text x="440" y="195" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">小盘 − 大盘</text>
  <rect x="370" y="220" width="140" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="440" y="245" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350f">价值 HML</text>
  <text x="440" y="265" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">低估值 − 高估值</text>
  <!-- 三因子合并到解释力 -->
  <path d="M 512 110 L 560 180" stroke="#9ca3af" stroke-width="1.5"/>
  <path d="M 512 180 L 560 185" stroke="#9ca3af" stroke-width="1.5"/>
  <path d="M 512 250 L 560 195" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="565" y="155" width="120" height="65" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="625" y="183" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#831843">解释力</text>
  <text x="625" y="205" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#831843">90%+</text>
  <!-- A 股注脚 -->
  <text x="520" y="305" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">A 股实证：SMB 年化 3-5%（比美国更大）、HML 年化 2-4%</text>
  <text x="520" y="322" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">落地工具见第 21 章 Smart Beta（红利 / 低波 / 质量 ETF）</text>
  <defs>
    <marker id="a34" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
