<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">四种家庭场景的应急金需求对比</text>
  <!-- 坐标轴 -->
  <line x1="80" y1="280" x2="680" y2="280" stroke="#374151" stroke-width="2"/>
  <line x1="80" y1="80" x2="80" y2="280" stroke="#374151" stroke-width="2"/>
  <!-- Y 轴刻度 -->
  <text x="70" y="285" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">0</text>
  <text x="70" y="245" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">5万</text>
  <line x1="78" y1="240" x2="80" y2="240" stroke="#6b7280" stroke-width="1"/>
  <text x="70" y="205" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">10万</text>
  <line x1="78" y1="200" x2="80" y2="200" stroke="#6b7280" stroke-width="1"/>
  <text x="70" y="165" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">15万</text>
  <line x1="78" y1="160" x2="80" y2="160" stroke="#6b7280" stroke-width="1"/>
  <text x="70" y="125" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">20万</text>
  <line x1="78" y1="120" x2="80" y2="120" stroke="#6b7280" stroke-width="1"/>
  <!-- 柱子 1: 北京互联网工程师 6.4 万 -->
  <rect x="130" y="229" width="80" height="51" fill="#3b82f6"/>
  <text x="170" y="222" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">6.4万</text>
  <text x="170" y="298" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">北京互联网</text>
  <text x="170" y="313" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">单身</text>
  <text x="170" y="328" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">8个月×0.8万</text>
  <!-- 柱子 2: 成都公务员家庭 7 万 -->
  <rect x="270" y="224" width="80" height="56" fill="#16a34a"/>
  <text x="310" y="217" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14532d">7万</text>
  <text x="310" y="298" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">成都公务员</text>
  <text x="310" y="313" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">单职工+2娃</text>
  <text x="310" y="328" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">7个月×1万</text>
  <!-- 柱子 3: 杭州双码农 12.6 万 -->
  <rect x="410" y="154" width="80" height="126" fill="#f59e0b"/>
  <text x="450" y="147" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350f">12.6万</text>
  <text x="450" y="298" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">杭州双码农</text>
  <text x="450" y="313" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">双职工+1娃</text>
  <text x="450" y="328" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">7个月×1.8万</text>
  <!-- 柱子 4: 上海自由摄影师 16.5 万 -->
  <rect x="550" y="115" width="80" height="165" fill="#dc2626"/>
  <text x="590" y="108" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#991b1b">16.5万</text>
  <text x="590" y="298" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">上海自由职业</text>
  <text x="590" y="313" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">摄影师</text>
  <text x="590" y="328" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">11个月×1.5万</text>
</svg>
