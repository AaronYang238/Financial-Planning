<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">中国 CPI 八大类的"购物篮"权重</text>
  <!-- 横向条形图 -->
  <!-- 食品烟酒 28% -->
  <text x="170" y="74" text-anchor="end" font-family="sans-serif" font-size="11" fill="#1f2937">食品烟酒</text>
  <rect x="180" y="60" width="364" height="20" fill="#f87171"/>
  <text x="555" y="74" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">28%</text>
  <!-- 居住 23% -->
  <text x="170" y="104" text-anchor="end" font-family="sans-serif" font-size="11" fill="#1f2937">居住</text>
  <rect x="180" y="90" width="299" height="20" fill="#fb923c"/>
  <text x="490" y="104" font-family="sans-serif" font-size="11" font-weight="bold" fill="#9a3412">23%</text>
  <!-- 交通通信 13% -->
  <text x="170" y="134" text-anchor="end" font-family="sans-serif" font-size="11" fill="#1f2937">交通通信</text>
  <rect x="180" y="120" width="169" height="20" fill="#fbbf24"/>
  <text x="360" y="134" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78350f">13%</text>
  <!-- 教育文化娱乐 10% -->
  <text x="170" y="164" text-anchor="end" font-family="sans-serif" font-size="11" fill="#1f2937">教育文化娱乐</text>
  <rect x="180" y="150" width="130" height="20" fill="#a3e635"/>
  <text x="320" y="164" font-family="sans-serif" font-size="11" font-weight="bold" fill="#365314">10%</text>
  <!-- 医疗保健 10% -->
  <text x="170" y="194" text-anchor="end" font-family="sans-serif" font-size="11" fill="#1f2937">医疗保健</text>
  <rect x="180" y="180" width="130" height="20" fill="#4ade80"/>
  <text x="320" y="194" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">10%</text>
  <!-- 衣着 7% -->
  <text x="170" y="224" text-anchor="end" font-family="sans-serif" font-size="11" fill="#1f2937">衣着</text>
  <rect x="180" y="210" width="91" height="20" fill="#22d3ee"/>
  <text x="281" y="224" font-family="sans-serif" font-size="11" font-weight="bold" fill="#155e75">7%</text>
  <!-- 生活用品 6% -->
  <text x="170" y="254" text-anchor="end" font-family="sans-serif" font-size="11" fill="#1f2937">生活用品及服务</text>
  <rect x="180" y="240" width="78" height="20" fill="#818cf8"/>
  <text x="268" y="254" font-family="sans-serif" font-size="11" font-weight="bold" fill="#312e81">6%</text>
  <!-- 其他 3% -->
  <text x="170" y="284" text-anchor="end" font-family="sans-serif" font-size="11" fill="#1f2937">其他用品和服务</text>
  <rect x="180" y="270" width="39" height="20" fill="#c084fc"/>
  <text x="229" y="284" font-family="sans-serif" font-size="11" font-weight="bold" fill="#581c87">3%</text>
  <text x="360" y="320" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">注意：房价不在 CPI 里，"居住"算的是租金等价</text>
</svg>
