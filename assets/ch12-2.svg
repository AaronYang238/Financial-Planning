<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">中国地方债利差示意（vs 同期国债）</text>
  <text x="360" y="48" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">不同财政实力地区，地方债 - 国债的利差差别明显</text>
  <!-- 基准线 -->
  <line x1="100" y1="320" x2="650" y2="320" stroke="#374151" stroke-width="2"/>
  <line x1="100" y1="80" x2="100" y2="320" stroke="#374151" stroke-width="2"/>
  <!-- Y 刻度 -->
  <text x="90" y="324" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">0 bp</text>
  <text x="90" y="270" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">10 bp</text>
  <line x1="98" y1="265" x2="100" y2="265" stroke="#6b7280" stroke-width="1"/>
  <text x="90" y="220" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">20 bp</text>
  <line x1="98" y1="215" x2="100" y2="215" stroke="#6b7280" stroke-width="1"/>
  <text x="90" y="170" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">30 bp</text>
  <line x1="98" y1="165" x2="100" y2="165" stroke="#6b7280" stroke-width="1"/>
  <text x="90" y="120" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">50 bp</text>
  <line x1="98" y1="115" x2="100" y2="115" stroke="#6b7280" stroke-width="1"/>
  <text x="60" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#374151" transform="rotate(-90 60 190)">利差（vs 国债）</text>
  <!-- 柱子：北京 -->
  <rect x="130" y="290" width="80" height="30" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
  <text x="170" y="285" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">5-8 bp</text>
  <text x="170" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">北京 / 上海</text>
  <text x="170" y="355" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">财政最强</text>
  <!-- 柱子：江苏 -->
  <rect x="230" y="270" width="80" height="50" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="270" y="265" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">10-15 bp</text>
  <text x="270" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">江苏/浙江/广东</text>
  <text x="270" y="355" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">东部沿海</text>
  <!-- 柱子：四川 -->
  <rect x="330" y="240" width="80" height="80" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="370" y="235" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78350f">15-25 bp</text>
  <text x="370" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">四川/湖南/河南</text>
  <text x="370" y="355" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">中部省份</text>
  <!-- 柱子：辽宁 -->
  <rect x="430" y="195" width="80" height="125" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <text x="470" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7c2d12">25-35 bp</text>
  <text x="470" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">辽宁/吉林/黑龙江</text>
  <text x="470" y="355" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">东北</text>
  <!-- 柱子：贵州 -->
  <rect x="530" y="145" width="80" height="175" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
  <text x="570" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">35-50 bp</text>
  <text x="570" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">贵州/云南/甘肃</text>
  <text x="570" y="355" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">西部 + 高债务</text>
</svg>
