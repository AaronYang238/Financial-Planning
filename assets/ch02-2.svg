<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">72 法则：年化 × 翻倍年数 ≈ 72</text>
  <!-- 横轴: 年化 -->
  <line x1="80" y1="260" x2="680" y2="260" stroke="#374151" stroke-width="2"/>
  <text x="380" y="295" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151">年化收益率</text>
  <!-- 纵轴 -->
  <line x1="80" y1="260" x2="80" y2="60" stroke="#374151" stroke-width="2"/>
  <text x="40" y="160" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" transform="rotate(-90 40 160)">翻倍年数</text>
  <!-- 横轴刻度 -->
  <text x="160" y="278" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">2%</text>
  <text x="240" y="278" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">4%</text>
  <text x="320" y="278" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">6%</text>
  <text x="400" y="278" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">8%</text>
  <text x="480" y="278" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">10%</text>
  <text x="560" y="278" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">15%</text>
  <text x="640" y="278" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">20%</text>
  <!-- 纵轴刻度 -->
  <text x="72" y="264" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">0</text>
  <text x="72" y="206" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">10</text>
  <text x="72" y="148" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">20</text>
  <text x="72" y="90" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">30</text>
  <!-- 柱 -->
  <rect x="143" y="60" width="34" height="200" fill="#fca5a5"/>
  <text x="160" y="54" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7f1d1d">35</text>
  <rect x="223" y="158" width="34" height="102" fill="#fdba74"/>
  <text x="240" y="152" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7c2d12">18</text>
  <rect x="303" y="191" width="34" height="69" fill="#fcd34d"/>
  <text x="320" y="185" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78350f">12</text>
  <rect x="383" y="208" width="34" height="52" fill="#fde68a"/>
  <text x="400" y="202" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78350f">9</text>
  <rect x="463" y="218" width="34" height="42" fill="#86efac"/>
  <text x="480" y="212" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">7.3</text>
  <rect x="543" y="231" width="34" height="29" fill="#6ee7b7"/>
  <text x="560" y="225" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#064e3b">5</text>
  <rect x="623" y="238" width="34" height="22" fill="#34d399"/>
  <text x="640" y="232" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#064e3b">3.8</text>
</svg>
