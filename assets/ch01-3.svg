<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">储蓄率 → 从零开始到财务自由所需年数</text>
  <!-- 坐标轴 -->
  <line x1="80" y1="320" x2="700" y2="320" stroke="#374151" stroke-width="2"/>
  <line x1="80" y1="320" x2="80" y2="60" stroke="#374151" stroke-width="2"/>
  <text x="40" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151" transform="rotate(-90 40 180)">工作年数</text>
  <text x="390" y="365" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151">储蓄率</text>
  <!-- 横轴刻度 -->
  <text x="80" y="340" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">0</text>
  <text x="170" y="340" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">10%</text>
  <text x="245" y="340" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">20%</text>
  <text x="320" y="340" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">30%</text>
  <text x="395" y="340" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">40%</text>
  <text x="470" y="340" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">50%</text>
  <text x="545" y="340" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">60%</text>
  <text x="620" y="340" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">70%</text>
  <text x="695" y="340" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">80%</text>
  <!-- 纵轴刻度 -->
  <line x1="76" y1="80" x2="80" y2="80" stroke="#374151"/>
  <text x="70" y="84" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">50</text>
  <line x1="76" y1="200" x2="80" y2="200" stroke="#374151"/>
  <text x="70" y="204" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">25</text>
  <line x1="76" y1="320" x2="80" y2="320" stroke="#374151"/>
  <text x="70" y="324" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b7280">0</text>
  <!-- 柱状 -->
  <rect x="155" y="75" width="30" height="245" fill="#ef4444"/>
  <text x="170" y="68" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">51</text>
  <rect x="230" y="143" width="30" height="177" fill="#f97316"/>
  <text x="245" y="136" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#9a3412">37</text>
  <rect x="305" y="186" width="30" height="134" fill="#f59e0b"/>
  <text x="320" y="179" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#92400e">28</text>
  <rect x="380" y="214" width="30" height="106" fill="#eab308"/>
  <text x="395" y="207" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#854d0e">22</text>
  <rect x="455" y="238" width="30" height="82" fill="#84cc16"/>
  <text x="470" y="231" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#3f6212">17</text>
  <rect x="530" y="260" width="30" height="60" fill="#22c55e"/>
  <text x="545" y="253" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#166534">12.5</text>
  <rect x="605" y="279" width="30" height="41" fill="#10b981"/>
  <text x="620" y="272" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#065f46">8.5</text>
  <rect x="680" y="294" width="30" height="26" fill="#059669"/>
  <text x="695" y="287" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#064e3b">5.5</text>
</svg>
