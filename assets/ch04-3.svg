<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">最大回撤：从山顶到山谷跌了多少</text>
  <line x1="60" y1="260" x2="700" y2="260" stroke="#374151" stroke-width="2"/>
  <line x1="60" y1="260" x2="60" y2="60" stroke="#374151" stroke-width="2"/>
  <text x="40" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151" transform="rotate(-90 40 160)">账户净值</text>
  <text x="380" y="290" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">时间</text>
  <!-- 净值曲线 -->
  <path d="M 60 230 Q 130 210, 180 180 Q 230 150, 280 100 Q 310 90, 330 92 Q 360 100, 400 200 Q 430 250, 470 245 Q 510 230, 560 180 Q 610 130, 700 90" stroke="#2563eb" stroke-width="2.5" fill="none"/>
  <!-- 峰值点 -->
  <circle cx="330" cy="92" r="6" fill="#dc2626"/>
  <text x="330" y="78" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">峰值 100</text>
  <!-- 谷值点 -->
  <circle cx="470" cy="245" r="6" fill="#dc2626"/>
  <text x="495" y="252" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">谷值 55</text>
  <!-- 回撤标注（垂直双向箭头） -->
  <line x1="540" y1="92" x2="540" y2="245" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="535" y1="92" x2="545" y2="92" stroke="#dc2626" stroke-width="2"/>
  <line x1="535" y1="245" x2="545" y2="245" stroke="#dc2626" stroke-width="2"/>
  <text x="558" y="172" font-family="sans-serif" font-size="13" font-weight="bold" fill="#991b1b">↕ 回撤 45%</text>
  <text x="558" y="190" font-family="sans-serif" font-size="10" fill="#991b1b">= (100-55)/100</text>
  <!-- 恢复期标注 -->
  <line x1="330" y1="270" x2="630" y2="270" stroke="#16a34a" stroke-width="1.5"/>
  <text x="480" y="285" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#15803d">↔ 恢复期：可能 2-5 年</text>
</svg>
