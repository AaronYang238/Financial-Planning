<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" style="max-width:720px;display:block;margin:1em auto;background:#fafafa;border-radius:8px">
  <text x="360" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">三层目标 = 三种不同的钱袋子</text>
  <!-- 短期 -->
  <rect x="40" y="70" width="200" height="200" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="100" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e3a8a">短期</text>
  <text x="140" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">（1 年内）</text>
  <line x1="60" y1="135" x2="220" y2="135" stroke="#2563eb" stroke-width="1"/>
  <text x="140" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">不能亏</text>
  <text x="140" y="185" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">例子</text>
  <text x="140" y="205" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">应急储备 6 万</text>
  <text x="140" y="225" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">年底装修 5 万</text>
  <text x="140" y="255" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#1e3a8a">放：货币基金</text>
  <!-- 中期 -->
  <rect x="260" y="70" width="200" height="200" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="100" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#78350f">中期</text>
  <text x="360" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f">（1–5 年）</text>
  <line x1="280" y1="135" x2="440" y2="135" stroke="#d97706" stroke-width="1"/>
  <text x="360" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f">接受小波动</text>
  <text x="360" y="185" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350f">例子</text>
  <text x="360" y="205" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f">5 年买房首付 80 万</text>
  <text x="360" y="225" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f">3 年读 MBA 30 万</text>
  <text x="360" y="255" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#78350f">放：债基+少量股基</text>
  <!-- 长期 -->
  <rect x="480" y="70" width="200" height="200" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="580" y="100" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#14532d">长期</text>
  <text x="580" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">（5 年以上）</text>
  <line x1="500" y1="135" x2="660" y2="135" stroke="#16a34a" stroke-width="1"/>
  <text x="580" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">接受大波动</text>
  <text x="580" y="185" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14532d">例子</text>
  <text x="580" y="205" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">60 岁退休 600 万</text>
  <text x="580" y="225" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">孩子大学学费</text>
  <text x="580" y="255" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#14532d">放：指数基金+股票</text>
  <text x="360" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444">不同目标对应不同期限，不同期限对应不同风险承受能力</text>
</svg>
